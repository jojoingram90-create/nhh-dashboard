// Today's Flow is one merged, time-sorted list — wake-ups, showers, meals, scheduled routines, and
// bedtimes for every resident, interleaved by actual clock time rather than grouped into fixed
// category sections. See todaysFlowRows() for how each row gets its time.
function renderTodaysFlow(){
  const rows = todaysFlowRows();
  const now = nowTimeStr();
  const currentBucketKey = flowBucketFor(now).key;

  // Lazy-init: only the bucket matching the real current time starts expanded. Set once, then left
  // alone across re-renders so a manager's manual expand/collapse choices persist while checking things off.
  if(state.flowExpandedBuckets === null){
    state.flowExpandedBuckets = { [currentBucketKey]: true };
  }

  const byBucket = {};
  FLOW_BUCKETS.forEach(b=>{ byBucket[b.key] = []; });
  rows.forEach(row=>{ byBucket[flowBucketFor(row.time).key].push(row); });

  const nonEmptyBuckets = FLOW_BUCKETS.filter(b=>byBucket[b.key].length>0);

  const bucketsHtml = nonEmptyBuckets.map(b=>{
    const bucketRows = byBucket[b.key];
    const pending = bucketRows.filter(r=>!isFlowRowDone(r));
    const completed = bucketRows.filter(isFlowRowDone);
    const expanded = !!state.flowExpandedBuckets[b.key];
    const isCurrent = b.key === currentBucketKey;

    let innerHtml;
    if(pending.length===0){
      innerHtml = `<div class="task-row" style="border-top:none;"><div class="task-row-desc" style="font-style:italic;">Everything in ${b.label.toLowerCase()} is checked off.</div></div>`;
    } else {
      let markerPlaced = !isCurrent; // the Now divider only ever falls inside the current-time bucket
      innerHtml = pending.map(row=>{
        let out = "";
        const isNext = !markerPlaced && row.time && row.time >= now;
        if(isNext){
          out += `<div class="flow-now-marker"><span>Now — ${formatTime12(now)}</span></div>`;
          markerPlaced = true;
        }
        out += renderFlowRow(row, isNext);
        return out;
      }).join("");
      if(isCurrent && !markerPlaced) innerHtml += `<div class="flow-now-marker"><span>Now — ${formatTime12(now)}</span></div>`;
    }

    const completedHtml = completed.length ? `
      <div class="flow-completed-toggle" onclick="toggleBucketCompleted('${b.key}')">${state.flowBucketShowCompleted[b.key] ? "▾" : "▸"} ✓ ${completed.length} completed</div>
      ${state.flowBucketShowCompleted[b.key] ? completed.map(r=>renderFlowRow(r,false)).join("") : ""}` : "";

    return `
    <div class="flow-bucket">
      <button class="flow-bucket-toggle" onclick="toggleFlowBucket('${b.key}')">
        <span class="flow-bucket-caret">${expanded ? "▾" : "▸"}</span>
        <span class="flow-bucket-label">${b.label}</span>
        ${isCurrent ? `<span class="flow-bucket-now-pill">Now</span>` : ""}
        <span class="flow-bucket-count">${completed.length}/${bucketRows.length}</span>
      </button>
      ${expanded ? `<div class="flow-bucket-body">${innerHtml}${completedHtml}</div>` : ""}
    </div>`;
  }).join("");

  return `
  <div class="card flow-block">
    <div class="flow-head"><span class="ic">🕐</span><h3>Today's Flow</h3><span class="shift-tag">Sorted by time</span></div>
    ${nonEmptyBuckets.length ? bucketsHtml : `<div class="task-row" style="border-top:none;"><div class="task-row-desc" style="font-style:italic;">Nothing scheduled for today.</div></div>`}
  </div>`;
}

// Each of the five time-of-day windows Johnna set (Overnight/Morning/Midday/Evening/Night). Only the
// one containing the real current clock time starts expanded; the rest collapse to a one-line header
// a manager can tap open. "before" is the exclusive upper bound of the window, compared as "HH:MM".
const FLOW_BUCKETS = [
  { key:"overnight", label:"Overnight", before:"05:00" },
  { key:"morning",   label:"Morning",   before:"11:00" },
  { key:"midday",    label:"Midday",    before:"16:00" },
  { key:"evening",   label:"Evening",   before:"19:00" },
  { key:"night",     label:"Night",     before:"24:00" }
];
function flowBucketFor(time){
  const t = time || "23:59";
  for(const b of FLOW_BUCKETS) if(t < b.before) return b;
  return FLOW_BUCKETS[FLOW_BUCKETS.length-1];
}
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function toggleFlowBucket(key){
  state.flowExpandedBuckets[key] = !state.flowExpandedBuckets[key];
  scheduleRender();
}
function toggleBucketCompleted(key){
  state.flowBucketShowCompleted[key] = !state.flowBucketShowCompleted[key];
  scheduleRender();
}

// Builds the merged row list: wake-ups and bedtimes (from carePlans wake/bedTime), showers
// (from carePlans hygiene, filtered to residents scheduled today), one grouped row per standard
// mealtime (breakfast/lunch/dinner — see below), and Scheduled Routines (already time-stamped).
// Every row shares one clock-time sort key, used both for the flat sort and for bucketing.
const MEAL_META = {
  breakfast: { icon:"🍳", label:"Breakfast" },
  lunch:     { icon:"🍛", label:"Lunch" },
  dinner:    { icon:"🥪", label:"Dinner" }
};
function todaysFlowRows(){
  const rows = [];

  // Wake-Up and Bedtime are grouped exactly like meals below: residents on the house-standard time
  // nest under one collapsible row, and a resident with a different Care Plan time gets a badge inside
  // it rather than a whole separate row scattered elsewhere in the list.
  const wakeMembers = wakeUpRows().map(row=>({ residentId:row.residentId, who:row.who, detail:row.detail, time:row.time, customTime: row.time !== houseWakeBedTimes.wake }));
  if(wakeMembers.length){
    rows.push({ key:"wakegroup", time:houseWakeBedTimes.wake, icon:"☀️", label:"Wake-Up", kind:"wakegroup", groupKey:"wake", members:wakeMembers, typeKey:"wake" });
  }

  houseResidents().forEach(r=>{
    const cp = carePlans[r.id];
    if(cp.hygiene.mode==="shower" && cp.hygiene.days.includes(TODAY_DOW)){
      const detail = `${esc(cp.hygiene.shift)} shift shower${cp.hygiene.notes?` — ${esc(cp.hygiene.notes)}`:""}.`;
      rows.push({ key:`shower-${r.id}`, time:cp.hygiene.timeOfDay, icon:"🚿", label:"Shower", who:r.name, detail, kind:"simple", typeKey:"shower" });
    }
  });

  // Residents on the house-standard mealtime nest under one collapsible group row rather than each
  // appearing as their own row; a resident with a Care-Plan meal-time override still shows inside the
  // group (grouped by meal, not by exact time) but carries its own "different time" badge — see
  // renderMealMemberRow().
  Object.keys(MEAL_META).forEach(mealKey=>{
    const meta = MEAL_META[mealKey];
    const members = (dailyTasks[mealKey]||[]).map(row=>{
      const time = effectiveMealTime(row.id, mealKey);
      return { residentId:row.id, who:row.who, detail:row.detail, time, customTime: time !== houseMealTimes[mealKey] };
    });
    if(members.length){
      rows.push({ key:`mealgroup-${mealKey}`, time:houseMealTimes[mealKey], icon:meta.icon, label:meta.label, kind:"mealgroup", mealKey, members, typeKey:mealKey });
    }
  });

  scheduledRoutinesRows().forEach(({resident:r, item})=>{
    rows.push({ key:`sched${item.id}`, time:item.time, icon:"⏰", label:"Routine", who:r.name, kind:"routine", item, resident:r, typeKey:"routine" });
  });

  const bedMembers = bedtimeRows().map(row=>({ residentId:row.residentId, who:row.who, detail:row.detail, time:row.time, customTime: row.time !== houseWakeBedTimes.bed }));
  if(bedMembers.length){
    rows.push({ key:"bedgroup", time:houseWakeBedTimes.bed, icon:"🌙", label:"Bedtime", kind:"bedgroup", groupKey:"bed", members:bedMembers, typeKey:"bedtime" });
  }

  // Medications tied to one of the five standard anchors (wake/breakfast/lunch/dinner/bedtime) don't get
  // their own row — they ride the matching group row above and surface via a "Log Meds" control on each
  // resident's member row (see medFlowBlock()). Only "Other" custom-time medications need a standalone
  // row here, grouped per resident+exact-time so several other-time meds due together log in one place.
  medOtherRows().forEach(g=>{
    rows.push({ key:`medother-${g.residentId}-${g.anchor}`, time:g.time, icon:"💊", label:"Medication", who:g.who, kind:"medother", meds:g.meds, residentId:g.residentId, anchor:g.anchor, typeKey:"medication" });
  });

  rows.sort((a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99"));
  return rows;
}
// Groups every resident's "Other"-time medications by exact clock time so Today's Flow shows one row
// per resident per custom time, however many medications share that time.
function medOtherRows(){
  const groups = {};
  houseResidents().forEach(r=>{
    (carePlans[r.id].medications||[]).forEach(med=>{
      medAnchorsForMed(med).filter(a=>a.anchor.startsWith("other-")).forEach(a=>{
        const gKey = r.id+"|"+a.anchor;
        if(!groups[gKey]) groups[gKey] = { residentId:r.id, who:r.name, time:a.time, anchor:a.anchor, meds:[] };
        groups[gKey].meds.push(med);
      });
    });
  });
  return Object.values(groups);
}
const GROUP_KINDS = ["mealgroup","wakegroup","bedgroup"];
// The per-resident checkbox key inside any group row — kept identical to what a standalone row would
// have used (e.g. "wake-eleanor"), so nothing about existing checked-state keys had to change.
function groupMemberKey(row, m){
  if(row.kind === "mealgroup") return `${row.mealKey}-${m.residentId}`;
  return `${row.groupKey}-${m.residentId}`;
}
// A group counts as done once every resident inside it has been checked off — except a meal group,
// which now counts a resident as done once their % eaten has actually been logged (Meals Eaten no
// longer has its own separate checkbox — see renderMealMemberRow). Wake-Up/Bedtime groups are
// unchanged, still plain per-resident checkboxes.
function isFlowRowDone(row){
  if(row.kind === "mealgroup") return row.members.length>0 && row.members.every(m=>!!getDC(m.residentId).meals[row.mealKey].pct);
  if(GROUP_KINDS.includes(row.kind)) return row.members.length>0 && row.members.every(m=>!!state.checked[groupMemberKey(row,m)]);
  // Medications (standalone "Other"-time row) — done once every due medication has a recorded status,
  // same fact medFlowBlock's own badge already shows. No checkbox anymore; logging is the completion.
  if(row.kind === "medother"){
    const dc = getDC(row.residentId);
    return row.meds.length>0 && row.meds.every(med=>!!(dc.medications||{})[medLogKey(med.id, row.anchor)]);
  }
  // A vital-type Routine task is done once it's actually been logged; a PRN-type Routine task keeps
  // its own checkbox as before.
  if(row.kind === "routine" && row.item.type === "vital") return !!row.item.loggedAt;
  return !!state.checked[row.key];
}

// Long descriptions truncate to one line with a "Show more" toggle rather than stretching the row —
// the toggle flips two plain-text spans via the [hidden] attribute, no re-render needed.
const DESC_TRUNCATE_LEN = 70;
function renderRowDescription(icon, label, fullText){
  const text = fullText || "";
  const isLong = text.length > DESC_TRUNCATE_LEN;
  let shortText = text;
  if(isLong){
    shortText = text.slice(0, DESC_TRUNCATE_LEN);
    const lastSpace = shortText.lastIndexOf(" ");
    if(lastSpace > 40) shortText = shortText.slice(0, lastSpace);
    shortText += "…";
  }
  return `<div class="task-row-desc">
    <span class="flow-tag" title="${esc(label)}">${icon}</span>
    <span class="desc-text"><span class="desc-short">${esc(shortText)}</span><span class="desc-full" hidden>${esc(text)}</span></span>
    ${isLong ? `<button class="show-more-btn" onclick="toggleDescMore(this)">Show more</button>` : ""}
  </div>`;
}
function toggleDescMore(btn){
  const wrap = btn.previousElementSibling;
  const shortEl = wrap.querySelector(".desc-short");
  const fullEl = wrap.querySelector(".desc-full");
  const expand = fullEl.hidden;
  fullEl.hidden = !expand;
  shortEl.hidden = expand;
  btn.textContent = expand ? "Show less" : "Show more";
}

function vitalValueDisplay(vt, existing){
  if(!existing) return "";
  if(vt.key==="bp") return (existing.sys || existing.dia) ? `${esc(existing.sys)}/${esc(existing.dia)}` : "";
  if(vt.key==="pain") return existing.rating ? `${esc(existing.rating)}/10${existing.location?` · ${esc(existing.location)}`:""}` : "";
  return existing.value ? esc(existing.value) : "";
}

function renderFlowRow(row, isNext){
  const nextCls = isNext ? " flow-row-current" : "";
  if(row.kind === "mealgroup") return renderMealGroupRow(row, isNext);
  if(row.kind === "wakegroup" || row.kind === "bedgroup") return renderWakeBedGroupRow(row, isNext);
  if(row.kind === "medother") return renderMedOtherRow(row, isNext);

  if(row.kind === "routine"){
    const r = row.resident, item = row.item;
    const key = row.key;
    const isVital = item.type === "vital";
    // A vital-type routine task has no checkbox — logging its value IS what marks it done (see
    // isFlowRowDone). A PRN-type routine task is unchanged, still a plain checkbox.
    const done = isVital ? !!item.loggedAt : !!state.checked[key];
    const canQuickLog = routineCorrelatesToDailyCare(item.type);
    const expanded = state.expandedRoutineId === item.id;
    const fullDetail = `${routineTypeLabel(item)}${item.detail?` — ${esc(item.detail)}`:""}`;
    const vt = isVital ? (VITAL_TYPES.find(v=>v.key===item.vitalType) || VITAL_TYPES[0]) : null;
    let loggedSummary = "";
    if(canQuickLog && item.loggedAt){
      const dc = getDC(r.id);
      if(isVital){
        const value = vitalValueDisplay(vt, dc.vitals.types[vt.key]);
        loggedSummary = `${vt.label}${value ? `: ${value}` : ""}`;
      } else if(item.type==="prn"){
        loggedSummary = `PRN given${dc.prn.reason ? ` — ${esc(dc.prn.reason)}` : ""}`;
      }
    }
    return `
      <div class="task-row routine-row ${done?'done':''}${nextCls}" data-type="routine">
        ${isVital ? "" : `<input type="checkbox" ${done?'checked':''} onchange="toggleTask('${key}')">`}
        <div class="task-row-headline">
          <div class="who">${formatTime12(item.time)} — ${r.name}</div>
          ${renderRowDescription(row.icon, "Routine", fullDetail)}
          <div class="added-by">Added by ${item.addedBy}</div>
        </div>
        <div class="task-row-actions">
          ${canQuickLog ? (item.loggedAt
            ? `<div class="dc-stamp-editable"><span class="dc-stamp">${loggedSummary} ✓</span><button class="btn small" onclick="toggleRoutineQuickLog(${item.id})">✎ Edit</button></div>`
            : (isVital
                ? `<button class="btn primary task-log-btn" onclick="toggleRoutineQuickLog(${item.id})">${esc(vt.label)}</button>`
                : `<button class="btn small" onclick="toggleRoutineQuickLog(${item.id})">Log PRN</button>`)) : ""}
        </div>
      </div>
      ${expanded ? routineQuickLogForm(r, item) : ""}`;
  }

  const done = !!state.checked[row.key];
  const timeLabel = row.time ? `${formatTime12(row.time)} — ` : "";
  return `<div class="task-row ${done?'done':''}${nextCls}" data-type="${row.typeKey}">
    <input type="checkbox" ${done?'checked':''} onchange="toggleTask('${row.key}')">
    <div class="task-row-headline">
      <div class="who">${timeLabel}${row.who}</div>
      ${renderRowDescription(row.icon, row.label, row.detail)}
    </div>
    <div class="task-row-actions">${done && state.completedBy[row.key] ? `<span class="staff">✓ ${state.completedBy[row.key]}</span>` : ""}</div>
  </div>`;
}

// A meal group is a collapsible header (no checkbox of its own — completion is tracked per resident
// inside it) that expands to one row per resident sharing that mealtime, each with its own % Eaten
// quick-log. See isFlowRowDone() for how the group as a whole counts as complete.
function renderMealGroupRow(row, isNext){
  const nextCls = isNext ? " flow-row-current" : "";
  const groupKey = `meal-${row.mealKey}`;
  const expanded = !!state.expandedGroups[groupKey];
  const doneCount = row.members.filter(m=>!!getDC(m.residentId).meals[row.mealKey].pct).length;
  const total = row.members.length;
  const allDone = doneCount === total;
  const timeLabel = row.time ? `${formatTime12(row.time)} — ` : "";
  return `
  <div class="task-row mealgroup-row ${allDone?'done':''}${nextCls}" data-type="${row.typeKey}" onclick="toggleFlowGroup('${groupKey}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')toggleFlowGroup('${groupKey}')">
    <span class="mealgroup-caret">${expanded ? "▾" : "▸"}</span>
    <div class="task-row-headline">
      <div class="who">${timeLabel}${row.label} <span class="hint" style="font-weight:600;">— all residents</span></div>
      ${renderRowDescription(row.icon, row.label, `Tap to ${expanded ? "collapse" : "expand"} and log each resident's intake.`)}
    </div>
    <div class="task-row-actions"><span class="mealgroup-count-pill">${doneCount}/${total} logged</span></div>
  </div>
  ${expanded ? `<div class="mealgroup-members">${row.members.map(m=>renderMealMemberRow(row,m)).join("")}</div>` : ""}`;
}
// Wake-Up / Bedtime groups use the same collapsible-header pattern as a meal group, but members are
// a plain checkbox (no % Eaten quick-log) — see renderWakeBedMemberRow().
function renderWakeBedGroupRow(row, isNext){
  const nextCls = isNext ? " flow-row-current" : "";
  const expanded = !!state.expandedGroups[row.groupKey];
  const doneCount = row.members.filter(m=>!!state.checked[groupMemberKey(row,m)]).length;
  const total = row.members.length;
  const allDone = doneCount === total;
  const timeLabel = row.time ? `${formatTime12(row.time)} — ` : "";
  return `
  <div class="task-row mealgroup-row ${allDone?'done':''}${nextCls}" data-type="${row.typeKey}" onclick="toggleFlowGroup('${row.groupKey}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')toggleFlowGroup('${row.groupKey}')">
    <span class="mealgroup-caret">${expanded ? "▾" : "▸"}</span>
    <div class="task-row-headline">
      <div class="who">${timeLabel}${row.label} <span class="hint" style="font-weight:600;">— all residents</span></div>
      ${renderRowDescription(row.icon, row.label, `Tap to ${expanded ? "collapse" : "expand"} and check off each resident.`)}
    </div>
    <div class="task-row-actions"><span class="mealgroup-count-pill">${doneCount}/${total} done</span></div>
  </div>
  ${expanded ? `<div class="mealgroup-members">${row.members.map(m=>renderWakeBedMemberRow(row,m)).join("")}</div>` : ""}`;
}
function renderWakeBedMemberRow(row, m){
  const key = groupMemberKey(row, m);
  const done = !!state.checked[key];
  const timeBadge = m.customTime ? `<span class="custom-time-badge" title="This resident's ${row.label.toLowerCase()} time is set individually in their Care Plan">🕐 ${formatTime12(m.time)}</span>` : "";
  const medAnchor = row.groupKey === "bed" ? "bedtime" : "wake";
  const dueMeds = medsForAnchor(m.residentId, medAnchor);
  const medBlock = medFlowBlock(m.residentId, medAnchor, dueMeds);
  return `
  <div class="task-row meal-member-row ${done?'done':''}" data-type="${row.typeKey}" onclick="event.stopPropagation()">
    <input type="checkbox" ${done?'checked':''} onchange="toggleTask('${key}')">
    <div class="task-row-headline">
      <div class="who">${m.who}${timeBadge}</div>
      ${renderRowDescription(row.icon, row.label, m.detail)}
    </div>
    <div class="task-row-actions">
      ${done && state.completedBy[key] ? `<span class="staff">✓ ${state.completedBy[key]}</span>` : ""}
      ${medBlock.button}
    </div>
  </div>
  ${medBlock.panel}`;
}
function toggleFlowGroup(groupKey){
  state.expandedGroups[groupKey] = !state.expandedGroups[groupKey];
  scheduleRender();
}
// Meals Eaten has no checkbox of its own anymore — tapping the big % eaten button (or, once logged,
// the stamp showing what was logged) is both how it's recorded AND what marks it done; see
// isFlowRowDone for the mealgroup completion check this drives.
function renderMealMemberRow(row, m){
  const key = `${row.mealKey}-${m.residentId}`;
  const dc = getDC(m.residentId);
  const pct = dc.meals[row.mealKey].pct;
  const pctLabel = pct ? (MEAL_PCT.find(o=>o.value===pct)||{}).label : null;
  const mealExpanded = state.expandedMealKey === key;
  const timeBadge = m.customTime ? `<span class="custom-time-badge" title="This resident's ${row.label.toLowerCase()} time is set individually in their Care Plan">🕐 ${formatTime12(m.time)}</span>` : "";
  const dueMeds = medsForAnchor(m.residentId, row.mealKey);
  const medBlock = medFlowBlock(m.residentId, row.mealKey, dueMeds);
  return `
  <div class="task-row meal-member-row ${pct?'done':''}" data-type="${row.typeKey}" onclick="event.stopPropagation()">
    <div class="task-row-headline">
      <div class="who">${m.who}${timeBadge}</div>
      ${renderRowDescription(row.icon, row.label, m.detail)}
    </div>
    <div class="task-row-actions">
      ${pct
        ? `<div class="dc-stamp-editable"><span class="dc-stamp">${pctLabel} eaten ✓</span><button class="btn small" onclick="toggleMealQuickLog('${key}')">✎ Edit</button></div>`
        : `<button class="btn primary task-log-btn" onclick="toggleMealQuickLog('${key}')">Log % Eaten</button>`}
      ${medBlock.button}
    </div>
  </div>
  ${mealExpanded ? mealQuickLogForm(row.mealKey, m.residentId, key) : ""}
  ${medBlock.panel}`;
}
function toggleMealQuickLog(key){
  state.expandedMealKey = state.expandedMealKey===key ? null : key;
  scheduleRender();
}
// One tap on a % option logs it immediately and closes the panel — no separate Save step, since
// there's nothing to type or double-check here the way there is for a vital's value.
function mealQuickLogForm(mealKey, residentId, key){
  const dc = getDC(residentId);
  const pct = dc.meals[mealKey].pct;
  return `<div class="card routine-quicklog" onclick="event.stopPropagation()">
    <div class="dc-label">% eaten — writes to Daily Care</div>
    <div class="task-log-options">
      ${MEAL_PCT.filter(o=>o.value!=="na").map(o=>`<button type="button" class="task-log-opt ${pct===o.value?'active':''}" onclick="instantLogMealPct('${residentId}','${mealKey}','${key}','${o.value}')">${o.label}</button>`).join("")}
    </div>
    <div class="routine-quicklog-actions">
      <button class="btn small" onclick="toggleMealQuickLog('${key}')">Close</button>
    </div>
  </div>`;
}
function instantLogMealPct(residentId, mealKey, key, value){
  quickLogMealPct(residentId, mealKey, value);
  state.expandedMealKey = null;
  scheduleRender();
}
function quickLogMealPct(residentId, mealKey, value){
  if(!value) return;
  const dc = getDC(residentId);
  dc.meals[mealKey].pct = value;
  touchSection(dc, mealKey, currentUser());
  scheduleRender();
}

/* ---------------- Medications: Today's Flow "Log Meds" quick-log ----------------
   Tapping the Medications task opens two big buttons — a green PASS (marks every medication due at
   this resident/time as taken, in one tap) and a red REFUSE (opens a checklist so the caregiver picks
   exactly which of the due medications were actually refused — the rest are passed). This replaces the
   old per-medication Pass/Refuse row-by-row flow, and there's no separate checkbox anymore: logging
   PASS or REFUSE for everyone due here IS what marks this task done (see isFlowRowDone). */
function medFlowBlock(residentId, anchor, meds){
  if(!meds.length) return { button:"", panel:"" };
  const dc = getDC(residentId);
  const recs = meds.map(med=>(dc.medications||{})[medLogKey(med.id, anchor)]);
  const loggedCount = recs.filter(Boolean).length;
  const total = meds.length;
  const allDone = loggedCount === total;
  const anyRefused = recs.some(rec=>rec && rec.status==="refuse");
  const flowKey = residentId+'|'+anchor;
  const expanded = state.expandedMedLogKey === flowKey;
  const summary = allDone ? (anyRefused ? `${recs.filter(r=>r.status==="refuse").length} of ${total} refused` : `All ${total} passed`) : `${loggedCount}/${total} logged`;
  const button = allDone
    ? `<div class="dc-stamp-editable"><span class="dc-stamp" style="color:${anyRefused?'var(--alert-text)':'var(--good-text)'};">💊 ${summary} ✓</span><button class="btn small" onclick="toggleMedQuickLog('${residentId}','${anchor}')">✎ Change</button></div>`
    : `<button class="btn primary task-log-btn" onclick="toggleMedQuickLog('${residentId}','${anchor}')">💊 Log Medications</button>`;
  const panel = expanded ? medQuickLogPanel(residentId, anchor, meds) : "";
  return { button, panel };
}
function toggleMedQuickLog(residentId, anchor){
  const key = residentId+'|'+anchor;
  state.expandedMedLogKey = state.expandedMedLogKey===key ? null : key;
  state.medChoosingRefuse = false;
  state.medRefuseDraft = {};
  scheduleRender();
}
function medQuickLogPanel(residentId, anchor, meds){
  const dc = getDC(residentId);
  if(state.medChoosingRefuse){
    return medRefuseChoicePanel(residentId, anchor, meds);
  }
  return `<div class="card routine-quicklog" onclick="event.stopPropagation()">
    <div class="dc-label">Medications due — writes to Daily Care</div>
    <div class="cp-hint" style="margin-bottom:10px;">${meds.map(m=>esc(m.name)+(m.dosage?` (${esc(m.dosage)})`:"")).join(", ")}</div>
    <div class="task-log-options">
      <button type="button" class="task-log-opt pass" onclick="passAllMedications('${residentId}','${anchor}')">✓ PASS<br><span style="font-weight:500; font-size:12px;">All taken</span></button>
      <button type="button" class="task-log-opt refuse" onclick="startRefuseChoice('${residentId}','${anchor}')">✕ REFUSE<br><span style="font-weight:500; font-size:12px;">Choose which</span></button>
    </div>
  </div>`;
}
// Every due medication defaults to Pass — the caregiver only has to actively pick the ones that were
// actually refused, not re-confirm every medication that went fine.
function passAllMedications(residentId, anchor){
  const meds = allDueMedsForAnchor(residentId, anchor);
  meds.forEach(med=>setMedStatus(residentId, med.id, anchor, "pass", ""));
  state.expandedMedLogKey = null;
  scheduleRender();
}
function allDueMedsForAnchor(residentId, anchor){
  const cp = carePlans[residentId];
  return (cp.medications||[]).filter(med=>medAnchorsForMed(med).some(a=>a.anchor===anchor));
}
function startRefuseChoice(residentId, anchor){
  const dc = getDC(residentId);
  const meds = allDueMedsForAnchor(residentId, anchor);
  const draft = {};
  meds.forEach(med=>{
    const rec = (dc.medications||{})[medLogKey(med.id, anchor)];
    draft[med.id] = { refused: !!(rec && rec.status==="refuse"), reason: (rec && rec.reason) || "" };
  });
  state.medChoosingRefuse = true;
  state.medRefuseDraft = draft;
  scheduleRender();
}
function toggleMedRefuseDraft(medId){
  if(!state.medRefuseDraft[medId]) state.medRefuseDraft[medId] = { refused:false, reason:"" };
  state.medRefuseDraft[medId].refused = !state.medRefuseDraft[medId].refused;
  scheduleRender();
}
function medRefuseChoicePanel(residentId, anchor, meds){
  const rows = meds.map(med=>{
    const d = state.medRefuseDraft[med.id] || { refused:false, reason:"" };
    const doseLabel = med.dosage ? ` — ${esc(med.dosage)}` : "";
    return `<div class="med-log-row">
      <div class="med-log-name">${esc(med.name)}${doseLabel}</div>
      <button type="button" class="task-log-opt ${d.refused?'refuse active':''}" style="min-height:40px; flex:none; min-width:120px;" onclick="toggleMedRefuseDraft(${med.id})">${d.refused ? "✕ Refused" : "Mark as refused"}</button>
      ${d.refused ? `<div class="dc-inline-input"><input type="text" id="medrefuse-reason-${med.id}-${anchor}" placeholder="Reason for refusal" value="${esc(d.reason)}" onchange="updateMedRefuseDraftReason(${med.id},'${anchor}')"></div>` : ""}
    </div>`;
  }).join("");
  return `<div class="card routine-quicklog" onclick="event.stopPropagation()">
    <div class="dc-label">Choose which were refused — everyone else here is marked Passed</div>
    ${rows}
    <div class="routine-quicklog-actions">
      <button class="btn primary small" onclick="saveRefuseChoice('${residentId}','${anchor}')">Save to Daily Care</button>
      <button class="btn small" onclick="cancelRefuseChoice()">Cancel</button>
    </div>
  </div>`;
}
function updateMedRefuseDraftReason(medId, anchor){
  const el = document.getElementById(`medrefuse-reason-${medId}-${anchor}`);
  if(!el || !state.medRefuseDraft[medId]) return;
  state.medRefuseDraft[medId].reason = el.value;
}
function cancelRefuseChoice(){
  state.medChoosingRefuse = false;
  state.medRefuseDraft = {};
  scheduleRender();
}
function saveRefuseChoice(residentId, anchor){
  const meds = allDueMedsForAnchor(residentId, anchor);
  meds.forEach(med=>{
    const d = state.medRefuseDraft[med.id] || { refused:false, reason:"" };
    if(d.refused){
      const el = document.getElementById(`medrefuse-reason-${med.id}-${anchor}`);
      setMedStatus(residentId, med.id, anchor, "refuse", el ? el.value.trim() : d.reason);
    } else {
      setMedStatus(residentId, med.id, anchor, "pass", "");
    }
  });
  state.expandedMedLogKey = null;
  state.medChoosingRefuse = false;
  state.medRefuseDraft = {};
  scheduleRender();
}

function quickLogRoutineVital(itemId, residentId, vitalKey){
  const dc = getDC(residentId);
  const v1 = document.getElementById('rq-val1-'+itemId).value;
  dc.vitals.monitored = "yes";
  if(vitalKey==="bp"){
    const v2 = document.getElementById('rq-val2-'+itemId).value;
    dc.vitals.types.bp = { checked:true, sys:v1, dia:v2 };
  } else if(vitalKey==="pain"){
    const v2 = document.getElementById('rq-val2-'+itemId).value;
    const v3 = document.getElementById('rq-val3-'+itemId).value;
    dc.vitals.types.pain = { checked:true, rating:v1, location:v2, description:v3 };
  } else {
    dc.vitals.types[vitalKey] = { checked:true, value:v1 };
  }
  touchSection(dc, "vitals", currentUser());
  const item = findRoutineItem(itemId);
  if(item) item.loggedAt = "Just now";
  state.expandedRoutineId = null;
  scheduleRender();
}
function quickLogRoutinePRN(itemId, residentId){
  const dc = getDC(residentId);
  dc.prn.given = "yes";
  dc.prn.reason = document.getElementById('rq-prnReason-'+itemId).value;
  dc.prn.response = document.getElementById('rq-prnResponse-'+itemId).value;
  touchSection(dc, "medEvents", currentUser());
  const item = findRoutineItem(itemId);
  if(item) item.loggedAt = "Just now";
  state.expandedRoutineId = null;
  scheduleRender();
}

function age(dob){
  const d=new Date(dob), t=nowRef();
  let a=t.getFullYear()-d.getFullYear();
  if(t.getMonth()<d.getMonth() || (t.getMonth()===d.getMonth() && t.getDate()<d.getDate())) a--;
  return a;
}

const CAL_KIND_OPTIONS = [ {value:"activity",label:"Activity"}, {value:"visit",label:"Visit"}, {value:"appointment",label:"Appointment"}, {value:"birthday",label:"Birthday"} ];

/* ---------------- Resident birthdays — auto-added to the Calendar ----------------
   Each resident's DOB (captured on their Care Plan) automatically gets a yearly Calendar entry rather
   than requiring anyone to enter it by hand. Auto-added events are tagged with birthdayOf/birthdayYear
   so this stays idempotent — re-running it never creates a duplicate for a resident+year that already
   has one, and it respects a manager's edit or (soft) delete of that event instead of re-creating it.
   Runs at boot and again whenever a resident is added or edited, so a newly-entered or changed DOB
   picks up its Calendar entry right away rather than waiting for a page reload. */
function birthdayIsoForYear(dob, year){
  if(!dob) return null;
  const parts = String(dob).split("-");
  if(parts.length !== 3) return null;
  const month = parseInt(parts[1],10), day = parseInt(parts[2],10);
  if(!month || !day) return null;
  const isLeapYear = y => (y%4===0 && y%100!==0) || y%400===0;
  const d = (month===2 && day===29 && !isLeapYear(year)) ? 28 : day; // Feb 29 birthdays land on Feb 28 in non-leap years
  return `${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function findBirthdayEvent(residentId, year){
  for(const day in calendarEvents){
    const found = (calendarEvents[day]||[]).find(e=>e.birthdayOf===residentId && e.birthdayYear===year);
    if(found) return found;
  }
  return null;
}
function syncResidentBirthdayEvents(){
  const thisYear = new Date().getFullYear();
  residents.forEach(r=>{
    if(!r.dob) return;
    [thisYear, thisYear+1].forEach(year=>{
      if(findBirthdayEvent(r.id, year)) return; // already generated (or a manager deleted it) — leave it alone
      const day = birthdayIsoForYear(r.dob, year);
      if(!day) return;
      if(!calendarEvents[day]) calendarEvents[day] = [];
      calendarEvents[day].push(ce(calendarEventIdSeq++, `🎂 ${r.name}'s Birthday`, "birthday", "", "", "System", "Auto-generated", { birthdayOf:r.id, birthdayYear:year }));
    });
  });
}
/* ---------------- Calendar recurrence engine ----------------
   There's no recurrence support in the underlying data — every calendarEvents entry is still a plain
   one-off row on one specific day. A "series" (calendarSeries) is the recurrence definition; generating
   it just pushes normal one-off rows for every matching date, each tagged with seriesId so the Calendar
   screen can offer "just this occurrence or the whole series?" on edit/delete, and so re-generating
   (see extendCalendarSeries) never creates a duplicate for a date that's already been generated —
   including a date whose generated occurrence was since edited or deleted, which is left alone. */
const CAL_REPEAT_OPTIONS = [
  {value:"none", label:"Does not repeat"},
  {value:"daily", label:"Daily"},
  {value:"weekly", label:"Specific day(s) of week"},
  {value:"biweekly", label:"Every other week"}
];
const CAL_WINDOW_OPTIONS = [ {value:1,label:"1 month"}, {value:3,label:"3 months"}, {value:6,label:"6 months"} ];
// Every date from the later of (series start, fromIso) through throughIso that matches the series'
// repeat pattern. repeatDays uses the same Mon-first day labels as HYGIENE_DAYS ("Mon".."Sun").
function seriesDatesInRange(series, fromIso, throughIso){
  const out = [];
  let cur = series.startDay > fromIso ? series.startDay : fromIso;
  const startWeekMonday = mondayOfIso(series.startDay);
  while(cur <= throughIso){
    const dow = HYGIENE_DAYS[(parseIso(cur).getDay()+6)%7]; // JS getDay() (Sun=0) -> Mon-first label
    if(series.repeat === "daily"){
      out.push(cur);
    } else if(series.repeat === "weekly"){
      if(series.repeatDays.includes(dow)) out.push(cur);
    } else if(series.repeat === "biweekly"){
      if(series.repeatDays.includes(dow)){
        const curWeekMonday = mondayOfIso(cur);
        const weeksBetween = Math.round((parseIso(curWeekMonday) - parseIso(startWeekMonday)) / (7*86400000));
        if(weeksBetween % 2 === 0) out.push(cur);
      }
    }
    cur = addDaysIso(cur, 1);
  }
  return out;
}
function generateSeriesEvents(series){
  seriesDatesInRange(series, series.startDay, series.generatedThrough).forEach(day=>{
    const already = (calendarEvents[day]||[]).some(e=>e.seriesId===series.id);
    if(already) return; // already generated for this date — including if a manager since edited or deleted it
    if(!calendarEvents[day]) calendarEvents[day] = [];
    calendarEvents[day].push(ce(calendarEventIdSeq++, series.title, series.kind, series.time, series.notes, series.createdBy, series.createdAt, { seriesId: series.id }));
  });
}
function seriesSummaryLabel(series){
  if(!series) return "";
  if(series.repeat==="daily") return "Repeats daily";
  if(series.repeat==="weekly") return `Repeats weekly — ${series.repeatDays.join(", ")}`;
  if(series.repeat==="biweekly") return `Repeats every other week — ${series.repeatDays.join(", ")}`;
  return "";
}
// Surfaced on the Calendar screen once a series' generated window is within 2 weeks of running out —
// resolved (confirmed with Johnna): prompt whoever's looking at it to regenerate for another period, or
// mark the series complete. Keeps prompting on every visit until one of those happens (no snooze), since
// letting a repeating event quietly stop mid-series is the failure mode this is guarding against.
function activeCalendarSeriesNeedingRenewal(){
  return Object.values(calendarSeries).filter(s=>s.status==="active" && addDaysIso(s.generatedThrough,-14) <= todayIso());
}
function extendCalendarSeries(seriesId){
  if(!moduleEdit('calendar')) return;
  const series = calendarSeries[seriesId];
  if(!series) return;
  series.generatedThrough = addMonthsIso(series.generatedThrough, series.windowMonths);
  generateSeriesEvents(series);
  scheduleRender();
}
function completeCalendarSeries(seriesId){
  if(!moduleEdit('calendar')) return;
  const series = calendarSeries[seriesId];
  if(!series) return;
  series.status = "complete";
  scheduleRender();
}
function getCalEvent(day, id){ return (calendarEvents[day]||[]).find(e=>e.id===id); }
function fmtIsoLabel(iso){ const d = parseIso(iso); return `${DOW_SHORT[d.getDay()]}, ${MONTH_LONG[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
function fmtDayLabelIso(iso){ return fmtDayLabel(parseIso(iso)); }
// Which week the Calendar screen is currently showing — defaults to the real current week and moves
// by 7 real days at a time via Prev/Next Week, so the calendar keeps going indefinitely rather than
// being limited to one fixed week.
function currentCalendarWeekStart(){ return state.calendarWeekStart || mondayOfIso(TODAY_ISO); }
function shiftCalendarWeek(delta){
  state.calendarWeekStart = addDaysIso(currentCalendarWeekStart(), delta*7);
  scheduleRender();
}
function openAddEventModal(){

  scheduleRender();
}
// Which id suffix the currently-open form's fields use — lets the chip setters below (Type, Repeat, day
// picker, window) find and preserve whatever's already typed into Title/Time/Notes before they trigger
// a re-render, since those three are plain inputs read into modal state on demand rather than after
// every keystroke (see syncCalendarModalFormToState()).
function calendarModalIdSuffix(){

  if(m.mode==="editseries") return "editseries";

}

  const timeEl = document.getElementById(`cal-time-${idSuffix}`); if(timeEl) m.time = timeEl.value;
  const notesEl = document.getElementById(`cal-notes-${idSuffix}`); if(notesEl) m.notes = notesEl.value;

// The "Type" chip row (Activity/Visit/Appointment) and, on the Add form, the Repeat picker all write
// straight onto state.calendarModal rather than being read from a <select> at save time — one shared
// set of setters covers add/edit/edit-series, since all three keep their draft on the same object.
function setCalendarModalKind(key){

function setCalendarModalRepeat(key){

function setCalendarModalWindow(months){

function chooseEditWholeSeries(){

  m.time = series ? series.time : ev.time;
  m.notes = series ? series.notes : ev.notes;

}
function cancelSeriesPrompt(){

function saveNewEvent(){
  if(!moduleEdit('calendar') || !state.calendarModal) return;
  const m = state.calendarModal;
  const day = document.getElementById("cal-day-new").value;
  const title = document.getElementById("cal-title-new").value.trim();
  const time = document.getElementById("cal-time-new").value.trim();
  const notes = document.getElementById("cal-notes-new").value.trim();
  const kind = m.kind || "activity";
  if(!title || !time) return;
  const repeat = m.repeat || "none";
  if(repeat === "none"){
    if(!calendarEvents[day]) calendarEvents[day] = [];
    calendarEvents[day].push(ce(calendarEventIdSeq++, title, kind, time, notes, currentUser().name, "Just now"));
  } else {
    if((repeat==="weekly"||repeat==="biweekly") && !(m.repeatDays||[]).length){
      m.repeatError = "Pick at least one day of the week.";
      scheduleRender();
      return;
    }
    const windowMonths = m.windowMonths || 1;
    const series = {
      id: calendarSeriesIdSeq++, title, kind, time, notes,
      repeat, repeatDays: (m.repeatDays||[]).slice(),
      startDay: day, windowMonths,
      generatedThrough: addMonthsIso(day, windowMonths),
      status: "active", createdBy: currentUser().name, createdAt: "Just now"
    };
    calendarSeries[series.id] = series;
    generateSeriesEvents(series);
  }
  state.calendarModal = null;
  scheduleRender();
}
// Editing can also move an event to a different day — the record is spliced out of its old day's array
// and pushed into the new one, keeping its id, creator, and history intact. This only ever touches the
// one occurrence being viewed — see saveEventEditSeries() for "whole series" edits.
function saveEventEdit(day, id){
  if(!moduleEdit('calendar') || !state.calendarModal) return;
  const ev = getCalEvent(day, id);
  if(!ev) return;
  const newDay = document.getElementById("cal-day-edit").value;
  ev.t = document.getElementById("cal-title-edit").value.trim() || ev.t;
  ev.time = document.getElementById("cal-time-edit").value.trim() || ev.time;
  ev.k = state.calendarModal.kind || ev.k;
  ev.notes = document.getElementById("cal-notes-edit").value.trim();
  ev.editedBy = currentUser().name;
  ev.editedAt = "Just now";
  if(newDay !== day){
    calendarEvents[day] = calendarEvents[day].filter(e=>e.id!==id);
    if(!calendarEvents[newDay]) calendarEvents[newDay] = [];
    calendarEvents[newDay].push(ev);
    state.calendarModal = { mode:"view", day:newDay, id };
  } else {
    state.calendarModal.mode = "view";
  }
  scheduleRender();
}
// "Whole series" edit — updates the series' own template (so future generated occurrences pick up the
// change too) and cascades the same title/time/kind/notes onto every not-yet-deleted occurrence already
// generated. There's no Day field here since the edit applies across every occurrence's own date.
function saveEventEditSeries(seriesId){
  if(!moduleEdit('calendar') || !state.calendarModal) return;
  const series = calendarSeries[seriesId];
  if(!series) return;
  const title = document.getElementById("cal-title-editseries").value.trim();
  const time = document.getElementById("cal-time-editseries").value.trim();
  const notes = document.getElementById("cal-notes-editseries").value.trim();
  const kind = state.calendarModal.kind || series.kind;
  if(!title || !time) return;
  series.title = title; series.time = time; series.notes = notes; series.kind = kind;
  Object.keys(calendarEvents).forEach(d=>{
    (calendarEvents[d]||[]).forEach(e=>{
      if(e.seriesId===seriesId && !e.deleted){
        e.t = title; e.time = time; e.notes = notes; e.k = kind;
        e.editedBy = currentUser().name; e.editedAt = "Just now";
      }
    });
  });
  const m = state.calendarModal;
  state.calendarModal = { mode:"view", day:m.day, id:m.id };
  scheduleRender();
}
// Deleting an event asks for confirmation first (confirmed with Johnna) — the modal swaps its Edit/
// Delete buttons for an inline "Delete this event? Yes/No" prompt rather than a native confirm(), same
// pattern as the special-instruction delete confirm above. Deletes are soft (deleted:true) so the event
// can be found under "Deleted Events" and restored rather than being lost for good. A recurring event
// asks "just this occurrence, or the whole series?" first — same choice as editing, above.
function requestDeleteEvent(){
  if(!moduleEdit('calendar') || !state.calendarModal) return;
  const ev = getCalEvent(state.calendarModal.day, state.calendarModal.id);
  if(!ev) return;
  if(ev.seriesId){

    scheduleRender();
    return;
  }
  state.calendarModal.confirmingDelete = true;
  scheduleRender();
}
function cancelDeleteEvent(){
  if(!state.calendarModal) return;
  state.calendarModal.confirmingDelete = false;
  scheduleRender();
}
function chooseDeleteThisOccurrence(){

  m.seriesPrompt = null;
  m.confirmingDelete = true;

}
function chooseDeleteWholeSeries(){

function cancelDeleteSeriesChoice(){

function confirmDeleteEvent(day, id){
  if(!moduleEdit('calendar')) return;
  const ev = getCalEvent(day, id);
  if(!ev) return;
  ev.deleted = true;
  ev.deletedBy = currentUser().name;
  ev.deletedAt = "Just now";
  state.calendarModal = null;
  scheduleRender();
}
// Deletes every not-yet-deleted occurrence of the series (each stays soft-deleted/restorable, same as a
// single occurrence) and marks the series itself complete so it stops generating further occurrences.
function confirmDeleteSeries(seriesId){
  if(!moduleEdit('calendar')) return;
  const who = currentUser().name;
  Object.keys(calendarEvents).forEach(d=>{
    (calendarEvents[d]||[]).forEach(e=>{
      if(e.seriesId===seriesId && !e.deleted){
        e.deleted = true; e.deletedBy = who; e.deletedAt = "Just now";
      }
    });
  });
  const series = calendarSeries[seriesId];
  if(series) series.status = "complete";
  state.calendarModal = null;
  scheduleRender();
}
function restoreEvent(day, id){
  if(!moduleEdit('calendar')) return;
  const ev = getCalEvent(day, id);
  if(!ev) return;
  ev.deleted = false;
  ev.deletedBy = null;
  ev.deletedAt = null;
  scheduleRender();
}
function toggleDeletedEvents(){
  state.showDeletedEvents = !state.showDeletedEvents;
  scheduleRender();
}
function allDeletedEvents(){
  const out = [];
  // Events now live on any real date, not one fixed set of 7 labels — walk every date that actually
  // has events rather than a hardcoded week.
  Object.keys(calendarEvents).forEach(d=>(calendarEvents[d]||[]).forEach(e=>{ if(e.deleted) out.push({ day:d, ...e }); }));
  return out.sort((a,b)=> a.day < b.day ? 1 : -1); // most recently deleted week first
}

          </div>
          ${o.active ? `
          <div class="dc-label" style="margin-top:12px; text-transform:none; letter-spacing:0; font-size:12.5px;">How often</div>
          <div class="chip-row">
            <button type="button" class="chip-btn ${o.scope==='all'?'active':''}" ${moduleEdit('menu')?`onclick="setBreakfastOverrideScope('${r.id}','all')"`:'disabled'}>Every day</button>
            <button type="button" class="chip-btn ${o.scope==='days'?'active':''}" ${moduleEdit('menu')?`onclick="setBreakfastOverrideScope('${r.id}','days')"`:'disabled'}>Specific days</button>
          </div>
          ${o.scope==='days' ? `
          <div class="dc-label" style="margin-top:12px; text-transform:none; letter-spacing:0; font-size:12.5px;">Days</div>
          <div class="chip-row">${menuDays.map(d=>`<button type="button" class="chip-btn ${(o.days||[]).includes(d)?'active':''}" ${moduleEdit('menu')?`onclick="toggleBreakfastOverrideDay('${r.id}','${d}')"`:'disabled'}>${d}</button>`).join("")}</div>
          ` : ""}
          <div class="dc-label" style="margin-top:12px; text-transform:none; letter-spacing:0; font-size:12.5px;">What they get</div>
          <div class="dc-inline-input"><textarea id="breakfastOverrideText-${r.id}" placeholder="e.g. Oatmeal with banana, no sugar" ${moduleEdit('menu')?`onchange="touchBreakfastOverrideText('${r.id}')"`:'disabled'}>${esc(o.text)}</textarea></div>
          ` : ""}
        </div>`;
      }).join("")}
    </div>

    <div class="card" style="padding:16px 20px; margin-top:14px;">
      <div class="section-head" style="margin-bottom:4px;">
        <h2 style="font-size:13.5px;">Dietary Needs &amp; Special Instructions</h2>
        <span class="hint">Standing restrictions &amp; allergies come from each resident's Care Plan. Any caregiver can add a one-off instruction — a house manager or leadership addition applies right away, a caregiver's addition needs a house manager's approval first.</span>
      </div>
      ${list.map(r=>{
        const cp = carePlans[r.id] || {};
        const dietTags = (cp.diet && cp.diet.tags) || [];
        const dietDetails = cp.diet && cp.diet.details;
        const allergies = (cp.allergies||[]).filter(a => a && a.trim().toLowerCase() !== "none known");
        const notes = residentMealNotes[r.id] || [];
        return `<div class="diet-resident-card">
          <div class="diet-resident-head">${r.name}</div>
          <div class="diet-chip-row">
            ${dietTags.map(t=>`<span class="tag diet-tag">${esc(t)}</span>`).join("")}
            ${allergies.map(a=>`<span class="tag allergy-tag">⚠ ${esc(a)} allergy</span>`).join("")}
            ${(!dietTags.length && !allergies.length) ? `<span class="hint" style="margin:0; font-style:italic;">No standing dietary restrictions on file.</span>` : ""}
          </div>
          ${dietDetails ? `<div class="diet-details-text">${esc(dietDetails)}</div>` : ""}
          <div class="diet-instructions-label">Special instructions</div>
          <div class="diet-instructions">
            ${notes.length ? notes.map(n=>{
              const pending = state.mealNoteDeletePending;
              if(pending && pending.residentId===r.id && pending.noteId===n.id){
                return `<span class="meal-note-chip meal-note-confirm">Delete this instruction?
                  <button class="btn small primary" onclick="confirmDeleteMealNote('${r.id}',${n.id})">Delete</button>
                  <button class="btn small" onclick="cancelDeleteMealNote()">Cancel</button>
                </span>`;
              }
              const pendingApproval = n.status === "pending";
              return `<span class="meal-note-chip ${pendingApproval ? 'meal-note-pending' : ''}">
                ${esc(n.text)}
                ${pendingApproval ? badge("fall","Pending approval") : ""}
                <span class="meal-note-by">— ${esc(n.addedBy)}</span>
                ${pendingApproval && moduleEdit('menu') ? `<button class="btn small primary" onclick="approveMealNote('${r.id}',${n.id})">Approve</button>` : ""}
                ${moduleEdit('menu') ? `<button class="meal-note-remove" onclick="requestDeleteMealNote('${r.id}',${n.id})" title="Remove">✕</button>` : ""}
              </span>`;
            }).join("") : "<span class='hint' style='margin:0; font-style:italic;'>None on file.</span>"}
          </div>
          <div class="meal-note-add">
            <input type="text" id="mealNoteInput-${r.id}" placeholder="Add an instruction for ${r.name.split(' ')[0]}...">
            <button class="btn small" onclick="addMealNote('${r.id}')">Add</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>

  ${state.recipeModal ? renderRecipeModal() : ""}`;
}

function renderRecipeModal(){
  const { week, meal, day } = state.recipeModal;
  const cell = masterMenus[week][meal][day];
  const isAdmin = canEditMasterMenu();
  const embedUrl = youtubeEmbedUrl(cell.videoUrl);
  return `
  <div class="modal-overlay">
    <div class="modal-card recipe-modal">
      <div class="modal-head">
        <div>
          <h2>${esc(cell.item)}</h2>
          <span class="hint">${meal} · ${day} · Week ${week}</span>
        </div>
        <button class="btn small" onclick="closeRecipeModal()">✕ Close</button>
      </div>
      <div class="recipe-modal-body">
        <div class="recipe-section">
          <h3>Written recipe</h3>
          ${isAdmin
            ? `<textarea class="recipe-textarea" rows="9" placeholder="Ingredients, steps, portion or texture notes..." onchange="setMenuRecipeText('${week}','${meal}','${day}',this.value)">${esc(cell.recipeText)}</textarea>`
            : (cell.recipeText
                ? `<div class="recipe-text-display">${esc(cell.recipeText)}</div>`

                   <a class="recipe-link" href="${esc(recipeSearch(cell.item))}" target="_blank" rel="noopener">Search for a recipe ↗</a>`)}
        </div>
        <div class="recipe-section">
          <h3>Video</h3>
          ${embedUrl ? `<div class="recipe-video-wrap"><iframe src="${embedUrl}" title="${esc(cell.item)} recipe video" allowfullscreen></iframe></div>` : ""}
          ${isAdmin
            ? `<input type="text" class="recipe-video-input" placeholder="Paste a YouTube link to embed it here" value="${esc(cell.videoUrl)}" onchange="setMenuVideoUrl('${week}','${meal}','${day}',this.value)">
               <div class="recipe-video-hint">Paste any youtube.com or youtu.be link — it'll be embedded above automatically.</div>`

        </div>
      </div>
    </div>
  </div>`;
}

// Daily Care Log — Medications section. Imports every medication straight from the resident's Care
// Plan (no separate data entry here) and lists one Pass/Refuse row per scheduled time, reading/writing
// the exact same dc.medications record the Today's Flow "Log Meds" quick-log uses — so a dose logged
// from either screen shows up on both immediately.
function medicationsDCBlock(r){
  const cp = carePlans[r.id];
  const meds = cp.medications || [];
  if(!meds.length) return `<div class="cp-hint">No medications on file. Add medications on the resident's Medications tab.</div>`;
  const dc = getDC(r.id);
  return meds.map(med=>{
    const anchors = medAnchorsForMed(med);
    if(!anchors.length) return `<div class="dc-field"><span class="dc-label">${esc(med.name)}${med.dosage?` — ${esc(med.dosage)}`:""}</span><div class="cp-hint">No administration time set yet — add one on the Medications tab.</div></div>`;
    return `<div class="dc-field">
      <span class="dc-label" style="margin-bottom:10px;">${esc(med.name)}${med.dosage?` — ${esc(med.dosage)}`:""}</span>
      ${anchors.map(a=>{
        const key = medLogKey(med.id, a.anchor);
        const rec = dc.medications[key];
        const status = rec ? rec.status : null;
        return `<div style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border);">
          <div class="dc-inline-input" style="margin-top:0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
            <span class="tag">${a.label}</span>
            <div class="chip-row">
              <button type="button" class="chip-btn ${status==='pass'?'active':''}" onclick="setMedStatusFromLog('${r.id}',${med.id},'${a.anchor}','pass')">Pass</button>
              <button type="button" class="chip-btn ${status==='refuse'?'active':''}" onclick="setMedStatusFromLog('${r.id}',${med.id},'${a.anchor}','refuse')">Refuse</button>
            </div>
          </div>
          ${status==='refuse' ? `<div class="dc-inline-input"><input type="text" id="dc-medRefReason-${med.id}-${a.anchor}-${r.id}" placeholder="Reason for refusal" value="${esc(rec.reason)}" onchange="updateMedRefuseReason('${r.id}',${med.id},'${a.anchor}')"></div>` : ""}
          ${rec ? `<div class="dc-inline-input"><span class="dc-stamp">${esc(rec.by)} · ${esc(rec.at)}</span></div>` : ""}
          ${rec && rec.corrections && rec.corrections.length ? `<div class="dc-inline-input"><span class="dc-stamp" title="${esc(rec.corrections.map(c=>`was ${c.status}${c.reason?` (${c.reason})`:""} — ${c.by} · ${c.at}`).join('; '))}">✎ Corrected — was ${esc(rec.corrections[rec.corrections.length-1].status)} · ${esc(rec.corrections[rec.corrections.length-1].by)} · ${esc(rec.corrections[rec.corrections.length-1].at)}${rec.corrections.length>1 ? ` (+${rec.corrections.length-1} earlier)` : ""}</span></div>` : ""}
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
}
function setMedStatusFromLog(residentId, medId, anchor, status){
  const dc = getDC(residentId);
  const key = medLogKey(medId, anchor);
  const existingReason = (dc.medications[key] && dc.medications[key].reason) || "";
  setMedStatus(residentId, medId, anchor, status, status==="refuse" ? existingReason : "");
  scheduleRender();
}
function updateMedRefuseReason(residentId, medId, anchor){
  const el = document.getElementById(`dc-medRefReason-${medId}-${anchor}-${residentId}`);
  if(!el) return;
  const dc = getDC(residentId);
  const key = medLogKey(medId, anchor);
  if(!dc.medications[key]) return;
  dc.medications[key].reason = el.value;
  touchSection(dc, "medications", currentUser());
}

/* Re-lock whenever the tab/app is backgrounded (covers the iPad sleeping or switching apps) */

["click","touchstart","keydown"].forEach(evt => document.addEventListener(evt, resetIdleTimer, {passive:true}));

/* ---------------- Local persistence (Phase 2a: on-device only, no server, no sync) ----------------
   This is the pilot's storage layer while it runs at a single house with no remote access — see the
   spec's Phase 2a section. Everything a house manager or caregiver enters (residents, care plans,
   daily care logs, calendar, incident reports, food photos, staff roster, etc.) is saved into this
   browser's IndexedDB so it survives a reload or the iPad restarting. IndexedDB (not localStorage) is
   used because food photos are stored as base64 data URLs and can be several MB total, well past
   localStorage's ~5-10MB quota.
   Nothing here is uploaded anywhere, and nothing syncs between devices — this is the explicit
   trade-off of running before the Phase 2 Supabase/remote-access build.
   Deliberately NOT persisted: state.userId (the current login) and other pure-navigation/session
   state (state.view, scroll/expand toggles, etc.) — a shared iPad must always come back to the
   PIN-lock screen on reload, never auto-log-in the last person who used it, and it's fine for the
   app to reopen on the Dashboard rather than wherever someone left it. */
const PERSIST_DB_NAME = "nhh_house_dashboard";
const PERSIST_DB_VERSION = 1;
const PERSIST_STORE = "snapshot";
const PERSIST_KEY = "current";
let persistDbPromise = null;
function openPersistDB(){
  if(!persistDbPromise){
    persistDbPromise = new Promise((resolve, reject) => {
      if(!window.indexedDB){ reject(new Error("IndexedDB not available in this browser")); return; }
      const req = indexedDB.open(PERSIST_DB_NAME, PERSIST_DB_VERSION);
      req.onupgradeneeded = () => { req.result.createObjectStore(PERSIST_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return persistDbPromise;
}
// Every mutable, real-data collection in the app, gathered into one plain object. Pure UI/session
// state (the `state` object, pinBuffer, idleTimer, etc.) is intentionally excluded — see note above.
function buildSnapshot(){
  return {
    v: 1, savedAt: new Date().toISOString(),
    STAFF, residents, houseMealTimes, houseWakeBedTimes,
    carePlans, medicalInfo, visitors, comments, contacts, emergencyContactIdSeq,
    calendarEventIdSeq, calendarEvents,
    calendarSeriesIdSeq, calendarSeries,
    masterMenus, mealNoteIdSeq, residentMealNotes, breakfastOverrides,
    commonMedIdSeq, commonMedications,
    ROUTINE_TYPES, residentRoutines, routineIdSeq,
    dailyCare, irIdSeq, incidentReports,
    foodPhotos, announcements, nextAnnId,
    houseContacts, houseContactIdSeq,
    suppliesReceived, suppliesIdSeq
  };
}
// Restores every collection above from a saved snapshot. STAFF/residents/carePlans/medicalInfo/
// visitors/comments/calendarEvents are declared `const`, so they're cleared and refilled in place;
// everything else is a plain reassignment of its `let` binding — every function elsewhere reads
// these by name at call time, so a reassignment here is picked up everywhere immediately.
function applySnapshot(snap){
  if(!snap) return;
  if(Array.isArray(snap.STAFF)){ STAFF.length = 0; STAFF.push(...snap.STAFF); }
  if(Array.isArray(snap.residents)){ residents.length = 0; residents.push(...snap.residents); }
  if(snap.houseMealTimes) houseMealTimes = snap.houseMealTimes;
  if(snap.houseWakeBedTimes) houseWakeBedTimes = snap.houseWakeBedTimes;
  if(snap.carePlans){ Object.keys(carePlans).forEach(k=>delete carePlans[k]); Object.assign(carePlans, snap.carePlans); }
  if(snap.medicalInfo){ Object.keys(medicalInfo).forEach(k=>delete medicalInfo[k]); Object.assign(medicalInfo, snap.medicalInfo); }
  if(snap.visitors){ Object.keys(visitors).forEach(k=>delete visitors[k]); Object.assign(visitors, snap.visitors); }
  if(snap.comments){ Object.keys(comments).forEach(k=>delete comments[k]); Object.assign(comments, snap.comments); }
  if(snap.contacts){ Object.keys(contacts).forEach(k=>delete contacts[k]); Object.assign(contacts, snap.contacts); }
  if(typeof snap.emergencyContactIdSeq === "number") emergencyContactIdSeq = snap.emergencyContactIdSeq;
  if(Array.isArray(snap.houseContacts)) houseContacts = snap.houseContacts;
  if(typeof snap.houseContactIdSeq === "number") houseContactIdSeq = snap.houseContactIdSeq;
  if(Array.isArray(snap.suppliesReceived)) suppliesReceived = snap.suppliesReceived;
  if(typeof snap.suppliesIdSeq === "number") suppliesIdSeq = snap.suppliesIdSeq;
  if(typeof snap.calendarEventIdSeq === "number") calendarEventIdSeq = snap.calendarEventIdSeq;
  if(snap.calendarEvents){ Object.keys(calendarEvents).forEach(k=>delete calendarEvents[k]); Object.assign(calendarEvents, snap.calendarEvents); }
  if(typeof snap.calendarSeriesIdSeq === "number") calendarSeriesIdSeq = snap.calendarSeriesIdSeq;
  if(snap.calendarSeries) calendarSeries = snap.calendarSeries;
  if(snap.masterMenus) masterMenus = snap.masterMenus;
  if(typeof snap.mealNoteIdSeq === "number") mealNoteIdSeq = snap.mealNoteIdSeq;
  if(snap.residentMealNotes) residentMealNotes = snap.residentMealNotes;
  if(snap.breakfastOverrides) breakfastOverrides = snap.breakfastOverrides;
  if(typeof snap.commonMedIdSeq === "number") commonMedIdSeq = snap.commonMedIdSeq;
  if(Array.isArray(snap.commonMedications)) commonMedications = snap.commonMedications;
  if(Array.isArray(snap.ROUTINE_TYPES)) ROUTINE_TYPES = snap.ROUTINE_TYPES;
  if(snap.residentRoutines) residentRoutines = snap.residentRoutines;
  if(typeof snap.routineIdSeq === "number") routineIdSeq = snap.routineIdSeq;
  if(snap.dailyCare) dailyCare = snap.dailyCare;
  if(typeof snap.irIdSeq === "number") irIdSeq = snap.irIdSeq;
  if(snap.incidentReports) incidentReports = snap.incidentReports;
  if(snap.foodPhotos) foodPhotos = snap.foodPhotos;
  if(Array.isArray(snap.announcements)) announcements = snap.announcements;
  if(typeof snap.nextAnnId === "number") nextAnnId = snap.nextAnnId;
  // Shower Schedule is derived entirely from each restored resident's Care Plan hygiene section
  // (see syncShowerScheduleFromHygiene) rather than stored on its own — rebuild it here now that
  // residents/carePlans are back.
  residents.forEach(r => syncShowerScheduleFromHygiene(r.id));
}
let persistTimer = null;
let persistInFlight = false;
let persistQueuedAgain = false;
// Debounced so a burst of renders (typing, rapid taps) triggers one write, not dozens — 700ms after
// the last render(), not the last keystroke, since render() itself is already debounced/deferred
// upstream by scheduleRender() for the fields that matter.
function schedulePersist(){
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(writeSnapshotNow, 700);
}
async function writeSnapshotNow(){
  if(persistInFlight){ persistQueuedAgain = true; return; }
  persistInFlight = true;
  try{
    const db = await openPersistDB();
    const snap = buildSnapshot();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(PERSIST_STORE, "readwrite");
      tx.objectStore(PERSIST_STORE).put(snap, PERSIST_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch(err){
    console.error("Local save failed — this device's storage may be full or unavailable:", err);
  } finally {
    persistInFlight = false;
    if(persistQueuedAgain){ persistQueuedAgain = false; schedulePersist(); }
  }
}
// "Save" button on a resident's profile (Care Plan and every other tab) — every field already
// autosaves instantly as it's edited (via scheduleRender→schedulePersist), so this button doesn't hold
// or gate anything. It just forces an immediate write (skipping the 700ms debounce) and flashes a
// "✓ Saved" confirmation, so staff on a shared iPad get a clear, reassuring signal that their edits are
// down, without changing the underlying always-on-autosave behavior.
let saveFlashTimer = null;
function saveResidentProfileNow(){
  writeSnapshotNow();
  state.profileSaveFlash = true;
  scheduleRender();
  if(saveFlashTimer) clearTimeout(saveFlashTimer);
  saveFlashTimer = setTimeout(()=>{ state.profileSaveFlash = false; scheduleRender(); }, 1600);
}
async function loadSnapshot(){
  const db = await openPersistDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PERSIST_STORE, "readonly");
    const req = tx.objectStore(PERSIST_STORE).get(PERSIST_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function bootApp(){
  try{
    const snap = await loadSnapshot();
    if(snap) applySnapshot(snap);
  } catch(err){
    // No saved data yet, or this browser blocked/lacks IndexedDB (e.g. private browsing on some
    // browsers) — fall back to starting fresh rather than leaving the app stuck unrendered.
    console.error("Local load failed — starting fresh:", err);
  }
  syncResidentBirthdayEvents();
  render();
}

bootApp();
</script>
