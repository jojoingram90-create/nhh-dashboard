<title>NHH House Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --bg:#F3F6FA; --surface:#FFFFFF; --surface-alt:#EAEFF6; --border:#D7DFEA;
    --text:#1A2433; --text-muted:#5C6B7D; --text-faint:#8695A8;
    --accent:#1F3F66; --accent-strong:#142C47; --accent-soft:#DEE8F4; --accent-soft-text:#1F3F66;
    --shadow: 0 1px 2px rgba(20,32,52,.06), 0 6px 20px rgba(20,32,52,.06);

    --fall-bg:#FCEEDC; --fall-text:#8A4B08; --fall-dot:#C77A1F;
    --hospice-bg:#F0E6F8; --hospice-text:#5B3B87; --hospice-dot:#7C57A8;
    --away-bg:#E1EDF8; --away-text:#1F5788; --away-dot:#3E7CB1;
    --alert-bg:#FBE3E1; --alert-text:#9A2C22; --alert-dot:#C0392B;
    --good-bg:#E1F2E8; --good-text:#256A44; --good-dot:#2E7D57;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1620; --surface:#161F2C; --surface-alt:#1D2836; --border:#2B3A4C;
      --text:#E7ECF3; --text-muted:#9AACC2; --text-faint:#71839A;
      --accent:#8FB4E3; --accent-strong:#BFD6F0; --accent-soft:#1E3350; --accent-soft-text:#BFD6F0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);

      --fall-bg:#3A2A12; --fall-text:#F0B266; --fall-dot:#E0954A;
      --hospice-bg:#2C2340; --hospice-text:#D2B9F0; --hospice-dot:#A57FD6;
      --away-bg:#152B40; --away-text:#9CC6EE; --away-dot:#5B9AD1;
      --alert-bg:#3A1D1A; --alert-text:#F2A79E; --alert-dot:#D9584B;
      --good-bg:#16301F; --good-text:#8FD3AA; --good-dot:#49A06E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1620; --surface:#161F2C; --surface-alt:#1D2836; --border:#2B3A4C;
    --text:#E7ECF3; --text-muted:#9AACC2; --text-faint:#71839A;
    --accent:#8FB4E3; --accent-strong:#BFD6F0; --accent-soft:#1E3350; --accent-soft-text:#BFD6F0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --fall-bg:#3A2A12; --fall-text:#F0B266; --fall-dot:#E0954A;
    --hospice-bg:#2C2340; --hospice-text:#D2B9F0; --hospice-dot:#A57FD6;
    --away-bg:#152B40; --away-text:#9CC6EE; --away-dot:#5B9AD1;
    --alert-bg:#3A1D1A; --alert-text:#F2A79E; --alert-dot:#D9584B;
    --good-bg:#16301F; --good-text:#8FD3AA; --good-dot:#49A06E;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3,h4{ margin:0; text-wrap:balance; font-weight:700; letter-spacing:-.01em; }
  button{ font-family:inherit; font-size:inherit; cursor:pointer; }
  table{ border-collapse:collapse; width:100%; }
  .tabular{ font-variant-numeric:tabular-nums; }

  #app{ display:flex; min-height:100vh; visibility:hidden; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:228px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none;
  }
  .brand-text{ line-height:1.2; }
  .brand-text .top{ font-weight:800; font-size:14.5px; }
  .brand-text .sub{ font-size:12.5px; color:var(--text-muted); }

  .house-picker{ position:relative; }
  .house-picker select{
    width:100%; appearance:none; background:var(--surface-alt); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:9px 30px 9px 11px; font-weight:600; font-size:13.5px;
  }
  .house-picker::after{
    content:"⌄"; position:absolute; right:11px; top:50%; transform:translateY(-55%);
    color:var(--text-muted); pointer-events:none; font-size:14px;
  }
  .house-picker.locked select{ opacity:.75; cursor:not-allowed; }

  nav.primary{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:12px 11px; border-radius:8px;
    color:var(--text-muted); background:none; border:none; text-align:left; width:100%; font-weight:600; font-size:14px;
  }
  .nav-item .ic{ width:18px; text-align:center; font-size:14px; }
  .nav-item:hover{ background:var(--surface-alt); color:var(--text); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent-soft-text); }
  .nav-badge{ margin-left:auto; background:var(--accent); color:#fff; border-radius:99px; padding:1px 8px; font-size:11.5px; font-weight:700; min-width:18px; text-align:center; }

  .sidebar-foot{ margin-top:auto; padding:10px 6px 0; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-faint); }

  button.sidebar-toggle{ display:none; }
  .sidebar-backdrop{ display:none; }

  @media (max-width: 900px){
    button.sidebar-toggle{ display:inline-flex; }
    #sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:60; box-shadow:0 0 0 100vw rgba(0,0,0,0), var(--shadow);
      transform:translateX(-100%); transition:transform .25s ease; width:250px;
    }
    #app.sidebar-open #sidebar{ transform:translateX(0); }
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:rgba(20,20,20,.4); z-index:55;
    }
    #app.sidebar-open .sidebar-backdrop{ display:block; }
  }

  /* ---------- Main ---------- */
  #main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 26px; border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  #topbar h1{ font-size:19px; }
  .topbar-date{ color:var(--text-muted); font-size:13px; font-weight:600; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .identity-chip{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid var(--border); border-radius:99px; padding:6px 13px 6px 9px; font-size:13px; font-weight:700; line-height:1.3; }
  .identity-dot{ width:9px; height:9px; border-radius:99px; flex:none; }
  .identity-role{ display:block; font-size:12px; font-weight:600; color:var(--text-faint); }

  /* PIN lock screen */
  .lock-screen{ position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; background:var(--bg); }
  .lock-card{ width:min(360px, 90vw); background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:32px 28px; text-align:center; }
  .lock-title{ font-size:15px; font-weight:700; margin:20px 0 18px; }
  .pin-dots{ display:flex; justify-content:center; gap:14px; margin-bottom:26px; }
  .pin-dot{ width:14px; height:14px; border-radius:99px; border:2px solid var(--border); background:transparent; }
  .pin-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .pin-dot.error{ background:var(--alert-dot); border-color:var(--alert-dot); }
  .pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
  .pin-key{ padding:16px 0; border-radius:12px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:19px; font-weight:700; font-family:inherit; }
  .pin-key:hover{ border-color:var(--accent); }
  .pin-key-del{ font-size:14px; color:var(--text-muted); }
  .lock-hint{ font-size:12px; color:var(--text-faint); line-height:1.5; margin-bottom:12px; }

  #content{ padding:22px 26px 60px; max-width:1180px; }

  /* ---------- Shared bits ---------- */
  .section{ margin-bottom:30px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .section-head h2{ font-size:15px; }
  .section-head .hint{ font-size:13px; color:var(--text-faint); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:10px 15px; border-radius:8px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px; min-height:40px;
  }
  .btn:hover{ background:var(--surface-alt); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.small{ padding:8px 13px; font-size:12.5px; min-height:34px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* Big, one-tap logging buttons for Today's Flow — Meals Eaten / Log Vitals / Medications. Replaces
     a small text button + separate checkbox with one clear, easy-to-hit action; see task-log-options
     for the icon-button row a tap opens (% eaten, or Pass/Refuse). */
  .task-log-btn{ padding:12px 18px; border-radius:10px; font-weight:700; font-size:14px; min-height:48px; }
  .task-log-options{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .task-log-opt{ border:1px solid var(--border); background:var(--surface-alt); color:var(--text); padding:14px 10px; border-radius:10px; font-weight:700; font-size:14px; min-width:64px; min-height:52px; flex:1 1 64px; text-align:center; }
  .task-log-opt.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .task-log-opt.pass{ background:var(--good-bg); border-color:var(--good-dot); color:var(--good-text); }
  .task-log-opt.pass.active{ background:var(--good-dot); color:#fff; }
  .task-log-opt.refuse{ background:var(--alert-bg); border-color:var(--alert-dot); color:var(--alert-text); }
  .task-log-opt.refuse.active{ background:var(--alert-dot); color:#fff; }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .badge .dot{ width:6px; height:6px; border-radius:99px; }
  .badge.fall{ background:var(--fall-bg); color:var(--fall-text); } .badge.fall .dot{ background:var(--fall-dot); }
  .badge.hospice{ background:var(--hospice-bg); color:var(--hospice-text); } .badge.hospice .dot{ background:var(--hospice-dot); }
  .badge.away{ background:var(--away-bg); color:var(--away-text); } .badge.away .dot{ background:var(--away-dot); }
  .badge.alert{ background:var(--alert-bg); color:var(--alert-text); } .badge.alert .dot{ background:var(--alert-dot); }
  .badge.good{ background:var(--good-bg); color:var(--good-text); } .badge.good .dot{ background:var(--good-dot); }

  /* stat strip */
  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .stat-tile{ padding:14px 16px; }
  .stat-tile .n{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-tile .l{ font-size:13px; color:var(--text-muted); font-weight:600; margin-top:2px; }

  /* resident grid */
  .resident-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:12px; }
  .resident-card{ padding:14px; text-align:left; display:flex; flex-direction:column; gap:9px; }
  .resident-card:hover{ border-color:var(--accent); cursor:pointer; }
  .r-top{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:38px; height:38px; border-radius:99px; background:var(--accent-soft); color:var(--accent-soft-text);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; flex:none;
  }
  .r-name{ font-weight:700; font-size:14px; }
  .r-room{ font-size:12.5px; color:var(--text-muted); }
  .r-badges{ display:flex; flex-wrap:wrap; gap:5px; }
  .r-note{ font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:8px; }

  /* today's flow */
  .flow-block{ padding:16px 18px; margin-bottom:12px; }
  .flow-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .flow-head .ic{ font-size:17px; }
  .flow-head h3{ font-size:14px; }
  .flow-head .shift-tag{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); background:var(--surface-alt); padding:3px 8px; border-radius:99px; }

  /* time-of-day buckets — collapsed by default except the one matching the current time */
  .flow-bucket{ border-top:1px solid var(--border); }
  .flow-bucket:first-child{ border-top:none; }
  .flow-bucket-toggle{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
    padding:12px 4px; font-family:inherit; cursor:pointer; color:var(--text);
  }
  .flow-bucket-caret{ font-size:12px; color:var(--text-faint); width:12px; flex:none; }
  .flow-bucket-label{ font-size:13.5px; font-weight:700; }
  .flow-bucket-now-pill{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#fff; background:var(--accent); padding:2px 8px; border-radius:99px; }
  .flow-bucket-count{ margin-left:auto; font-size:12.5px; color:var(--text-faint); font-weight:600; }
  .flow-bucket-body{ padding-bottom:6px; }

  .task-row{ display:flex; align-items:flex-start; gap:9px; padding:8px 6px 8px 9px; border-top:1px solid var(--border); border-left:3px solid transparent; }
  .task-row:first-of-type{ border-top:none; }
  .flow-now-marker + .task-row, .mealgroup-members .task-row:first-child{ border-top:none; }
  .task-row[data-type="wake"]{ border-left-color:var(--fall-dot); }
  .task-row[data-type="shower"]{ border-left-color:var(--away-dot); }
  .task-row[data-type="breakfast"], .task-row[data-type="lunch"], .task-row[data-type="dinner"]{ border-left-color:var(--good-dot); }
  .task-row[data-type="routine"]{ border-left-color:var(--hospice-dot); }
  .task-row[data-type="bedtime"]{ border-left-color:var(--accent); }
  .task-row.flow-row-current{ background:var(--accent-soft); border-radius:8px; }
  .flow-now-marker{ display:flex; align-items:center; gap:8px; margin:8px 0; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); }
  .flow-now-marker::before, .flow-now-marker::after{ content:""; flex:1; height:1px; background:var(--accent); opacity:.35; }
  .flow-completed-toggle{ cursor:pointer; font-size:13px; font-weight:700; color:var(--text-muted); padding:11px 2px 7px; margin-top:6px; border-top:1px solid var(--border); user-select:none; }
  .flow-completed-toggle:hover{ color:var(--text); }
  .task-row input[type=checkbox]{ width:22px; height:22px; accent-color:var(--accent); flex:none; margin-top:2px; }
  .task-row-headline{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
  .task-row .who{ font-weight:700; font-size:13.5px; display:flex; align-items:center; flex-wrap:wrap; gap:2px; }
  .task-row-desc{ display:flex; align-items:flex-start; gap:6px; color:var(--text-muted); font-size:13px; flex-wrap:wrap; }
  .desc-text{ flex:1; min-width:0; }
  .show-more-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12.5px; padding:0; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .show-more-btn:hover{ text-decoration:underline; }
  .task-row-actions{ display:flex; align-items:center; gap:8px; flex:none; margin-left:auto; padding-top:1px; }
  .task-row .staff{ font-size:12.5px; color:var(--good-text); font-weight:600; white-space:nowrap; }
  .task-row .added-by{ font-size:12.5px; color:var(--text-faint); white-space:nowrap; }
  .task-row.done .who, .task-row.done .task-row-desc{ text-decoration:line-through; opacity:.5; }
  .dc-stamp-editable{ display:flex; align-items:center; gap:6px; }

  /* meal groups — residents sharing a standard mealtime nest under one collapsible row */
  .mealgroup-row{ cursor:pointer; }
  .mealgroup-row:hover{ background:var(--surface-alt); border-radius:8px; }
  .mealgroup-caret{ font-size:12px; color:var(--text-faint); padding-top:3px; flex:none; }
  .mealgroup-count-pill{ font-size:12px; font-weight:700; color:var(--text-faint); white-space:nowrap; }
  .mealgroup-members{ padding-left:27px; }
  .custom-time-badge{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-soft-text); padding:2px 8px; border-radius:99px; white-space:nowrap; }

  /* resident profile */
  .profile-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .profile-id{ display:flex; gap:14px; align-items:center; }
  .avatar.lg{ width:58px; height:58px; font-size:19px; }
  .profile-id h2{ font-family:"Source Serif 4", Georgia, serif; font-size:23px; font-weight:600; }
  .profile-meta{ font-size:13px; color:var(--text-muted); margin-top:3px; }
  .back-link{ background:none; border:none; color:var(--text-muted); font-weight:600; font-size:13px; padding:0 0 10px; }
  .back-link:hover{ color:var(--accent); }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab{ background:none; border:none; padding:10px 14px; font-weight:600; font-size:13px; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--accent); border-color:var(--accent); }

  .kv-grid{ display:grid; grid-template-columns:170px 1fr; gap:11px 16px; }
  .kv-grid dt{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); }
  .kv-grid dd{ margin:0; font-size:14px; }
  .tag-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ background:var(--surface-alt); border:1px solid var(--border); border-radius:99px; padding:3px 10px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .tag-remove{ background:none; border:none; color:inherit; opacity:.55; cursor:pointer; font-size:12px; padding:6px; margin:-6px; font-family:inherit; line-height:1; }
  .tag-remove:hover{ opacity:1; }
  .tag.perm-tag-none{ color:var(--text-faint); background:transparent; border-style:dashed; }
  .cp-section{ padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  .cp-section:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .cp-hint{ font-size:12.5px; color:var(--text-faint); margin-top:5px; }
  .flow-tag{ display:inline-block; font-size:19px; line-height:1; flex:none; }
  .meal-time-settings{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
  .meal-time-settings label{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); display:block; margin-bottom:6px; }

  .visitor-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); gap:12px; }
  .visitor-row:first-child{ border-top:none; }
  .visitor-name{ font-weight:700; font-size:13.5px; }
  .visitor-rel{ font-size:12.5px; color:var(--text-muted); }
  .visitor-note{ font-size:12.5px; color:var(--text-faint); text-align:right; max-width:220px; }

  .comment{ padding:11px 0; border-top:1px solid var(--border); }
  .comment:first-child{ border-top:none; }
  .comment-meta{ font-size:12px; color:var(--text-faint); margin-bottom:3px; font-weight:600; }
  .comment-body{ font-size:13.5px; }
  .comment-form{ display:flex; gap:8px; margin-top:12px; }
  .comment-form input{ flex:1; border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; }
  .comment-form select, .routine-add-form select, .form-select{ border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; flex:none; }
  .routine-add-form{ margin-top:14px; }
  .routine-add-form input[type=text]{ border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; }

  /* dashboard meal quick-log & routine quick-log — shared form styling */
  .routine-quicklog{ padding:14px 16px; margin:0 0 10px 34px; background:var(--surface-alt); border-style:dashed; }
  .routine-quicklog select{ border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:8px 10px; font-size:12.5px; font-family:inherit; color:var(--text); min-height:36px; }
  .routine-quicklog-actions{ display:flex; gap:8px; margin-top:10px; }
  .med-log-row{ padding:10px 0; border-top:1px solid var(--border); }

<script>
/* ---------------- Mock data (mirrors the Supabase schema in the design spec) ---------------- */
// ---- Live date/time engine ----
// Everything below reads the REAL current date/time rather than a fixed demo snapshot, so the app
// keeps working correctly day after day at a real house instead of being frozen on one walkthrough
// date. TODAY/TODAY_SHORT/TODAY_ISO/TODAY_DOW are refreshed once per render() (see refreshTodayIfNeeded)
// so a shared iPad left open overnight rolls into the new day on its own next render, without needing
// a page reload.
function pad2(n){ return String(n).padStart(2,"0"); }
function isoDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseIso(s){ const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); }
function addDaysIso(s, n){ const d = parseIso(s); d.setDate(d.getDate()+n); return isoDate(d); }
function addMonthsIso(s, n){ const d = parseIso(s); d.setMonth(d.getMonth()+n); return isoDate(d); }
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtLong(d){ return `${DOW_LONG[d.getDay()]}, ${MONTH_LONG[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function fmtShort(d){ return `${DOW_SHORT[d.getDay()]} ${MONTH_LONG[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
function fmtDayLabel(d){ return `${DOW_SHORT[d.getDay()]} ${d.getDate()}`; }
function nowRef(){ return new Date(); } // the real current moment — replaces the old fixed NOW_REF
function todayIso(){ return isoDate(nowRef()); }
let TODAY = fmtLong(nowRef());
let TODAY_SHORT = fmtShort(nowRef());
let TODAY_ISO = todayIso();
let TODAY_DOW = DOW_SHORT[nowRef().getDay()];
function refreshTodayIfNeeded(){
  const iso = todayIso();
  if(iso !== TODAY_ISO){
    TODAY_ISO = iso;
    TODAY = fmtLong(nowRef());
    TODAY_SHORT = fmtShort(nowRef());
    TODAY_DOW = DOW_SHORT[nowRef().getDay()];
  }
}

// Only one house for this pilot.
const houses = [
  { id:"boca-bay", name:"Boca Bay", address:"4157 Boca Bay Dr" }
];

// Starts empty for the live pilot — add this house's real residents from the new Manage Residents
// screen (Residents & Care Plans module, Edit access) once it's up and running.
const residents = [];

// Care Plan option lists — used to drive chip-select UI throughout the Care Plan tab.
const MOBILITY_TYPES = ["Independent","Cane","Walker","Wheelchair","Bed bound"];
const TRANSFER_TYPES = ["Independent","Standby assist","One person transfer","Two person transfer","Mechanical lift"];
const TOILETING_TYPES = ["Goes by themselves","Needs prompting after meals","Bladder incontinent","Bowel incontinent","Bladder & bowel incontinent"];
const COMM_TYPES = ["Can speak","Nonverbal"];
const DIET_TAGS = ["Diabetic","Pureed","Cut into bite-size pieces","Thickener required for liquids"];
const WEARABLE_TAGS = ["Hearing aids","Glasses"];
const HYGIENE_DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// Events are keyed by real ISO date ("2026-09-14"), not a fixed "Mon 7"-style label, so the calendar
// keeps working for every week going forward rather than being frozen on one walkthrough week.
// mondayOfWeek/weekDates below compute whichever week is being viewed (state.calendarWeekStart,
// defaulting to the real current week) from the real calendar, and Prev/Next Week move that anchor
// by 7 days indefinitely in either direction — see renderCalendar().
function mondayOfIso(iso){
  const d = parseIso(iso);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = dow === 0 ? -6 : 1 - dow; // shift back to Monday
  d.setDate(d.getDate() + diff);
  return isoDate(d);
}

}

// ISO week number of the real current date — the two menus alternate automatically as calendar weeks
// pass, with no one needing to remember to flip a switch.
function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // Mon=0 .. Sun=6
  d.setUTCDate(d.getUTCDate() - dayNum + 3); // nearest Thursday
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
}

// Accepts a normal youtube.com/watch, youtu.be, /shorts/, or existing /embed/ link and returns an
// embeddable player URL, or "" if the link doesn't look like a YouTube video.
function youtubeEmbedUrl(url){
  if(!url) return "";
  try{
    const u = new URL(url);
    let id = "";
    if(u.hostname.includes("youtu.be")) id = u.pathname.slice(1);
    else if(u.searchParams.get("v")) id = u.searchParams.get("v");
    else if(u.pathname.includes("/embed/")) id = u.pathname.split("/embed/")[1];
    else if(u.pathname.includes("/shorts/")) id = u.pathname.split("/shorts/")[1];
    id = (id || "").split("&")[0].split("?")[0].split("/")[0];
    return id ? `https://www.youtube.com/embed/${id}` : "";
  } catch(e){ return ""; }
}

function addRoutine(residentId){
  const timeEl = document.getElementById('routineTime-'+residentId);
  const typeEl = document.getElementById('routineType-'+residentId);
  const detailEl = document.getElementById('routineDetail-'+residentId);
  const vitalTypeEl = document.getElementById('routineVitalType-'+residentId);
  if(!timeEl.value || !typeEl.value) return;
  const def = routineTypeDef(typeEl.value);
  if(def.needsDescription && !detailEl.value.trim()) return;
  if(!residentRoutines[residentId]) residentRoutines[residentId] = [];
  residentRoutines[residentId].push({
    id: routineIdSeq++,
    time: timeEl.value,
    type: typeEl.value,
    vitalType: def.needsVitalType ? vitalTypeEl.value : null,
    detail: detailEl.value.trim(),
    addedBy: currentUser().name,
    loggedAt: null
  });
  detailEl.value = "";
  scheduleRender();
}

function findRoutineItem(itemId){
  for(const rid in residentRoutines){
    const found = (residentRoutines[rid]||[]).find(it=>it.id===itemId);

  return null;

function scheduledRoutinesRows(){
  const rows = [];
  houseResidents().forEach(r=>{
    (residentRoutines[r.id]||[]).forEach(item=>{
      rows.push({ resident:r, item });
    });
  });
  rows.sort((a,b)=> a.item.time.localeCompare(b.item.time));
  return rows;
}

// Medications — each Care Plan medication picks one or more of these anchor times; "other" carries its
// own clock time (med.otherTime) instead of riding a house-standard time. Today's Flow and the Daily
// Care Log both key logged status off medAnchorsForMed()'s "anchor" strings, so a medication given at
// both breakfast and dinner tracks two independent Pass/Refuse records, not one shared status.
const MEDICATION_TIME_OPTIONS = [
  {value:"wake", label:"Wake Up"},
  {value:"breakfast", label:"Breakfast"},
  {value:"lunch", label:"Lunch"},
  {value:"dinner", label:"Dinner"},
  {value:"bedtime", label:"Bedtime"},
  {value:"other", label:"Other"}
];
function medTimeLabel(t, otherTime){
  if(t==="other") return `Other${otherTime?` (${formatTime12(otherTime)})`:""}`;
  return (MEDICATION_TIME_OPTIONS.find(o=>o.value===t)||{}).label || t;
}
function medAnchorsForMed(med){
  return (med.times||[]).map(t=>{
    if(t==="other"){
      if(!med.otherTime) return null;
      return { anchor:`other-${med.otherTime}`, label:medTimeLabel("other", med.otherTime), time:med.otherTime };
    }
    return { anchor:t, label:medTimeLabel(t), time:null };
  }).filter(Boolean);
}
function medLogKey(medId, anchor){ return medId+"::"+anchor; }
function medsForAnchor(residentId, anchor){
  return ((carePlans[residentId]||{}).medications||[]).filter(m=>(m.times||[]).includes(anchor));
}

function defaultDailyCare(){
  return {
    water:null,
    meals:{ breakfast:{pct:null}, lunch:{pct:null}, dinner:{pct:null} },
    medications:{}, // keyed by medLogKey(medId, anchor) -> { status:"pass"|"refuse", reason, by, initials, at }
    prn:{ given:null, reason:"", response:"" },
    vitals:{ monitored:null, types:{} },
    // "unusualNoted" gates the rest of the section — skin condition + nurse notified are only asked
    // (and meant to be filled in) once something unusual has actually been flagged, rather than every
    // resident needing a full skin assessment logged every single day regardless of whether there's
    // anything to report. "Wound/skin care provided per care plan?" stays independent of this gate,
    // since that's routine care that happens (or doesn't) every day either way.
    skin:{ unusualNoted:null, status:[], careProvided:null, nurseNotified:null, nurseNotifiedTime:"" },
    // Same "unusualNoted" gating pattern as skin, on top of the baseline bm/bmTime fact that's tracked
    // every day regardless. unusualType is an array (can be bowel, urination, or both) since a resident
    // can have something worth flagging in both on the same day.
    elimination:{ bm:null, bmTime:"", unusualNoted:null, unusualType:[], bowelIssue:null, bowelIssueOther:"", urinationIssue:null, urinationIssueOther:"", nurseNotified:null, nurseNotifiedTime:"", comments:"" },
    incident:{ occurred:null },
    general:{ overall:null, alertness:null, notes:"" },
    signoff:{ signedBy:null, signedRole:null, signedAt:null },
    meta:{}, // per-section { by, initials, at } — who last touched each section, and when

// Daily care logs are keyed by real ISO date, THEN resident: dailyCare[date][residentId] — one
// separate record per resident per real day, matching the spec's `daily_care_logs` model, rather than
// one flat record that "today's" entries would otherwise silently overwrite forever. Starts empty for
// the live pilot; each day's bucket is created the first time anyone documents something on it.
let dailyCare = {};
// Reads/writes always resolve against a specific day: state.dcViewDate while actively browsing the
// Daily Care Log screen (see shiftDailyCareDate below), otherwise today. Today's Flow and the quick-log
// panels never set dcViewDate, so they always resolve to today regardless of what's being browsed
// elsewhere. Past days are enforced read-only in the UI (renderDailyCareDetail), not here — same
// "gate the controls, not the function" pattern used for module permissions throughout this app.
function getDC(residentId, dateKey){
  const key = dateKey || state.dcViewDate || todayIso();
  if(!dailyCare[key]) dailyCare[key] = {};
  if(!dailyCare[key][residentId]) dailyCare[key][residentId] = defaultDailyCare();
  return dailyCare[key][residentId];
}
function getPath(obj,path){ return path.split(".").reduce((o,k)=> (o==null ? o : o[k]), obj); }
function setPath(obj,path,value){ const parts=path.split("."); let cur=obj; for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; } cur[parts[parts.length-1]] = value; }

const DC_TEXT_FIELDS = {

  "vitalPulse":"vitals.types.pulse.value", "vitalResp":"vitals.types.respirations.value", "vitalO2":"vitals.types.o2sat.value",
  "vitalPainRating":"vitals.types.pain.rating", "vitalPainLocation":"vitals.types.pain.location", "vitalPainDesc":"vitals.types.pain.description",
  "nurseNotifiedTime":"skin.nurseNotifiedTime",

function sectionKeyForPath(path){
  if(path==="water") return "water";
  if(path.startsWith("meals.breakfast")) return "breakfast";
  if(path.startsWith("meals.lunch")) return "lunch";
  if(path.startsWith("meals.dinner")) return "dinner";

  if(path.startsWith("vitals")) return "vitals";

  if(path.startsWith("elimination")) return "elimination";
  if(path.startsWith("incident")) return "incident";

}
function touchSection(dc, sectionKey, identity){
  if(!sectionKey) return;
  dc.meta[sectionKey] = { by:identity.name, initials:identity.initials, at:"Just now" };
}
// Single source of truth for a medication's Pass/Refuse status at one anchor time — called from both
// the Today's Flow "Log Meds" quick-log panel and the full Daily Care Log's Medications section, so
// either one logging a dose immediately shows up in the other (same dc.medications record).
// Correction, not silent overwrite (this is what makes the log trustworthy as an eventual official
// MAR, not just a checkbox): the first time a dose is logged, it's just recorded normally. Logging it
// again with a DIFFERENT status or reason — a genuine correction, not just re-tapping the same
// answer — pushes the old value onto that entry's own `corrections` history before the new value takes
// its place, the same "who/when actually changed this" principle already used for Calendar edits
// elsewhere in this app. Nothing is ever silently replaced with no trace of what it used to say.
function setMedStatus(residentId, medId, anchor, status, reason){
  const dc = getDC(residentId);
  if(!dc.medications) dc.medications = {};
  const key = medLogKey(medId, anchor);
  const existing = dc.medications[key];
  const who = currentUser();
  const isCorrection = existing && (existing.status !== status || (status === "refuse" && (existing.reason||"") !== (reason||"")));
  const corrections = existing ? (existing.corrections || []) : [];
  if(isCorrection){
    corrections.push({ status: existing.status, reason: existing.reason||"", by: existing.by, initials: existing.initials, at: existing.at });
  }
  dc.medications[key] = { status, reason: reason||"", by: who.name, initials: who.initials, at: "Just now", corrections };
  touchSection(dc, "medications", currentUser());
}
function dcSet(residentId, path, value){
  syncFormToState(residentId);

  setPath(dc, path, value);
  touchSection(dc, sectionKeyForPath(path), currentUser());
  scheduleRender();
}
function dcToggleArray(residentId, path, value){

function newMedId(residentId){
  const cp = carePlans[residentId];
  return (cp.medications||[]).reduce((max,m)=>Math.max(max, m.id||0), 0) + 1;
}
function addMedication(residentId){
  syncMedFormToState(residentId);
  const nameEl = document.getElementById(`med-newName-${residentId}`);
  const doseEl = document.getElementById(`med-newDosage-${residentId}`);
  const name = nameEl ? nameEl.value.trim() : "";
  if(!name) return;
  const cp = carePlans[residentId];
  if(!cp.medications) cp.medications = [];
  cp.medications.push({ id:newMedId(residentId), name, dosage:(doseEl?doseEl.value.trim():""), times:[], otherTime:"" });

  if(doseEl) doseEl.value = "";
  scheduleRender();

// Usable for this resident immediately either way (it's already pushed into cp.medications above) —
// this only controls whether the name becomes a quick-pick suggestion for everyone else. A name
// that's new (case-insensitively) starts pending; if it's already on the list in any status, there's
// nothing to add.
function registerCommonMedication(name){
  const exists = commonMedications.some(m=>m.name.toLowerCase()===name.toLowerCase());
  if(exists) return;
  const who = currentUser();
  commonMedications.push({ id:commonMedIdSeq++, name, status:"pending", addedBy: who?who.name:"", addedAt:"Just now" });
}
function approvedCommonMedicationNames(){
  return commonMedications.filter(m=>m.status==="approved").map(m=>m.name);
}
function pendingCommonMedications(){
  return commonMedications.filter(m=>m.status==="pending");
}
function approveCommonMedication(id){
  if(!moduleEdit('residents')) return;
  const m = commonMedications.find(x=>x.id===id);
  if(!m) return;
  m.status = "approved";
  m.approvedBy = currentUser().name;
  scheduleRender();
}
function denyCommonMedication(id){
  if(!moduleEdit('residents')) return;
  commonMedications = commonMedications.filter(x=>x.id!==id);

}

  syncMedFormToState(residentId);
  const cp = carePlans[residentId];
  const med = (cp.medications||[]).find(m=>m.id===medId);
  if(!med) return;
  const idx = med.times.indexOf(timeKey);
  if(idx>=0) med.times.splice(idx,1); else med.times.push(timeKey);
  scheduleRender();
}

function dcCompletionStatus(residentId){
  // Always today's status, regardless of what day a resident's own log might currently be scrolled to.
  const dc = (dailyCare[todayIso()] || {})[residentId];
  if(!dc) return "notstarted";
  if(dc.signoff && dc.signoff.signedBy) return "signed";
  if(dc.log && dc.log.length>0) return "inprogress";
  return "notstarted";
}

function syncIRFormToState(reportId){
  const rep = findIRById(reportId);
  if(!rep) return;
  Object.keys(IR_TEXT_FIELDS).forEach(key=>{
    const el = document.getElementById("ir-"+key+"-"+reportId);
    if(el){
      const path = IR_TEXT_FIELDS[key];
      const parts = path.split(".");
      let cur = rep;
      for(let i=0;i<parts.length-1;i++){ if(cur[parts[i]]===undefined) return; cur = cur[parts[i]]; }
      cur[parts[parts.length-1]] = el.value;
    }
  });
}
function findIRById(reportId){
  for(const rid in incidentReports){
    const found = (incidentReports[rid]||[]).find(x=>x.id===reportId);
    if(found) return found;
  }
  return null;
}
function irSectionKeyForPath(path){
  if(path.startsWith("info")) return "info";
  if(path==="types" || path==="typeOther") return "types";
  if(path==="description") return "description";
  if(path.startsWith("assessment")) return "assessment";
  if(path.startsWith("interventions") || path==="providerInstructions") return "interventions";
  if(path.startsWith("notifications")) return "notifications";
  if(path.startsWith("contributing")) return "contributing";
  if(path.startsWith("corrective") || path.startsWith("followUp")) return "corrective";
  if(path.startsWith("statements")) return "statements";
  if(path.startsWith("adminReview")) return "adminReview";
  return null;
}
function irTouchSection(rep, sectionKey){
  if(!sectionKey) return;
  rep.meta[sectionKey] = { by:currentUser().name, initials:currentUser().initials, at:"Just now" };
}
function irSetPath(reportId, path, value){
  syncIRFormToState(reportId);
  const rep = findIRById(reportId);
  setPath(rep, path, value);
  irTouchSection(rep, irSectionKeyForPath(path));
  scheduleRender();
}
function irToggleArray(reportId, path, value){
  syncIRFormToState(reportId);
  const rep = findIRById(reportId);
  const arr = getPath(rep, path);
  const idx = arr.indexOf(value);
  if(idx>=0) arr.splice(idx,1); else arr.push(value);
  irTouchSection(rep, irSectionKeyForPath(path));
  scheduleRender();
}
function irTouchField(reportId, sectionKey){

}
function irSingleChip(reportId, path, options, current){

/* ---------------- Food photo quality control (cross-house) ---------------- */
const MEAL_CATS = ["salad","lunch","dessert"];
const CAT_META = { salad:{label:"Salad", icon:"🥗"}, lunch:{label:"Lunch", icon:"🍽️"}, dessert:{label:"Dessert", icon:"🍰"} };

// Starts empty for the live pilot — real photos accumulate under real dates as they're uploaded.
// Browsing is bounded by shiftPhotoDate below (never past real "today"; back in time is unbounded)
// rather than a fixed PHOTO_DATES allow-list, so this keeps working indefinitely.
let foodPhotos = {};

function photoStatus(date, entry){
  if(entry) return "posted";
  const deadline = new Date(date+"T19:00:00");
  return nowRef() > deadline ? "missing" : "pending";
}
function shiftPhotoDate(delta){
  const next = addDaysIso(state.photoDate, delta);
  if(next > todayIso()) return; // never browse into the future
  state.photoDate = next;
  render();
}
function handlePhotoUpload(evt, houseId, cat){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    if(!foodPhotos[state.photoDate]) foodPhotos[state.photoDate] = {};
    if(!foodPhotos[state.photoDate][houseId]) foodPhotos[state.photoDate][houseId] = {};
    foodPhotos[state.photoDate][houseId][cat] = { by: currentUser().name, at:"Just now", img: e.target.result };
    render();
  };
  reader.readAsDataURL(file);
}
function openLightbox(src){
  if(!src) return;
  document.getElementById("lightboxImg").src = src;
  document.getElementById("photoLightbox").style.display = "flex";
}
function closeLightbox(){
  document.getElementById("photoLightbox").style.display = "none";
  document.getElementById("lightboxImg").src = "";
}
function renderFoodPhotos(){
  const dateLabel = new Date(state.photoDate+"T12:00:00").toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});

  const summaryCards = houses.map(h=>{
    const dayData = (foodPhotos[state.photoDate]||{})[h.id] || {};
    const statuses = MEAL_CATS.map(c=>photoStatus(state.photoDate, dayData[c]));
    const postedCount = statuses.filter(s=>s==="posted").length;
    const overallKind = postedCount===3 ? "good" : statuses.includes("missing") ? "alert" : "fall";
    const overallLabel = postedCount===3 ? "All posted" : statuses.includes("missing") ? `${postedCount}/3 — missing` : `${postedCount}/3 — due by 7 PM`;
    return `<div class="card stat-tile">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <div style="font-size:13.5px; font-weight:700;">${h.name}</div>
        ${badge(overallKind, overallLabel)}
      </div>
    </div>`;
  }).join("");

  const houseSections = houses.map(h=>{
    const dayData = (foodPhotos[state.photoDate]||{})[h.id] || {};
    const canUploadHere = h.id === state.house;
    const slots = MEAL_CATS.map(c=>{
      const entry = dayData[c];
      const status = photoStatus(state.photoDate, entry);
      const meta = CAT_META[c];
      const media = (entry && entry.img) ? `<img class="photo-thumb" src="${entry.img}" alt="${meta.label} photo" onclick="openLightbox(this.src)">` : `<div class="photo-placeholder">${meta.icon}</div>`;
      const statusBadge = status==="posted" ? badge("good","Posted") : status==="pending" ? badge("fall","Due by 7 PM") : badge("alert","Missing");
      const inputId = `photo-${h.id}-${c}-${state.photoDate}`;
      const uploadControl = canUploadHere ? `
        <label class="btn small" for="${inputId}">${entry?"Replace":"Upload"}</label>
        <input type="file" accept="image/*" id="${inputId}" style="display:none" onchange="handlePhotoUpload(event,'${h.id}','${c}')">` : "";
      return `<div class="photo-slot">
        ${media}
        <div style="font-weight:700; font-size:13px;">${meta.label}</div>
        ${statusBadge}
        ${entry ? `<div style="font-size:12px; color:var(--text-faint);">${entry.by} · ${entry.at}</div>` : ""}
        ${uploadControl}
      </div>`;
    }).join("");
    return `<div class="card house-photo-card">
      <div class="house-photo-head"><h3 style="font-size:14px;">${h.name}${canUploadHere ? ' <span class="shift-tag" style="margin-left:6px;">Your house</span>' : ''}</h3></div>
      <div class="photo-grid">${slots}</div>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
  <div class="section">
    <div class="section-head">
      <h2>Food Photo Quality Control</h2>
      <div class="date-nav">
        <button class="btn small" onclick="shiftPhotoDate(-1)">←</button>
        <span style="font-weight:700; font-size:13px;">${dateLabel}${state.photoDate===todayIso() ? " (Today)" : ""}</span>
        <button class="btn small" onclick="shiftPhotoDate(1)" ${state.photoDate>=todayIso()?'disabled':''}>→</button>
      </div>
    </div>
    <div style="font-size:13px; color:var(--text-faint); margin-bottom:14px;">Salad, lunch, and dessert photos are due from every house by 7:00 PM daily, and every house can see every other house's photos as an NHH-wide quality standard.</div>
    <div class="stat-strip" style="grid-template-columns:repeat(${houses.length},1fr); margin-bottom:18px;">${summaryCards}</div>
    <div style="display:flex; flex-direction:column; gap:14px;">${houseSections}</div>
  </div>`;
}

// In the real build, PINs are never sent to or checked by the client — this is a

// hold the master-menu-admin allow-list (MENU_ADMINS, above). Real house manager and caregiver
// accounts for this house get added from Manage Staff once the pilot is live — change these three PINs
// there too, whenever you're ready; 4444/5555/6666 are just carried-over placeholders from the design walkthrough.
const STAFF = [
  { id:"johnna", pin:"4444", name:"Johnna", role:"leadership", label:"Leadership", rail:"var(--hospice-dot)", shift:"n/a", initials:"J" },
  { id:"tucker", pin:"5555", name:"Tucker", role:"leadership", label:"Leadership", rail:"var(--hospice-dot)", shift:"n/a", initials:"T" },
  { id:"buke",   pin:"6666", name:"Buke",   role:"leadership", label:"Leadership", rail:"var(--hospice-dot)", shift:"n/a", initials:"B" }
];
function currentUser(){ return STAFF.find(s=>s.id===state.userId) || null; }
const IDLE_LOCK_MS = 2 * 60 * 1000; // auto-lock after 2 minutes of no taps/clicks
let idleTimer = null;
let pinBuffer = "";
let pinError = false;

function lockApp(){
  if(!state.userId) return; // already locked
  // don't lose anything the current user was mid-typing
  if(document.activeElement && typeof document.activeElement.blur === "function") document.activeElement.blur();
  if(state.view==="dailycaredetail" && state.dcResidentId) syncFormToState(state.dcResidentId);
  state.userId = null;
  pinBuffer = "";
  pinError = false;
  render();
}
function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  if(state.userId) idleTimer = setTimeout(lockApp, IDLE_LOCK_MS);
}
function pinDigit(d){
  if(pinBuffer.length>=4) return;
  pinError = false;
  pinBuffer += String(d);
  if(pinBuffer.length===4){
    const match = STAFF.find(s=>s.pin===pinBuffer);
    if(match){ state.userId = match.id; pinBuffer=""; resetIdleTimer(); render(); }
    else { pinError = true; render(); setTimeout(()=>{ pinBuffer=""; pinError=false; render(); }, 500); }
  } else {
    render();
  }
}
function pinBackspace(){ pinBuffer = pinBuffer.slice(0,-1); pinError=false; render(); }
function renderLockScreen(){
  const overlay = document.getElementById("lockScreen");
  overlay.style.display = "flex";
  const dots = [0,1,2,3].map(i => `<span class="pin-dot ${i<pinBuffer.length?'filled':''} ${pinError?'error':''}"></span>`).join("");
  const keys = [1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  overlay.innerHTML = `
    <div class="lock-card">
      <div class="brand" style="justify-content:center; margin-bottom:6px;">
        <div class="brand-mark">NH</div>
        <div class="brand-text" style="text-align:left;"><div class="top">New Horizon Homes</div><div class="sub">${houses[0].name} · House Dashboard</div></div>
      </div>
      <div class="lock-title">${pinError ? "PIN not recognized" : "Enter your 4-digit PIN"}</div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-pad">
        ${keys.map(k=> k==="" ? `<span></span>` : k==="⌫" ? `<button class="pin-key pin-key-del" onclick="pinBackspace()">⌫</button>` : `<button class="pin-key" onclick="pinDigit(${k})">${k}</button>`).join("")}
      </div>
      <div class="lock-hint">Locks automatically when this tab isn't active, or after ${IDLE_LOCK_MS/60000} minutes idle — so it's always clear which caregiver documented what.</div>
    </div>`;
}

// Starts empty for the live pilot — real shift announcements get posted from the Dashboard once
// staff are using the house iPad.
let announcements = [];
let nextAnnId = 1;

function fmtWhen(d){
  return d.toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
function expiresLabel(d){
  const hrs = (d - nowRef())/3600000;
  if(hrs<0) return "Expired";
  if(hrs<36) return `Expires ${fmtWhen(d)} · ~${Math.round(hrs)} hrs left`;
  return `Expires ${fmtWhen(d)}`;
}
function quickExtend(id,hours){
  const a = announcements.find(x=>x.id===id);
  if(!a) return;
  if(a.author !== currentUser().name) return; // only the original poster may extend
  a.expiresAt = new Date(a.expiresAt.getTime() + hours*3600000);
  const label = hours>=24 ? `${Math.round(hours/24)} day${hours>24?'s':''}` : `${hours} hrs`;
  a.history.push(`Extended by ${currentUser().name} — +${label}`);
  render();
}
function customExtend(id){
  const input = document.getElementById('customExtend-'+id);
  if(!input || !input.value) return;
  const a = announcements.find(x=>x.id===id);
  if(!a || a.author !== currentUser().name) return; // only the original poster may extend
  a.expiresAt = new Date(input.value);
  a.history.push(`Extended by ${currentUser().name} — set to ${fmtWhen(a.expiresAt)}`);
  render();
}
function toggleComposeCustom(){
  const dur = document.getElementById('announceDuration').value;
  document.getElementById('announceCustomWrap').style.display = dur==='custom' ? 'inline-flex' : 'none';
}
function postAnnouncement(){
  const msgEl = document.getElementById('announceMsg');
  const durEl = document.getElementById('announceDuration');
  const customEl = document.getElementById('announceCustom');
  const msg = msgEl.value.trim();
  if(!msg) return;
  const id = currentUser();
  let expiresAt;
  if(durEl.value==='custom'){
    expiresAt = customEl.value ? new Date(customEl.value) : new Date(nowRef().getTime()+24*3600000);
  } else {
    expiresAt = new Date(nowRef().getTime() + Number(durEl.value)*3600000);
  }
  announcements.unshift({ id:nextAnnId++, author:id.name, role:id.label, rail:id.rail, message:msg, postedAt:new Date(nowRef()), expiresAt, history:[] });
  msgEl.value = "";
  render();
}
function announceShift(delta){
  const active = announcements.filter(a => (a.expiresAt - nowRef()) > 0);
  if(active.length===0) return;
  state.announceIndex = (state.announceIndex + delta + active.length) % active.length;
  render();
}

  return `

/* ---------------- Module permissions (Manage Staff) ---------------- */
// Each nav module gets its own view/edit permission per staff member, rather than the single blanket
// manager-or-leadership canEdit() check above. A staff member normally has no explicit `permissions`
// object at all — they simply inherit the role-based default below, which reproduces the exact
// behavior canEdit() always had (manager/leadership = edit everywhere, caregiver = view everywhere).
// An explicit `permissions` object only appears once an admin adds a new staff member or edits an
// existing one on the Manage Staff screen, and from then on it's an independent per-module override
// for that one person — it never affects anyone else's defaults.
const MODULES = [
  {key:"dashboard", label:"Dashboard"},
  {key:"residents", label:"Residents & Care Plans"},
  {key:"dailycare", label:"Daily Care Log"},
  {key:"incidents", label:"Incident Reports"},
  {key:"calendar", label:"Calendar"},
  {key:"menu", label:"Food Menu"},
  {key:"showers", label:"Shower Schedule"},
  {key:"supplies", label:"Supplies Received"},
  {key:"foodphotos", label:"Food Photo QC"},
  {key:"directory", label:"Directory"}
];
function defaultPermissionsForRole(role){
  const tier = (role==="manager" || role==="leadership") ? "edit" : "view";
  const perms = {};
  MODULES.forEach(m=>{ perms[m.key] = tier; });
  return perms;
}
function staffPermissions(staff){ return staff.permissions || defaultPermissionsForRole(staff.role); }
function moduleAccess(key){
  const u = currentUser();
  if(!u) return "none";
  return staffPermissions(u)[key] || "view";
}
function moduleView(key){ return moduleAccess(key) !== "none"; }
function moduleEdit(key){ return moduleAccess(key) === "edit"; }
// "Admin" (can add/remove staff, assign PINs and module permissions) is the leadership role itself,
// not a separate hand-maintained name list like MENU_ADMINS — so a newly added leadership account is
// automatically an admin too, without editing code. Deliberately NOT part of the configurable
// permissions matrix above: letting module permissions grant staff-management access would let someone
// hand themselves admin rights through the very screen meant to be admin-only.
function isSystemAdmin(){ const u = currentUser(); return !!u && u.role === "leadership"; }
// Guards direct navigation (not just what the nav sidebar shows) into a module a staff member's
// permissions don't allow — render() bounces back to the dashboard rather than rendering a screen
// someone tapped their way into before a permission changed, or via a stray deep link.
function canAccessView(view){
  if(view==="approvals") return moduleEdit("menu") || moduleEdit("residents");
  if(view==="staff") return isSystemAdmin();
  if(view==="manageresidents") return moduleEdit("residents");
  if(view==="resident") return moduleView("residents");
  if(view==="dailycaredetail") return moduleView("dailycare");
  if(view==="incidentdetail") return moduleView("incidents");
  if(MODULES.some(m=>m.key===view)) return moduleView(view);
  return true;
}

const ROLE_LABELS = { manager:"House Manager", caregiver:"Caregiver", leadership:"Leadership" };
const ROLE_RAILS = { manager:"var(--accent)", caregiver:"var(--away-dot)", leadership:"var(--hospice-dot)" };
function computeInitials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function slugifyStaffId(name){
  const base = (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "staff";
  let id = base, n = 2;
  while(STAFF.some(s=>s.id===id)){ id = base+"-"+n; n++; }
  return id;
}
function isLastLeadership(staff){ return staff.role==="leadership" && STAFF.filter(s=>s.role==="leadership").length<=1; }

function toggleStaffAdd(){

// Same sync-before-mutate reasoning used throughout this app (Care Plan, Medications): the add form has
// free-text Name and PIN fields alongside chip/select controls, so any of those controls re-rendering
// the screen must first commit whatever's currently typed in both, or it would be silently lost. (This
// is distinct from the EDIT form's PIN field, which intentionally commits only on its own onchange —
// here there's no live credential yet to protect, just an in-progress draft that must survive re-renders.)
function syncStaffDraftFormToState(){
  if(!state.staffDraft) return;
  const nameEl = document.getElementById("staff-newName");

  state.staffDraft.shift = role==="leadership" ? "n/a" : (state.staffDraft.shift==="n/a" ? "Day" : state.staffDraft.shift);

function setStaffDraftPermission(moduleKey, level){

function addStaffMember(){
  if(!isSystemAdmin() || !state.staffDraft) return;
  syncStaffDraftFormToState();
  const pin = (state.staffDraft.pin||"").trim();
  const name = (state.staffDraft.name||"").trim();
  if(!name){ state.staffAddError = "Enter a name."; scheduleRender(); return; }
  if(!/^\d{4}$/.test(pin)){ state.staffAddError = "PIN must be exactly 4 digits."; scheduleRender(); return; }
  if(STAFF.some(s=>s.pin===pin)){ state.staffAddError = "That PIN is already in use — choose a different one."; scheduleRender(); return; }
  const role = state.staffDraft.role;
  STAFF.push({
    id: slugifyStaffId(name), pin, name, role,
    label: ROLE_LABELS[role], rail: ROLE_RAILS[role],
    shift: role==="leadership" ? "n/a" : state.staffDraft.shift,
    initials: computeInitials(name),

// The PIN field commits (and validates) on its own onchange rather than through the general text sync
// above — an in-progress, not-yet-4-digit PIN should never silently become this person's live login
// credential just because an unrelated chip elsewhere on the row was clicked.
function updateStaffPin(staffId, value){

  syncStaffEditFormToState(staffId);

  if(STAFF.some(s=>s.id!==staffId && s.pin===pin)){ state.staffEditError = "That PIN is already in use by someone else."; scheduleRender(); return; }

function setStaffPermission(staffId, moduleKey, level){
  if(!isSystemAdmin()) return;

/* ---------------- Manage Residents (Residents & Care Plans module, Edit access) ---------------- */
// Same shape and safety patterns as Manage Staff above: a free-text add/edit form with a
// sync-before-mutate guard, an inline confirm-before-remove step, and no native browser dialogs
// anywhere. Adding a resident also creates their Care Plan / Medical Info / Visitors / Comments
// records (all empty) in the same step, so every other tab on their profile works immediately

function slugifyResidentId(name){
  const base = (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "resident";
  let id = base, n = 2;
  while(residents.some(r=>r.id===id)){ id = base+"-"+n; n++; }
  return id;
}

function addResidentMember(){
  if(!moduleEdit('residents') || !state.residentDraft) return;
  syncResidentDraftFormToState();
  const d = state.residentDraft;
  const name = (d.name||"").trim();
  const room = (d.room||"").trim();
  if(!name){ state.residentAddError = "Enter a name."; scheduleRender(); return; }
  if(!room){ state.residentAddError = "Enter a room number."; scheduleRender(); return; }
  const id = slugifyResidentId(name);
  residents.push({
    id, house: state.house, name, initials: computeInitials(name), room,
    dob: d.dob || "", admitted: d.admitted || todayIso(),
    flags: { fall: !!d.flags.fall, hospice: !!d.flags.hospice, away:false },
    note: (d.note||"").trim()
  });
  carePlans[id] = defaultCarePlan();
  carePlans[id].fallRisk.yn = d.flags.fall ? "yes" : "no";
  medicalInfo[id] = defaultMedicalInfo();
  visitors[id] = [];
  comments[id] = [];
  contacts[id] = defaultContacts();
  syncResidentBirthdayEvents();
  state.residentAddOpen = false;
  state.residentAddError = null;
  state.residentDraft = null;
  scheduleRender();
}

function setResidentFlag(residentId, flagKey, value){

function houseSuppliesReceived(){
  const ids = new Set(houseResidents().map(r=>r.id));
  return suppliesReceived.filter(s=>ids.has(s.residentId)).slice().sort((a,b)=>{

    return b.id - a.id;
  });

// Deferring to the next tick lets the browser finish dispatching the current click/tap before the
// DOM gets rebuilt. Without this, committing a text field's value on blur (which re-renders) can
// destroy the very button a caregiver is mid-click on if they tap a chip right after typing —
// the click silently doesn't register and it looks like the app "ate" the tap.
