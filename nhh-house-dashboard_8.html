// Batch G: the Name field now commits (and, when live, persists) on its own onchange, the same
// "commits on its own onchange" pattern the PIN field below already used — previously a name edit was
// only ever picked up as a side effect of syncStaffEditFormToState() running before some OTHER field's
// handler (role/shift/house), so typing a new name and immediately tapping "Done" with nothing else
// touched silently discarded it. Real gap, found while wiring this screen to Supabase; fixed here for
// both live and local-only staff records.
async function commitStaffName(staffId){
  if(!isSystemAdmin()) return;
  const staff = STAFF.find(s=>s.id===staffId);
  if(!staff) return;
  const nameEl = document.getElementById("staff-edit-name-"+staffId);
  const name = (nameEl ? nameEl.value : staff.name || "").trim();
  if(!name){ state.staffEditError = "Name can't be blank."; scheduleRender(); return; }
  const prevName = staff.name;
  staff.name = name;
  staff.initials = computeInitials(name);
  state.staffEditError = null;
  scheduleRender();
  if(supabaseSession && isRealStaffId(staffId) && name !== prevName){
    const { error } = await sbClient.from("users").update({ full_name: name }).eq("id", staffId);
    if(error){
      console.error("Staff name update failed:", error);
      staff.name = prevName; staff.initials = computeInitials(prevName);
      state.staffEditError = error.message || "Could not save that name change.";
      scheduleRender();
    }
  }
}
// The PIN field commits (and validates) on its own onchange rather than through the general text sync
// above — an in-progress, not-yet-4-digit PIN should never silently become this person's live login
// credential just because an unrelated chip elsewhere on the row was clicked. For a real staff record,
// this calls the set_staff_pin() RPC (Leadership-only, checked again server-side, hashed server-side —
// the client never has a hash to compare against, so the local "already in use" pre-check below is
// skipped for live records and left to the RPC's own uniqueness check instead) rather than just setting
// a local field the app never actually reads for a live account (staff.pin stays null — see
// upsertLocalStaffRecord/renderStaffRow, pin_hash is never selectable from the client).
async function updateStaffPin(staffId, value){
  if(!isSystemAdmin()) return;
  syncStaffEditFormToState(staffId);
  const staff = STAFF.find(s=>s.id===staffId);
  if(!staff) return;
  const pin = (value||"").trim();
  if(!/^\d{4}$/.test(pin)){ state.staffEditError = "PIN must be exactly 4 digits."; scheduleRender(); return; }
  // A real, live-backed staff record (a piloted house like Knollview) edited while this session
  // isn't actually signed in to Supabase right now (expired session, lost connection, etc.) used to
  // silently fall through to the local-only branch below — no error, no confirmation, and the PIN
  // never reached pin_hash. That's exactly what happened Oct 2, 2026 (Angie M's PIN looked set but
  // wasn't) — see claude/NHH_Dashboard_Edit_Backlog.md. Say so plainly instead of pretending it saved.
  if(isRealStaffId(staffId) && !supabaseSession){
    state.staffEditError = "Not signed in live right now — this PIN was NOT saved. Sign in (remotely, or via the PIN pad) and try again.";
    state.staffEditNotice = null;
    scheduleRender();
    return;
  }
  if(supabaseSession && isRealStaffId(staffId)){
    state.staffEditError = null; state.staffEditNotice = null; scheduleRender();
    const { error } = await sbClient.rpc("set_staff_pin", { p_user_id: staffId, p_pin: pin });
    if(error){
      console.error("set_staff_pin failed:", error);
      state.staffEditError = error.message || "Could not set that PIN.";
    } else {
      staff.pinPlain = pin; // optimistic — matches set_staff_pin() now also storing it server-side
      state.staffEditNotice = "PIN updated.";
    }
    scheduleRender();
    return;
  }
  if(STAFF.some(s=>s.id!==staffId && s.pin===pin)){ state.staffEditError = "That PIN is already in use by someone else."; scheduleRender(); return; }
  staff.pin = pin;
  state.staffEditError = null;
  scheduleRender();
}
async function setStaffRole(staffId, role){
  if(!isSystemAdmin()) return;
  syncStaffEditFormToState(staffId);
  const staff = STAFF.find(s=>s.id===staffId);
  if(!staff) return;
  if(isLastLeadership(staff) && role!=="leadership"){
    state.staffEditError = "This is the only Leadership account — add another Leadership account before changing this one's role.";
    scheduleRender();
    return;
  }
  const prevRole = staff.role, prevShift = staff.shift;
  staff.role = role;
  staff.label = ROLE_LABELS[role];
  staff.rail = ROLE_RAILS[role];
  if(role==="leadership") staff.shift = "n/a";
  else if(staff.shift==="n/a") staff.shift = "Day";
  state.staffEditError = null;
  scheduleRender();
  if(supabaseSession && isRealStaffId(staffId)){
    const { error } = await sbClient.from("users")
      .update({ role, shift_default: shiftKindForSupabase(staff.shift) }).eq("id", staffId);
    if(error){
      console.error("Staff role update failed:", error);
      // Roll back the optimistic change — most likely cause is the server's own guard_last_leadership
      // trigger rejecting it for a reason the client's own single check above couldn't see (e.g. a race
      // with another admin's edit demoting a different Leadership account at the same moment).
      staff.role = prevRole; staff.label = ROLE_LABELS[prevRole]; staff.rail = ROLE_RAILS[prevRole]; staff.shift = prevShift;
      state.staffEditError = error.message || "Could not save that role change.";
      scheduleRender();
    }
  }
}
async function setStaffShift(staffId, shift){
  if(!isSystemAdmin()) return;

}
// Same one-house-minimum rule as the add-staff draft above, applied to an existing staff member —
// materializes `staff.houses` from staffHouseIds() the first time this is touched (covers a staff record
// that still only has the old singular `staff.house` field), then toggles membership in place. For a
// real staff record this inserts/deletes the matching house_staff row (Leadership-only per RLS).
async function toggleStaffHouse(staffId, houseId){
  if(!isSystemAdmin()) return;
  syncStaffEditFormToState(staffId);
  const staff = STAFF.find(s=>s.id===staffId);
  if(!staff || !houses.some(h=>h.id===houseId)) return;
  const cur = staffHouseIds(staff);
  const wasAssigned = cur.includes(houseId);
  if(wasAssigned){
    if(cur.length<=1){ state.staffEditError = "Choose at least one house."; scheduleRender(); return; }
    staff.houses = cur.filter(id=>id!==houseId);
  } else {
    staff.houses = cur.concat([houseId]);
  }
  state.staffEditError = null;
  scheduleRender();
  if(supabaseSession && isRealStaffId(staffId)){
    const { error } = wasAssigned
      ? await sbClient.from("house_staff").delete().eq("user_id", staffId).eq("house_id", houseId)
      : await sbClient.from("house_staff").insert({ user_id: staffId, house_id: houseId });
    if(error){
      console.error("Staff house assignment update failed:", error);
      // Roll back the optimistic toggle — most likely cause is the server's own guard_last_house
      // trigger rejecting a removal the client's own "at least one" check above couldn't see (e.g. a
      // race with another admin's edit removing a different house for this same person at the same
      // moment).
      staff.houses = cur;
      state.staffEditError = error.message || "Could not save that house assignment.";
      scheduleRender();
    }
  }
}

const STAFF_ROLE_SORT_ORDER = { caregiver:0, manager:1, leadership:2, prn:3 };

function sortStaffList(list, sortMode){
  const arr = list.slice();
  const byName = (a,b) => a.name.localeCompare(b.name);
  if(sortMode === "name-desc") arr.sort((a,b)=> b.name.localeCompare(a.name));
  else if(sortMode === "role") arr.sort((a,b)=>{
    const r = (STAFF_ROLE_SORT_ORDER[a.role] ?? 99) - (STAFF_ROLE_SORT_ORDER[b.role] ?? 99);
    return r !== 0 ? r : byName(a,b);
  });
  else if(sortMode === "house") arr.sort((a,b)=>{
    const r = primaryStaffHouseName(a).localeCompare(primaryStaffHouseName(b));
    return r !== 0 ? r : byName(a,b);

}

   reads/writes through a `state.house`-scoped accessor or filter (see currentHouseMealTimes(),

function slugifyHouseId(name){
  const base = (name||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "house";
  let id = base, n = 2;
  while(houses.some(h=>h.id===id)){ id = `${base}-${n++}`; }

}

function requestRemoveHouse(houseId){
  if(!isSystemAdmin()) return;
  state.houseRemoveBlocked = null;
  if(houses.length<=1){ state.houseRemoveBlocked = { houseId, message:"This is the only house — add another before removing this one." }; scheduleRender(); return; }
  if(residents.some(r=>r.house===houseId)){ state.houseRemoveBlocked = { houseId, message:"This house still has residents on file — move or remove them first (Manage Residents)." }; scheduleRender(); return; }
  const stranded = strandedStaffForHouse(houseId);

function confirmRemoveHouse(houseId){

    scheduleRender();
    return;

  // from their list — materializes `staff.houses` (from staffHouseIds()) so the removed id is dropped
  // for good rather than silently reappearing next time it's read from a stale singular `staff.house`.

}

// Same shape and safety patterns as Manage Staff above: a free-text add/edit form with a
// sync-before-mutate guard, an inline confirm-before-remove step, and no native browser dialogs
// anywhere. Adding a resident also creates their Care Plan / Medical Info / Visitors / Comments
// records (all empty) in the same step, so every other tab on their profile works immediately
// instead of crashing on a resident with no Care Plan yet.
function slugifyResidentId(name){
  const base = (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "resident";
  let id = base, n = 2;
  while(residents.some(r=>r.id===id)){ id = base+"-"+n; n++; }
  return id;
}

function addResidentMember(){
  if(!moduleEdit('residents') || !state.residentDraft) return;
  syncResidentDraftFormToState();
  const d = state.residentDraft;
  const name = (d.name||"").trim();
  const room = (d.room||"").trim();
  if(!name){ state.residentAddError = "Enter a name."; scheduleRender(); return; }
  if(!room){ state.residentAddError = "Enter a room number."; scheduleRender(); return; }
  // Knollview pilot: a resident added on a Supabase-live device needs a real uuid (that's what
  // the residents.id column is) instead of the usual name-based slug, since this same id is what
  // syncLiveHouseToSupabase() upserts to Supabase moments later.
  const id = isDeviceSupabaseLive() && crypto.randomUUID ? crypto.randomUUID() : slugifyResidentId(name);
  residents.push({
    id, house: state.house, name, initials: computeInitials(name), room,
    dob: d.dob || "", admitted: d.admitted || todayIso(),
    flags: { fall: !!d.flags.fall, hospice: !!d.flags.hospice, diabetic: !!d.flags.diabetic, noHomeHealth: !!d.flags.noHomeHealth, declining: !!d.flags.declining, away:false },
    note: (d.note||"").trim()

  if(d.flags.diabetic) setCarePlanDiabeticTag(id, true);
  medicalInfo[id] = defaultMedicalInfo();
  visitors[id] = [];
  comments[id] = [];
  contacts[id] = defaultContacts();
  syncResidentBirthdayEvents();
  state.residentAddOpen = false;

// Diabetic flag <-> Care Plan "Diabetic" diet tag stay in step (Batch L item 89), same two-way idea as Fall risk.
function setCarePlanDiabeticTag(residentId, on){
  const cp = carePlans[residentId];
  if(!cp) return;
  if(!cp.diet) cp.diet = { tags:[] };
  if(!Array.isArray(cp.diet.tags)) cp.diet.tags = [];
  const i = cp.diet.tags.indexOf("Diabetic");
  if(on && i<0) cp.diet.tags.push("Diabetic");
  if(!on && i>=0) cp.diet.tags.splice(i,1);
}
function setResidentFlag(residentId, flagKey, value){
  if(!moduleEdit('residents')) return;
  syncResidentEditFormToState(residentId);
  const r = residents.find(x=>x.id===residentId);
  if(!r) return;
  r.flags[flagKey] = value;
  if(flagKey==="away" && !value){ r.awayReason = null; r.awayReturn = null; }
  if(flagKey==="fall" && carePlans[residentId]){ carePlans[residentId].fallRisk.yn = value ? "yes" : "no"; }
  if(flagKey==="diabetic") setCarePlanDiabeticTag(residentId, !!value);
  if(!r.name){ r.initials = r.initials || "?"; } else { r.initials = computeInitials(r.name); }
  scheduleRender();
}

function applyResidentStatusUpdate(){
  if(!moduleEdit('residents') || !state.residentStatusDraft) return;
  const { residentId, status, returnDate } = state.residentStatusDraft;
  const r = residents.find(x=>x.id===residentId);

/* ---------------- Supplies Received ----------------
   A simple per-resident log: what was received, the date, an optional quantity, and an optional note.
   Gated by its own "supplies" module permission (see MODULES) exactly like every other nav section —
   view-only staff see the list, edit-tier staff also get the add/edit/remove controls.
   Logging starts with quick-tap item buttons rather than typing — see SUPPLY_QUICK_ITEMS/
   SUPPLY_TOILETRY_ITEMS and renderSuppliesAddForm() below. Whatever ends up in the write-in box (at
   either level) is usable and saved immediately, same as a quick-picked item — none of this needs
   Leadership approval, unlike a new medication or diagnosis name. */
const SUPPLY_QUICK_ITEMS = ["Diapers","Wipes","Gloves","Toiletries"];
const SUPPLY_TOILETRY_ITEMS = ["Shampoo","Conditioner","Lotion","Toothpaste","Toothbrush"];
function houseSuppliesReceived(){
  const ids = new Set(houseResidents().map(r=>r.id));
  return suppliesReceived.filter(s=>ids.has(s.residentId) && s.status!=="denied").slice().sort((a,b)=>{
    if(a.dateReceived !== b.dateReceived) return (b.dateReceived||"").localeCompare(a.dateReceived||"");
    return (b.seq||0) - (a.seq||0);
  });
}
// Applies the date/resident filter from item 39 on top of the house-scoped, newest-first list above.
function filteredSuppliesReceived(){
  return houseSuppliesReceived().filter(s=>{
    if(state.suppliesFilterResidentId && s.residentId !== state.suppliesFilterResidentId) return false;
    if(state.suppliesFilterDate && s.dateReceived !== state.suppliesFilterDate) return false;
    return true;
  });
}
function setSuppliesFilterResident(id){ state.suppliesFilterResidentId = id; scheduleRender(); }
function setSuppliesFilterDate(d){ state.suppliesFilterDate = d; scheduleRender(); }
function clearSuppliesFilters(){ state.suppliesFilterResidentId=""; state.suppliesFilterDate=""; scheduleRender(); }
function toggleSuppliesAdd(){
  if(!canProposeSupplies()) return;
  state.suppliesAddOpen = !state.suppliesAddOpen;
  if(state.suppliesAddOpen){
    const list = houseResidents();
    state.suppliesDraft = { residentId: list.length ? list[0].id : "", item:"", quantity:"", dateReceived: todayIso(), notes:"", showToiletries:false, writeInOpen:false };
  }

function syncSuppliesDraftFormToState(){
  if(!state.suppliesDraft) return;
  const d = state.suppliesDraft;
  const residentEl = document.getElementById("sup-newResident"); if(residentEl) d.residentId = residentEl.value;
  const writeInEl = document.getElementById("sup-newWriteIn"); if(writeInEl) d.item = writeInEl.value;
  const qtyEl = document.getElementById("sup-newQty"); if(qtyEl) d.quantity = qtyEl.value;

function addSupplyEntry(){
  if(!canProposeSupplies() || !state.suppliesDraft) return;
  syncSuppliesDraftFormToState();
  const d = state.suppliesDraft;
  const item = (d.item||"").trim();
  if(!d.residentId){ state.suppliesAddError = "Choose a resident."; scheduleRender(); return; }
  if(!item){ state.suppliesAddError = "Choose or write in what was received."; scheduleRender(); return; }
  if(!d.dateReceived){ state.suppliesAddError = "Enter the date received."; scheduleRender(); return; }
  const who = currentUser();
  const approved = moduleEdit('supplies');
  const seq = suppliesIdSeq++;
  const id = isDeviceSupabaseLive() && crypto.randomUUID ? crypto.randomUUID() : seq;
  const entry = { id, seq, residentId: d.residentId, item, quantity:(d.quantity||"").trim(), dateReceived: d.dateReceived, notes: (d.notes||"").trim(), addedBy: who?who.name:"", addedById: who?who.id:null, addedAt:"Just now" };
  if(!approved) entry.status = "pending";
  suppliesReceived.push(entry);
  state.suppliesAddOpen = false;
  state.suppliesAddError = null;
  state.suppliesDraft = null;
  scheduleRender();
}
function approveSupply(id){
  if(!moduleEdit('supplies')) return;
  const s = suppliesReceived.find(x=>x.id===id);

  s.status = "approved";

  s.decidedBy = who ? who.name : "";
  s.decidedById = who ? who.id : null;
  s.decidedAt = "Just now";
  scheduleRender();
}
function denySupply(id){
  if(!moduleEdit('supplies')) return;

// Deferring to the next tick lets the browser finish dispatching the current click/tap before the
// DOM gets rebuilt. Without this, committing a text field's value on blur (which re-renders) can
// destroy the very button a caregiver is mid-click on if they tap a chip right after typing —
// the click silently doesn't register and it looks like the app "ate" the tap.
function scheduleRender(){ setTimeout(render, 0); }
function esc(s){ return (s===null||s===undefined) ? "" : String(s); }
function initialsAvatar(text,cls){ return `<div class="avatar ${cls||''}">${esc(text)}</div>`; }
// A resident's real photo when one's on file, falling back to the initials circle otherwise — used
// everywhere a resident shows up (list cards, profile header, Incident Report/Daily Care headers).
// photoSignedUrl (Supabase-live houses — a 1-hour signed URL, regenerated at sign-in and whenever the
// profile is opened) is preferred over photoUrl (a plain data: URL for the other, still local-only
// houses — the same local-first pattern Food Photos used before it was wired up).
function residentAvatar(r, cls){
  const src = r && (r.photoSignedUrl || r.photoUrl);
  return src ? `<div class="avatar ${cls||''}"><img src="${src}" alt=""></div>` : initialsAvatar(r ? r.initials : "?", cls);
}

function badge(kind,label){
  return `<span class="badge ${kind}"><span class="dot"></span>${label}</span>`;
}
// Status flags (Batch L item 89, Oct 2026). Fall risk / Hospice / Diabetic / No Home Health / Declining
// are stored flags a Manager or Leadership toggles; "New resident" is NOT stored — it is derived from the
// admission date (first 30 days) so it switches itself off. Out of building keeps its own flow.
const RESIDENT_FLAG_DEFS = [
  { key:"fall",         label:"Fall risk",      kind:"fall" },
  { key:"hospice",      label:"Hospice",        kind:"hospice" },
  { key:"diabetic",     label:"Diabetic",       kind:"diabetic" },
  { key:"noHomeHealth", label:"No Home Health", kind:"neutral" },
  { key:"declining",    label:"Declining",      kind:"alert" }
];
const NEW_RESIDENT_DAYS = 30;
function isNewResident(r){
  if(!r || !r.admitted || !/^\d{4}-\d{2}-\d{2}/.test(r.admitted)) return false;
  const [ay,am,ad] = r.admitted.slice(0,10).split("-").map(Number);
  const [ty,tm,td] = todayIso().split("-").map(Number);
  const days = Math.round((Date.UTC(ty,tm-1,td) - Date.UTC(ay,am-1,ad)) / 86400000);
  return days >= 0 && days < NEW_RESIDENT_DAYS;
}
function residentFlagChips(r, handler){
  // handler(key, nextValue) -> inline onclick text; r may be a draft ({flags}) or a resident
  const notLive = (typeof isDeviceSupabaseLive === "function" && isDeviceSupabaseLive() && !residentFlagColumnsLive)
    ? `<div class="cp-hint" style="margin-bottom:8px; color:var(--alert-text);">Diabetic, No Home Health and Declining are only saving on this device for now — the database update for them hasn't been run yet.</div>` : "";
  return notLive + `<div class="chip-row">${RESIDENT_FLAG_DEFS.map(d=>`<button type="button" class="chip-btn ${r.flags[d.key]?'active':''}" onclick="${handler(d.key, !r.flags[d.key])}">${esc(d.label)}</button>`).join("")}</div>`;
}
function residentFlagLabels(r){
  const out = RESIDENT_FLAG_DEFS.filter(d=>r.flags[d.key]).map(d=>d.label);
  if(isNewResident(r)) out.push("New resident");
  if(r.flags.away) out.push("Out of building");
  return out;
}
function residentBadges(r){
  let out="";
  RESIDENT_FLAG_DEFS.forEach(d=>{ if(r.flags[d.key]) out+=badge(d.kind, d.label); });
  if(isNewResident(r)) out+=badge("good","New resident");
  if(r.flags.away) out+=badge("away", r.awayReason || "Out of building");
  if(!out) out=badge("good","No active alerts");
  return out;
}
// Resident Quick View's Fall risk / Hospice / Out of building stat tiles expand into a list of the
// matching residents right on the Dashboard (Johnna's choice, Sept 2026) rather than navigating away —
// tapping the same tile again collapses it. The Residents count tile is different: it always just
// navigates to the Residents page (see renderDashboard()).
function toggleDashboardStatFilter(key){
  state.dashboardStatFilter = state.dashboardStatFilter === key ? null : key;

}
function renderDashboardStatList(key){
  const labels = { fall:"Fall risk", hospice:"Hospice", away:"Out of building" };
  const list = houseResidents().filter(r=>r.flags[key]);
  return `<div class="stat-detail-list">
    <div class="cp-hint" style="margin-bottom:8px;">${labels[key]} — tap a resident to open their profile</div>
    ${list.length ? list.map(r=>`
      <button type="button" class="card incident-row" onclick="openResident('${r.id}')">
        <div class="incident-row-main">
          <div class="who">${esc(r.name)}</div>
          <div class="detail">Room ${esc(r.room)}${key==="away" && r.awayReason ? ` — ${esc(r.awayReason)}` : ""}</div>

// Local-first, same pattern Food Photos used before it was wired up: the file always lands in
// photoUrl right away (a data: URL for local-only houses — a real Supabase upload overwrites it a
// moment later with the real storage path, see uploadResidentPhotoToSupabase). Manager/Leadership
// only, matching moduleEdit('residents') gating the control itself in the profile header.
function handleResidentPhotoUpload(evt, residentId){
  if(!moduleEdit('residents')) return;
  const file = evt.target.files[0];
  if(!file) return;
  const r = residents.find(x=>x.id===residentId);
  if(!r) return;
  const reader = new FileReader();
  reader.onload = function(e){
    r.photoUrl = e.target.result; // local-only houses: this IS the display value (see residentAvatar)
    render();
  };
  reader.readAsDataURL(file);
  if(supabaseSession && r.house === state.house) uploadResidentPhotoToSupabase(residentId, file);
}
function removeResidentPhoto(residentId){
  if(!moduleEdit('residents')) return;
  const r = residents.find(x=>x.id===residentId);
  if(!r) return;
  const wasSupabasePath = supabaseSession && r.house === state.house && typeof r.photoUrl === "string" && r.photoUrl.startsWith(residentId+"/");
  const pathToDelete = wasSupabasePath ? r.photoUrl : null;
  r.photoUrl = null; r.photoSignedUrl = null;
  scheduleRender();
  if(wasSupabasePath) removeResidentPhotoFromSupabase(residentId, pathToDelete);
}
function openDailyCare(id){ state.view="dailycaredetail"; state.dcResidentId=id; state.dcViewDate=null; render(); }
// Prev/Next Day on a resident's Daily Care Log. Only ever moves state.dcViewDate — never past today,
// since a house's daily documentation obviously can't exist yet for a day that hasn't happened.
function shiftDailyCareDate(delta){
  const base = state.dcViewDate || todayIso();
  const next = addDaysIso(base, delta);
  if(next > todayIso()) return;
  state.dcViewDate = next === todayIso() ? null : next;
  scheduleRender();
}
function setProfileTab(t){ state.profileTab=t; render(); }
// Derives the daily_tasks row shape (task_type/resident_id/scheduled_time/detail) from a Today's Flow
// checkbox key — "wake-<residentId>", "bed-<residentId>", or "sched<routineItemId>@<occurrenceTime>"
// (see groupMemberKey()/todaysFlowRows() for where these keys come from). Scheduled time is read live
// at toggle time rather than stored redundantly, same as everywhere else in Today's Flow that
// recomputes from Care Plan/routines on every render — except a repeating routine's occurrence time,
// which only exists in the key itself (the item only stores its start time), so that one's read
// straight from the key instead.
function taskKeyMeta(key){
  if(key.startsWith("wake-")){
    const residentId = key.slice(5);
    return { taskType:"wake_up", residentId, scheduledTime:(carePlans[residentId]||{}).wakeTime || null, detail:null };
  }
  if(key.startsWith("bed-")){
    const residentId = key.slice(4);
    return { taskType:"bedtime", residentId, scheduledTime:(carePlans[residentId]||{}).bedTime || null, detail:null };
  }
  if(key.startsWith("sched")){
    const rest = key.slice(5);
    const atIdx = rest.indexOf('@');
    const itemId = atIdx>=0 ? rest.slice(0, atIdx) : rest;
    const occTime = atIdx>=0 ? rest.slice(atIdx+1) : null;
    const item = findRoutineItem(itemId);
    const residentId = findRoutineItemResidentId(itemId);
    // detail carries the routine item's own id, not a display label — Today's Flow never shows this
    // value to anyone, it exists purely so a "routine" daily_tasks row can be matched back to the
    // right "sched<id>@<time>" checkbox key on load (daily_tasks has no dedicated routine-item-id
    // column to spend on this, and detail is otherwise unused for this task type — see
    // dailyTaskRowFromSupabase). scheduled_time is the occurrence's own real value now, not the item's.
    return { taskType:"routine", residentId, scheduledTime: occTime || (item ? item.time : null), detail: String(itemId) };
  }
  return { taskType:"routine", residentId:null, scheduledTime:null, detail:null };
}
// Rebuilds the ephemeral state.checked/state.completedBy view from today's dailyTaskDone bucket — call
// after any write to dailyTaskDone, and on every day rollover (see refreshTodayIfNeeded). Shower keys
// are untouched here since showers aren't part of dailyTaskDone at all yet.
function syncCheckedFromTaskLog(){
  const today = dailyTaskDone[TODAY_ISO] || {};
  Object.keys(today).forEach(key=>{
    const t = today[key];
    if(t.isDone){ state.checked[key] = true; state.completedBy[key] = t.completedByName; }
    else { delete state.checked[key]; delete state.completedBy[key]; }
  });
}
function toggleTask(key){
  const nowDone = !state.checked[key];
  // Showers stay exactly as ephemeral as before this batch (Johnna's call, Sept 2026 — shower
  // check-off/reschedule tracking is its own later batch, not part of Batch F).
  if(key.startsWith("shower-")){
    state.checked[key] = nowDone;
    if(nowDone) state.completedBy[key] = currentUser().name;
    else delete state.completedBy[key];
    scheduleRender();
    return;
  }
  const who = currentUser();
  if(!dailyTaskDone[TODAY_ISO]) dailyTaskDone[TODAY_ISO] = {};
  const existing = dailyTaskDone[TODAY_ISO][key];
  const id = (existing && existing.id) ? existing.id : (isDeviceSupabaseLive() && crypto.randomUUID ? crypto.randomUUID() : dailyTaskIdSeq++);
  const meta = taskKeyMeta(key);
  dailyTaskDone[TODAY_ISO][key] = {
    id, taskType: meta.taskType, residentId: meta.residentId, scheduledTime: meta.scheduledTime, detail: meta.detail,
    isDone: nowDone,
    completedById: nowDone ? (who ? who.id : null) : null,
    completedByName: nowDone ? (who ? who.name : "") : "",
    completedAt: nowDone ? "Just now" : null
  };
  syncCheckedFromTaskLog();
  scheduleRender();
}

// ---------------- Dashboard "Due Now" banner ----------------
// A compact, high-attention surface above the rest of the Dashboard, showing only what a caregiver
// most urgently needs to act on right now: medications, Scheduled Routines (which already covers Check
// Vital/Give PRN — see Batch K), and showers. Meals and Wake-Up/Bedtime deliberately stay out of this
// banner — they still show, like everything else, in the full Today's Flow list further down. Confirmed
// with Johnna (Sept 2026): up to 9 candidates total, shown 3 at a time with a toggle to page through
// them, and a just-completed card stays visible with its checkmark for 3 seconds before dropping out.
const DUE_NOW_MAX = 9;
const DUE_NOW_PAGE_SIZE = 3;
const DUE_NOW_RECENT_MS = 3000;

// One card per medication "anchor" (Wake Up/Breakfast/Lunch/Dinner/Bedtime) covering every resident due
// at that shared house time, plus one card per resident for any "Other"-time medication (already grouped
// per resident+exact-time by medOtherRows()). Mirrors exactly how Today's Flow already tracks medication
// completion (medAnchorsForMed/medLogKey) — nothing new is computed, just regrouped for this banner.
function dueNowMedAnchorGroups(){
  const out = [];
  const list = houseResidents();
  const standardAnchors = [
    { anchor:"wake", time:houseWakeBedTimes.wake },
    { anchor:"breakfast", time:currentHouseMealTimes().breakfast },
    { anchor:"lunch", time:currentHouseMealTimes().lunch },
    { anchor:"dinner", time:currentHouseMealTimes().dinner },
    { anchor:"bedtime", time:houseWakeBedTimes.bed }
  ];
  standardAnchors.forEach(({anchor, time})=>{
    const members = list.map(r=>{
      const meds = medsForAnchor(r.id, anchor);
      if(!meds.length) return null;
      const dc = getDC(r.id);
      const doneCount = meds.filter(m=>!!(dc.medications||{})[medLogKey(m.id, anchor)]).length;
      return { residentId:r.id, who:r.name, meds, doneCount, allDone: doneCount===meds.length };
    }).filter(Boolean);
    if(!members.length) return;
    out.push({
      key:`duenow-med-${anchor}`, sortTime:time||"99:99", cardType:"med", anchor, time,
      label:`${medTimeLabel(anchor)} medications`, members, done: members.every(m=>m.allDone)
    });
  });
  medOtherRows().forEach(g=>{
    const dc = getDC(g.residentId);
    const doneCount = g.meds.filter(m=>!!(dc.medications||{})[medLogKey(m.id, g.anchor)]).length;
    const allDone = doneCount===g.meds.length;
    out.push({
      key:`duenow-med-other-${g.residentId}-${g.anchor}`, sortTime:g.time||"99:99", cardType:"med", anchor:g.anchor, time:g.time,
      label:"Medications", members:[{ residentId:g.residentId, who:g.who, meds:g.meds, doneCount, allDone }], done:allDone
    });
  });
  return out;
}

// Merges medication groups, showers, and Scheduled Routines into one time-sorted pool, capped at
// DUE_NOW_MAX. Detects each candidate's done-state transition (rather than requiring every logging
// path to separately announce completion) so any card that just became done — however it was logged —
// stays visible with its checkmark for DUE_NOW_RECENT_MS before dropping out. An already-done item from
// before this banner was ever rendered (e.g. a fresh page load partway through a shift) is recorded as
// "seen" without triggering that grace period, so old completions don't flash in on load.
function dueNowCandidates(){
  const flowRows = todaysFlowRows();
  const now = Date.now();
  const cands = [];

  dueNowMedAnchorGroups().forEach(g=>cands.push(g));

  flowRows.filter(row=>row.typeKey==="shower").forEach(row=>{
    cands.push({ key:`duenow-${row.key}`, sortTime:row.time||"99:99", cardType:"shower",
      who:row.who, detail:row.detail, taskKey:row.key, done:!!state.checked[row.key] });
  });

  flowRows.filter(row=>row.typeKey==="routine").forEach(row=>{
    cands.push({ key:`duenow-${row.key}`, sortTime:row.time||"99:99", cardType:"routine", row, done:isFlowRowDone(row) });
  });

  if(!state.dueNowInitialized){
    cands.forEach(c=>{ if(c.done) state.dueNowDoneSeen[c.key] = true; });
    state.dueNowInitialized = true;
  } else {
    cands.forEach(c=>{
      if(c.done && !state.dueNowDoneSeen[c.key]){
        state.dueNowDoneSeen[c.key] = true;
        state.dueNowRecentlyCompleted[c.key] = now;
        setTimeout(scheduleRender, DUE_NOW_RECENT_MS + 50);
      } else if(!c.done && state.dueNowDoneSeen[c.key]){
        delete state.dueNowDoneSeen[c.key];
        delete state.dueNowRecentlyCompleted[c.key];
      }
    });
  }

  const visible = cands.filter(c=>!c.done || (state.dueNowRecentlyCompleted[c.key] && now - state.dueNowRecentlyCompleted[c.key] < DUE_NOW_RECENT_MS));
  visible.sort((a,b)=>(a.sortTime||"99:99").localeCompare(b.sortTime||"99:99"));
  return visible.slice(0, DUE_NOW_MAX);
}

function dueNowGoToPage(delta){
  const total = dueNowCandidates().length;
  const pages = Math.max(1, Math.ceil(total / DUE_NOW_PAGE_SIZE));
  state.dueNowPage = ((state.dueNowPage + delta) % pages + pages) % pages;
  scheduleRender();
}

function renderDueNowCard(c){
  if(c.cardType==="med"){
    const timeLabel = c.time ? formatTime12(c.time) : "";
    return `<div class="due-now-card ${c.done?'done':''}">
      <div class="due-now-card-meta">${timeLabel ? `${timeLabel} · ` : ""}<span class="due-now-card-tag">MEDS</span></div>
      <div class="due-now-card-title">${esc(c.label)}</div>
      ${c.members.map(m=>{
        if(m.allDone){
          const dc = getDC(m.residentId);
          const anyRefused = m.meds.some(med=>((dc.medications||{})[medLogKey(med.id, c.anchor)]||{}).status==="refuse");
          return `<div class="due-now-card-line">${esc(m.who)} <span class="due-now-check" style="color:${anyRefused?'var(--alert-text)':'var(--good-text)'};">✓ ${anyRefused?'Refused':'Passed'}</span></div>`;
        }
        const expandedKey = m.residentId+'|'+c.anchor;
        return `<div class="due-now-card-line">${esc(m.who)} due
          <button type="button" class="btn primary small" onclick="passAllMedications('${m.residentId}','${c.anchor}')">Pass</button>
          <button type="button" class="btn small" onclick="toggleMedQuickLog('${m.residentId}','${c.anchor}')">More</button>
        </div>
        ${state.expandedMedLogKey===expandedKey ? medQuickLogPanel(m.residentId, c.anchor, m.meds) : ""}`;
      }).join("")}
    </div>`;
  }
  if(c.cardType==="shower"){
    return `<div class="due-now-card ${c.done?'done':''}">
      <div class="due-now-card-meta"><span class="due-now-card-tag">SHOWER</span></div>
      <div class="due-now-card-title">${esc(c.who)}</div>
      <div class="due-now-card-line">${esc(c.detail||"")}</div>
      ${c.done
        ? `<div class="due-now-check" style="color:var(--good-text);">✓ Done</div>`
        : `<button type="button" class="btn primary small" onclick="toggleTask('${c.taskKey}')">Mark Done</button>`}
    </div>`;
  }
  // routine — covers Check Vital, Give PRN, and every other Scheduled Routine type
  const row = c.row, item = row.item, occTime = row.occTime, r = row.resident;
  const isVital = item.type==="vital";
  const isPRN = item.type==="prn";
  const existingLog = (routineOccurrenceLogs[TODAY_ISO] || {})[item.id]?.[occTime];
  const vt = isVital ? (VITAL_TYPES.find(v=>v.key===item.vitalType) || VITAL_TYPES[0]) : null;
  // Strip a vital's trailing unit (e.g. "Blood Pressure (mmHg)" → "BLOOD PRESSURE") just for the compact
  // tag pill — the full label with its unit still shows in the card's title/detail line.
  const tag = isVital ? esc(vt.label.replace(/\s*\([^)]*\)\s*$/,"").toUpperCase()) : (isPRN ? "PRN" : "ROUTINE");
  let doneSummary = "Done";
  if(c.done){
    if(isVital) doneSummary = vitalValueDisplay(vt, existingLog && existingLog.value) || "Logged";
    else if(isPRN) doneSummary = "PRN given";
  }
  const expanded = state.expandedRoutineId === (item.id+'@'+occTime);
  return `<div class="due-now-card ${c.done?'done':''}">
    <div class="due-now-card-meta">${formatTime12(occTime)} · <span class="due-now-card-tag">${tag}</span></div>
    <div class="due-now-card-title">${esc(r.name)}</div>
    <div class="due-now-card-line">${esc(routineTypeLabel(item))}${item.detail?` — ${esc(item.detail)}`:""}</div>
    ${c.done
      ? `<div class="due-now-check" style="color:var(--good-text);">✓ ${esc(doneSummary)}</div>`
      : (isVital || isPRN
          ? `<button type="button" class="btn primary small" onclick="toggleRoutineQuickLog('${item.id}','${occTime}')">${isVital?esc(vt.label):'Log PRN'}</button>`
          : `<button type="button" class="btn primary small" onclick="toggleTask('${row.key}')">Mark Done</button>`)}
    ${expanded ? routineQuickLogForm(r, item, occTime) : ""}
  </div>`;
}

function renderDueNowBanner(){
  const all = dueNowCandidates();
  if(!all.length) return "";
  const pages = Math.max(1, Math.ceil(all.length / DUE_NOW_PAGE_SIZE));
  if(state.dueNowPage >= pages) state.dueNowPage = 0;
  const pageItems = all.slice(state.dueNowPage*DUE_NOW_PAGE_SIZE, state.dueNowPage*DUE_NOW_PAGE_SIZE + DUE_NOW_PAGE_SIZE);
  const doneCount = all.filter(c=>c.done).length;
  return `
  <div class="due-now-banner">
    <div class="due-now-head">
      <span class="due-now-pill"><span class="due-now-dot"></span> Due Now</span>
      <span class="due-now-count">${doneCount} of ${all.length} done</span>
    </div>
    <div class="due-now-cards">${pageItems.map(renderDueNowCard).join("")}</div>
    ${pages>1 ? `<div class="due-now-nav">
      <button type="button" class="btn small due-now-toggle" onclick="dueNowGoToPage(-1)">‹ Prev</button>
      <span class="due-now-dots">${Array.from({length:pages}).map((_,i)=>`<span class="dot-ind ${i===state.dueNowPage?'active':''}"></span>`).join("")}</span>
      <button type="button" class="btn small due-now-toggle" onclick="dueNowGoToPage(1)">Next ›</button>
    </div>` : ""}
  </div>`;
}

// Today's Flow is one merged, time-sorted list — wake-ups, showers, meals, scheduled routines, and
// bedtimes for every resident, interleaved by actual clock time rather than grouped into fixed
// category sections. See todaysFlowRows() for how each row gets its time.
function renderTodaysFlow(){
  const rows = todaysFlowRows();
  const now = nowTimeStr();
  const currentBucketKey = flowBucketFor(now).key;

  // Lazy-init: only the bucket matching the real current time starts expanded. Set once, then left
  // alone across re-renders so a manager's manual expand/collapse choices persist while checking things off.
  if(state.flowExpandedBuckets === null){
    state.flowExpandedBuckets = { [currentBucketKey]: true };
  }

  const byBucket = {};
  FLOW_BUCKETS.forEach(b=>{ byBucket[b.key] = []; });
  rows.forEach(row=>{ byBucket[flowBucketFor(row.time).key].push(row); });

  const nonEmptyBuckets = FLOW_BUCKETS.filter(b=>byBucket[b.key].length>0);

  const bucketsHtml = nonEmptyBuckets.map(b=>{
    const bucketRows = byBucket[b.key];
    const pending = bucketRows.filter(r=>!isFlowRowDone(r));
    const completed = bucketRows.filter(isFlowRowDone);
    const expanded = !!state.flowExpandedBuckets[b.key];
    const isCurrent = b.key === currentBucketKey;

    let innerHtml;
    if(pending.length===0){
      innerHtml = `<div class="task-row" style="border-top:none;"><div class="task-row-desc" style="font-style:italic;">${b.label} tasks complete.</div></div>`;
    } else {
      let markerPlaced = !isCurrent; // the Now divider only ever falls inside the current-time bucket
      innerHtml = pending.map(row=>{
        let out = "";
        const isNext = !markerPlaced && row.time && row.time >= now;
        if(isNext){
          out += `<div class="flow-now-marker"><span>Now — ${formatTime12(now)}</span></div>`;
          markerPlaced = true;
        }
        out += renderFlowRow(row, isNext);
        return out;
      }).join("");
      if(isCurrent && !markerPlaced) innerHtml += `<div class="flow-now-marker"><span>Now — ${formatTime12(now)}</span></div>`;
    }

    const completedHtml = completed.length ? `
      <div class="flow-completed-toggle" onclick="toggleBucketCompleted('${b.key}')">${state.flowBucketShowCompleted[b.key] ? "▾" : "▸"} ✓ ${completed.length} completed</div>
      ${state.flowBucketShowCompleted[b.key] ? completed.map(r=>renderFlowRow(r,false)).join("") : ""}` : "";

    return `
    <div class="flow-bucket">
      <button class="flow-bucket-toggle" onclick="toggleFlowBucket('${b.key}')">
        <span class="flow-bucket-caret">${expanded ? "▾" : "▸"}</span>
        <span class="flow-bucket-label">${b.label}</span>
        ${isCurrent ? `<span class="flow-bucket-now-pill">Now</span>` : ""}
        <span class="flow-bucket-count">${completed.length}/${bucketRows.length}</span>
      </button>
      ${expanded ? `<div class="flow-bucket-body">${innerHtml}${completedHtml}</div>` : ""}
    </div>`;
  }).join("");

  return `
  <div class="card flow-block">
    <div class="flow-head"><h3>Today's Flow</h3></div>
    ${nonEmptyBuckets.length ? bucketsHtml : `<div class="task-row" style="border-top:none;"><div class="task-row-desc" style="font-style:italic;">Nothing scheduled for today.</div></div>`}
  </div>`;
}

// Each of the five time-of-day windows Johnna set (Overnight/Morning/Midday/Evening/Night). Only the
// one containing the real current clock time starts expanded; the rest collapse to a one-line header
// a manager can tap open. "before" is the exclusive upper bound of the window, compared as "HH:MM".
const FLOW_BUCKETS = [
  { key:"overnight", label:"Overnight", before:"05:00" },
  { key:"morning",   label:"Morning",   before:"11:00" },
  { key:"midday",    label:"Midday",    before:"16:00" },
  { key:"evening",   label:"Evening",   before:"19:00" },
  { key:"night",     label:"Night",     before:"24:00" }
];
function flowBucketFor(time){
  const t = time || "23:59";
  for(const b of FLOW_BUCKETS) if(t < b.before) return b;
  return FLOW_BUCKETS[FLOW_BUCKETS.length-1];
}
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function toggleFlowBucket(key){
  state.flowExpandedBuckets[key] = !state.flowExpandedBuckets[key];
  scheduleRender();
}
function toggleBucketCompleted(key){
  state.flowBucketShowCompleted[key] = !state.flowBucketShowCompleted[key];
  scheduleRender();
}

// Builds the merged row list: wake-ups and bedtimes (from carePlans wake/bedTime), showers
// (from carePlans hygiene, filtered to residents scheduled today), one grouped row per standard
// mealtime (breakfast/lunch/dinner — see below), and Scheduled Routines (already time-stamped).
// Every row shares one clock-time sort key, used both for the flat sort and for bucketing.
const MEAL_META = {
  breakfast: { icon:"🍳", label:"Breakfast" },
  lunch:     { icon:"🍛", label:"Lunch" },
  dinner:    { icon:"🥪", label:"Dinner" }
};
function todaysFlowRows(){
  const rows = [];

  // Wake-Up and Bedtime are grouped exactly like meals below: residents on the house-standard time
  // nest under one collapsible row, and a resident with a different Care Plan time gets a badge inside
  // it rather than a whole separate row scattered elsewhere in the list.
  const wakeMembers = wakeUpRows().map(row=>({ residentId:row.residentId, who:row.who, detail:row.detail, time:row.time, customTime: row.time !== houseWakeBedTimes.wake }));
  if(wakeMembers.length){
    rows.push({ key:"wakegroup", time:houseWakeBedTimes.wake, icon:"☀️", label:"Wake-Up", kind:"wakegroup", groupKey:"wake", members:wakeMembers, typeKey:"wake" });
  }

  houseResidents().forEach(r=>{
    const cp = carePlans[r.id];
    if(cp.hygiene.mode==="shower" && cp.hygiene.days.includes(TODAY_DOW)){
      const detail = `${esc(cp.hygiene.shift)} shift shower${cp.hygiene.notes?` — ${esc(cp.hygiene.notes)}`:""}.`;
      rows.push({ key:`shower-${r.id}`, time:cp.hygiene.timeOfDay, icon:"🚿", label:"Shower", who:r.name, detail, kind:"simple", typeKey:"shower" });
    }
  });

  // Residents on the house-standard mealtime nest under one collapsible group row rather than each
  // appearing as their own row; a resident with a Care-Plan meal-time override still shows inside the
  // group (grouped by meal, not by exact time) but carries its own "different time" badge — see
  // renderMealMemberRow().
  Object.keys(MEAL_META).forEach(mealKey=>{
    const meta = MEAL_META[mealKey];
    const members = (dailyTasks[mealKey]||[]).map(row=>{
      const time = effectiveMealTime(row.id, mealKey);
      return { residentId:row.id, who:row.who, detail:row.detail, time, customTime: time !== currentHouseMealTimes()[mealKey] };
    });
    if(members.length){
      rows.push({ key:`mealgroup-${mealKey}`, time:currentHouseMealTimes()[mealKey], icon:meta.icon, label:meta.label, kind:"mealgroup", mealKey, members, typeKey:mealKey });
    }
  });

  scheduledRoutinesRows().forEach(({resident:r, item})=>{
    routineOccurrenceTimes(item).forEach(occTime=>{
      rows.push({ key:`sched${item.id}@${occTime}`, time:occTime, occTime, icon:"⏰", label:"Routine", who:r.name, kind:"routine", item, resident:r, typeKey:"routine" });
    });
  });

  const bedMembers = bedtimeRows().map(row=>({ residentId:row.residentId, who:row.who, detail:row.detail, time:row.time, customTime: row.time !== houseWakeBedTimes.bed }));
  if(bedMembers.length){
    rows.push({ key:"bedgroup", time:houseWakeBedTimes.bed, icon:"🌙", label:"Bedtime", kind:"bedgroup", groupKey:"bed", members:bedMembers, typeKey:"bedtime" });
  }

  // Medications tied to one of the five standard anchors (wake/breakfast/lunch/dinner/bedtime) don't get
  // their own row — they ride the matching group row above and surface via a "Log Meds" control on each
  // resident's member row (see medFlowBlock()). Only "Other" custom-time medications need a standalone
  // row here, grouped per resident+exact-time so several other-time meds due together log in one place.
  medOtherRows().forEach(g=>{
    rows.push({ key:`medother-${g.residentId}-${g.anchor}`, time:g.time, icon:"💊", label:"Medication", who:g.who, kind:"medother", meds:g.meds, residentId:g.residentId, anchor:g.anchor, typeKey:"medication" });
  });

  rows.sort((a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99"));
  return rows;
}
// Groups every resident's "Other"-time medications by exact clock time so Today's Flow shows one row
// per resident per custom time, however many medications share that time.
function medOtherRows(){
  const groups = {};
  houseResidents().forEach(r=>{
    (carePlans[r.id].medications||[]).forEach(med=>{
      medAnchorsForMed(med).filter(a=>a.anchor.startsWith("other-")).forEach(a=>{
        const gKey = r.id+"|"+a.anchor;
        if(!groups[gKey]) groups[gKey] = { residentId:r.id, who:r.name, time:a.time, anchor:a.anchor, meds:[] };
        groups[gKey].meds.push(med);
      });
    });
  });
  return Object.values(groups);
}
const GROUP_KINDS = ["mealgroup","wakegroup","bedgroup"];
// The per-resident checkbox key inside any group row — kept identical to what a standalone row would
// have used (e.g. "wake-eleanor"), so nothing about existing checked-state keys had to change.
function groupMemberKey(row, m){
  if(row.kind === "mealgroup") return `${row.mealKey}-${m.residentId}`;
  return `${row.groupKey}-${m.residentId}`;
}
// A group counts as done once every resident inside it has been checked off — except a meal group,
// which now counts a resident as done once their % eaten has actually been logged (Meals Eaten no
// longer has its own separate checkbox — see renderMealMemberRow). Wake-Up/Bedtime groups are
// unchanged, still plain per-resident checkboxes.
function isFlowRowDone(row){
  if(row.kind === "mealgroup") return row.members.length>0 && row.members.every(m=>!!getDC(m.residentId).meals[row.mealKey].pct);
  if(GROUP_KINDS.includes(row.kind)) return row.members.length>0 && row.members.every(m=>!!state.checked[groupMemberKey(row,m)]);
  // Medications (standalone "Other"-time row) — done once every due medication has a recorded status,
  // same fact medFlowBlock's own badge already shows. No checkbox anymore; logging is the completion.
  if(row.kind === "medother"){
    const dc = getDC(row.residentId);
    return row.meds.length>0 && row.meds.every(med=>!!(dc.medications||{})[medLogKey(med.id, row.anchor)]);
  }
  // A vital-type Routine task is done once it's actually been logged; a PRN-type Routine task keeps
  // its own checkbox as before.
  if(row.kind === "routine" && row.item.type === "vital") return !!(routineOccurrenceLogs[TODAY_ISO] || {})[row.item.id]?.[row.occTime];
  return !!state.checked[row.key];
}

// Long descriptions truncate to one line with a "Show more" toggle rather than stretching the row —
// the toggle flips two plain-text spans via the [hidden] attribute, no re-render needed.
const DESC_TRUNCATE_LEN = 70;
function renderRowDescription(icon, label, fullText){
  const text = fullText || "";
  const isLong = text.length > DESC_TRUNCATE_LEN;
  let shortText = text;
  if(isLong){
    shortText = text.slice(0, DESC_TRUNCATE_LEN);
    const lastSpace = shortText.lastIndexOf(" ");
    if(lastSpace > 40) shortText = shortText.slice(0, lastSpace);
    shortText += "…";
  }
  return `<div class="task-row-desc">
    <span class="flow-tag" title="${esc(label)}">${icon}</span>
    <span class="desc-text"><span class="desc-short">${esc(shortText)}</span><span class="desc-full" hidden>${esc(text)}</span></span>
    ${isLong ? `<button class="show-more-btn" onclick="toggleDescMore(this)">Show more</button>` : ""}
  </div>`;
}
function toggleDescMore(btn){
  const wrap = btn.previousElementSibling;
  const shortEl = wrap.querySelector(".desc-short");
  const fullEl = wrap.querySelector(".desc-full");
  const expand = fullEl.hidden;
  fullEl.hidden = !expand;
  shortEl.hidden = expand;
  btn.textContent = expand ? "Show less" : "Show more";
}

function vitalValueDisplay(vt, existing){
  if(!existing) return "";
  if(vt.key==="bp") return (existing.sys || existing.dia) ? `${esc(existing.sys)}/${esc(existing.dia)}` : "";
  if(vt.key==="pain") return existing.rating ? `${esc(existing.rating)}/10${existing.location?` · ${esc(existing.location)}`:""}` : "";
  return existing.value ? esc(existing.value) : "";
}

function renderFlowRow(row, isNext){
  const nextCls = isNext ? " flow-row-current" : "";
  if(row.kind === "mealgroup") return renderMealGroupRow(row, isNext);
  if(row.kind === "wakegroup" || row.kind === "bedgroup") return renderWakeBedGroupRow(row, isNext);
  if(row.kind === "medother") return renderMedOtherRow(row, isNext);

  if(row.kind === "routine"){
    const r = row.resident, item = row.item, occTime = row.occTime;
    const key = row.key;
    const isVital = item.type === "vital";
    const existingLog = (routineOccurrenceLogs[TODAY_ISO] || {})[item.id]?.[occTime];
    // A vital-type routine task has no checkbox — logging its value IS what marks it done (see
    // isFlowRowDone). A PRN-type routine task is unchanged, still a plain checkbox.
    const done = isVital ? !!existingLog : !!state.checked[key];
    const canQuickLog = routineCorrelatesToDailyCare(item.type);
    const expanded = state.expandedRoutineId === (item.id+'@'+occTime);
    const repeatNote = routineRepeatSummary(item);
    const fullDetail = `${routineTypeLabel(item)}${item.detail?` — ${esc(item.detail)}`:""}${repeatNote?` (${repeatNote})`:""}`;
    const vt = isVital ? (VITAL_TYPES.find(v=>v.key===item.vitalType) || VITAL_TYPES[0]) : null;
    let loggedSummary = "";
    if(canQuickLog && existingLog){
      if(isVital){
        const value = vitalValueDisplay(vt, existingLog.value);
        loggedSummary = `${vt.label}${value ? `: ${value}` : ""}`;
      } else if(item.type==="prn"){
        loggedSummary = `PRN given${existingLog.value?.reason ? ` — ${esc(existingLog.value.reason)}` : ""}`;
      }
    }
    return `
      <div class="task-row routine-row ${done?'done':''}${nextCls}" data-type="routine">
        ${isVital ? "" : `<input type="checkbox" ${done?'checked':''} onchange="toggleTask('${key}')">`}
        <div class="task-row-headline">
          <div class="who">${formatTime12(occTime)} — ${r.name}</div>
          ${renderRowDescription(row.icon, "Routine", fullDetail)}
          <div class="added-by">Added by ${item.addedBy}</div>
        </div>
        <div class="task-row-actions">
          ${canQuickLog ? (existingLog
            ? `<div class="dc-stamp-editable"><span class="dc-stamp">${loggedSummary} ✓</span><button class="btn small" onclick="toggleRoutineQuickLog('${item.id}','${occTime}')">✎ Edit</button></div>`
            : (isVital
                ? `<button class="btn primary task-log-btn" onclick="toggleRoutineQuickLog('${item.id}','${occTime}')">${esc(vt.label)}</button>`
                : `<button class="btn small" onclick="toggleRoutineQuickLog('${item.id}','${occTime}')">Log PRN</button>`)) : ""}
        </div>
      </div>
      ${expanded ? routineQuickLogForm(r, item, occTime) : ""}`;
  }

  const done = !!state.checked[row.key];
  const timeLabel = row.time ? `${formatTime12(row.time)} — ` : "";
  return `<div class="task-row ${done?'done':''}${nextCls}" data-type="${row.typeKey}">
    <input type="checkbox" ${done?'checked':''} onchange="toggleTask('${row.key}')">
    <div class="task-row-headline">
      <div class="who">${timeLabel}${row.who}</div>
      ${renderRowDescription(row.icon, row.label, row.detail)}
    </div>
    <div class="task-row-actions">${done && state.completedBy[row.key] ? `<span class="staff">✓ ${state.completedBy[row.key]}</span>` : ""}</div>
  </div>`;
}

// A meal group is a collapsible header (no checkbox of its own — completion is tracked per resident
// inside it) that expands to one row per resident sharing that mealtime, each with its own % Eaten
// quick-log. See isFlowRowDone() for how the group as a whole counts as complete.
function renderMealGroupRow(row, isNext){
  const nextCls = isNext ? " flow-row-current" : "";
  const groupKey = `meal-${row.mealKey}`;
  const expanded = !!state.expandedGroups[groupKey];
  const doneCount = row.members.filter(m=>!!getDC(m.residentId).meals[row.mealKey].pct).length;
  const total = row.members.length;
  const allDone = doneCount === total;
  const timeLabel = row.time ? `${formatTime12(row.time)} — ` : "";
  return `
  <div class="task-row mealgroup-row ${allDone?'done':''}${nextCls}" data-type="${row.typeKey}" onclick="toggleFlowGroup('${groupKey}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')toggleFlowGroup('${groupKey}')">
    <span class="mealgroup-caret">${expanded ? "▾" : "▸"}</span>

      <div class="who">${timeLabel}${row.label} <span class="hint" style="font-weight:600;">— all residents</span></div>

    <div class="task-row-actions"><span class="mealgroup-count-pill">${doneCount}/${total} logged</span></div>
  </div>

}
// Wake-Up / Bedtime groups use the same collapsible-header pattern as a meal group, but members are
// a plain checkbox (no % Eaten quick-log) — see renderWakeBedMemberRow().
function renderWakeBedGroupRow(row, isNext){
  const nextCls = isNext ? " flow-row-current" : "";
  const expanded = !!state.expandedGroups[row.groupKey];
  const doneCount = row.members.filter(m=>!!state.checked[groupMemberKey(row,m)]).length;
  const total = row.members.length;
  const allDone = doneCount === total;
  // No shared group-level time shown here anymore — every resident can have their own wake/bed time on
  // their Care Plan, so a single time next to "Wake-Up"/"Bedtime" was misleading. Each resident's own
  // time still shows once the group is expanded — see renderWakeBedMemberRow().
  return `
  <div class="task-row mealgroup-row ${allDone?'done':''}${nextCls}" data-type="${row.typeKey}" onclick="toggleFlowGroup('${row.groupKey}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')toggleFlowGroup('${row.groupKey}')">
    <span class="mealgroup-caret">${expanded ? "▾" : "▸"}</span>
    <div class="task-row-headline">
      <div class="who">${row.label} <span class="hint" style="font-weight:600;">— all residents</span></div>
      ${renderRowDescription(row.icon, row.label, `Tap to ${expanded ? "collapse" : "expand"} and check off each resident.`)}
    </div>
    <div class="task-row-actions"><span class="mealgroup-count-pill">${doneCount}/${total} done</span></div>
  </div>
  ${expanded ? `<div class="mealgroup-members">${row.members.map(m=>renderWakeBedMemberRow(row,m)).join("")}</div>` : ""}`;
}
function renderWakeBedMemberRow(row, m){
  const key = groupMemberKey(row, m);
  const done = !!state.checked[key];
  // Always shows this resident's own time (falling back to the 7:00 AM/PM display default when nothing's
  // on file — see formatWakeBedTime12) — the group header above no longer carries a shared time, so this
  // is the only place a resident's wake/bed time appears in Today's Flow.
  const timeBadge = `<span class="custom-time-badge">🕐 ${formatWakeBedTime12(m.time, row.groupKey)}</span>`;

function toggleFlowGroup(groupKey){

}
// Meals Eaten has no checkbox of its own anymore — tapping the big % eaten button (or, once logged,
// the stamp showing what was logged) is both how it's recorded AND what marks it done; see

function renderMealMemberRow(row, m){

// One tap on a % option logs it immediately and closes the panel — no separate Save step, since

/* ---------------- Medications: Today's Flow "Log Meds" quick-log ----------------
   Tapping the Medications task opens two big buttons — a green PASS (marks every medication due at
   this resident/time as taken, in one tap) and a red REFUSE (opens a checklist so the caregiver picks
   exactly which of the due medications were actually refused — the rest are passed). This replaces the
   old per-medication Pass/Refuse row-by-row flow, and there's no separate checkbox anymore: logging
   PASS or REFUSE for everyone due here IS what marks this task done (see isFlowRowDone). */
function medFlowBlock(residentId, anchor, meds){
  if(!meds.length) return { button:"", panel:"" };
  const dc = getDC(residentId);
  const recs = meds.map(med=>(dc.medications||{})[medLogKey(med.id, anchor)]);
  const loggedCount = recs.filter(Boolean).length;
  const total = meds.length;
  const allDone = loggedCount === total;
  const anyRefused = recs.some(rec=>rec && rec.status==="refuse");
  const flowKey = residentId+'|'+anchor;
  const expanded = state.expandedMedLogKey === flowKey;
  const summary = allDone ? (anyRefused ? `${recs.filter(r=>r.status==="refuse").length} of ${total} refused` : `All ${total} passed`) : `${loggedCount}/${total} logged`;
  const button = allDone
    ? `<div class="dc-stamp-editable"><span class="dc-stamp" style="color:${anyRefused?'var(--alert-text)':'var(--good-text)'};">💊 ${summary} ✓</span><button class="btn small" onclick="toggleMedQuickLog('${residentId}','${anchor}')">✎ Change</button></div>`
    : `<button class="btn primary task-log-btn" onclick="toggleMedQuickLog('${residentId}','${anchor}')">💊 Log Medications</button>`;
  const panel = expanded ? medQuickLogPanel(residentId, anchor, meds) : "";
  return { button, panel };
}
function toggleMedQuickLog(residentId, anchor){
  const key = residentId+'|'+anchor;
  state.expandedMedLogKey = state.expandedMedLogKey===key ? null : key;
  state.medChoosingRefuse = false;
  state.medRefuseDraft = {};
  scheduleRender();
}
function medQuickLogPanel(residentId, anchor, meds){
  const dc = getDC(residentId);
  if(state.medChoosingRefuse){
    return medRefuseChoicePanel(residentId, anchor, meds);
  }
  return `<div class="card routine-quicklog" onclick="event.stopPropagation()">
    <div class="dc-label">Medications due — writes to Care Log</div>
    <div class="cp-hint" style="margin-bottom:10px;">${meds.map(m=>esc(m.name)+(m.dosage?` (${esc(m.dosage)})`:"")).join(", ")}</div>
    <div class="task-log-options">
      <button type="button" class="task-log-opt pass" onclick="passAllMedications('${residentId}','${anchor}')">✓ PASS<br><span style="font-weight:500; font-size:12px;">All taken</span></button>
      <button type="button" class="task-log-opt refuse" onclick="startRefuseChoice('${residentId}','${anchor}')">✕ REFUSE<br><span style="font-weight:500; font-size:12px;">Choose which</span></button>
    </div>
  </div>`;
}
// Every due medication defaults to Pass — the caregiver only has to actively pick the ones that were
// actually refused, not re-confirm every medication that went fine.
function passAllMedications(residentId, anchor){
  const meds = allDueMedsForAnchor(residentId, anchor);
  meds.forEach(med=>setMedStatus(residentId, med.id, anchor, "pass", ""));
  state.expandedMedLogKey = null;
  scheduleRender();
}
function allDueMedsForAnchor(residentId, anchor){
  const cp = carePlans[residentId];
  return (cp.medications||[]).filter(med=>medAnchorsForMed(med).some(a=>a.anchor===anchor));
}
function startRefuseChoice(residentId, anchor){
  const dc = getDC(residentId);
  const meds = allDueMedsForAnchor(residentId, anchor);
  const draft = {};
  meds.forEach(med=>{
    const rec = (dc.medications||{})[medLogKey(med.id, anchor)];
    draft[med.id] = { refused: !!(rec && rec.status==="refuse"), reason: (rec && rec.reason) || "" };
  });
  state.medChoosingRefuse = true;
  state.medRefuseDraft = draft;
  scheduleRender();
}
function toggleMedRefuseDraft(medId){
  if(!state.medRefuseDraft[medId]) state.medRefuseDraft[medId] = { refused:false, reason:"" };
  state.medRefuseDraft[medId].refused = !state.medRefuseDraft[medId].refused;
  scheduleRender();
}
function medRefuseChoicePanel(residentId, anchor, meds){
  const rows = meds.map(med=>{
    const d = state.medRefuseDraft[med.id] || { refused:false, reason:"" };
    const doseLabel = med.dosage ? ` — ${esc(med.dosage)}` : "";
    return `<div class="med-log-row">
      <div class="med-log-name">${esc(med.name)}${doseLabel}</div>
      <button type="button" class="task-log-opt ${d.refused?'refuse active':''}" style="min-height:40px; flex:none; min-width:120px;" onclick="toggleMedRefuseDraft(${med.id})">${d.refused ? "✕ Refused" : "Mark as refused"}</button>
      ${d.refused ? `<div class="dc-inline-input"><input type="text" id="medrefuse-reason-${med.id}-${anchor}" placeholder="Reason for refusal" value="${esc(d.reason)}" onchange="updateMedRefuseDraftReason(${med.id},'${anchor}')"></div>` : ""}
    </div>`;
  }).join("");
  return `<div class="card routine-quicklog" onclick="event.stopPropagation()">
    <div class="dc-label">Choose which were refused — everyone else here is marked Passed</div>
    ${rows}
    <div class="routine-quicklog-actions">
      <button class="btn primary small" onclick="saveRefuseChoice('${residentId}','${anchor}')">Save to Care Log</button>
      <button class="btn small" onclick="cancelRefuseChoice()">Cancel</button>
    </div>
  </div>`;
}
function updateMedRefuseDraftReason(medId, anchor){
  const el = document.getElementById(`medrefuse-reason-${medId}-${anchor}`);
  if(!el || !state.medRefuseDraft[medId]) return;
  state.medRefuseDraft[medId].reason = el.value;
}
function cancelRefuseChoice(){
  state.medChoosingRefuse = false;
  state.medRefuseDraft = {};
  scheduleRender();
}
function saveRefuseChoice(residentId, anchor){
  const meds = allDueMedsForAnchor(residentId, anchor);
  meds.forEach(med=>{
    const d = state.medRefuseDraft[med.id] || { refused:false, reason:"" };
    if(d.refused){
      const el = document.getElementById(`medrefuse-reason-${med.id}-${anchor}`);
      setMedStatus(residentId, med.id, anchor, "refuse", el ? el.value.trim() : d.reason);
    } else {
      setMedStatus(residentId, med.id, anchor, "pass", "");
    }
  });
  state.expandedMedLogKey = null;
  state.medChoosingRefuse = false;
  state.medRefuseDraft = {};
  scheduleRender();
}
// Standalone Today's Flow row for a resident's "Other"-time medication(s) — same shape as a Scheduled
// Routine row (own checkbox for general completion, plus the Log Meds control for the detailed record).
// No checkbox — the Medications task counts as done once every due medication has a Pass/Refuse

// expandedRoutineId is now a composite "itemId@occTime" string (Sept 29, 2026) — a repeating routine
// puts several occurrence rows on Today's Flow that all share the same underlying item.id, and each
// occurrence needs its own independent expand/collapse state, not one shared toggle for the whole
// routine (see routineOccurrenceTimes/todaysFlowRows).
function toggleRoutineQuickLog(itemId, occTime){
  const key = itemId+'@'+occTime;
  state.expandedRoutineId = state.expandedRoutineId===key ? null : key;
  scheduleRender();
}
// Reads/writes routineOccurrenceLogs (this exact occurrence's own reading) — entirely separate from
// Daily Care Log's own Section 4/5 manual-entry fields, which stay untouched by this form. Daily Care
// Log instead shows every occurrence's reading as a read-only imported list — see
// routineOccurrenceLogsForResident() and renderDailyCareDetail().
function routineQuickLogForm(r, item, occTime){
  const existingLog = (routineOccurrenceLogs[TODAY_ISO] || {})[item.id]?.[occTime];
  const existing = (existingLog && existingLog.value) || {};
  if(item.type==="vital"){
    const vt = VITAL_TYPES.find(v=>v.key===item.vitalType) || VITAL_TYPES[0];
    let fields;
    if(vt.key==="bp"){
      fields = `<input type="text" id="rq-val1-${item.id}" placeholder="Sys" value="${esc(existing.sys)}" style="width:70px;"> / <input type="text" id="rq-val2-${item.id}" placeholder="Dia" value="${esc(existing.dia)}" style="width:70px;">`;
    } else if(vt.key==="pain"){
      fields = `<input type="text" id="rq-val1-${item.id}" placeholder="Rating /10" value="${esc(existing.rating)}" style="width:90px;"> <input type="text" id="rq-val2-${item.id}" placeholder="Location" value="${esc(existing.location)}" style="width:110px;"> <input type="text" id="rq-val3-${item.id}" placeholder="Description" value="${esc(existing.description)}" style="width:140px;">`;
    } else {
      fields = `<input type="text" id="rq-val1-${item.id}" placeholder="Value" value="${esc(existing.value)}" style="width:110px;">`;
    }
    return `<div class="card routine-quicklog">
      <div class="dc-label">${vt.label} at ${formatTime12(occTime)} — logged to Care Log's Vitals list</div>
      <div class="dc-inline-input">${fields}</div>
      <div class="routine-quicklog-actions">
        <button class="btn primary small" onclick="quickLogRoutineVital('${item.id}','${r.id}','${vt.key}','${occTime}')">Save reading</button>
        <button class="btn small" onclick="toggleRoutineQuickLog('${item.id}','${occTime}')">Cancel</button>
      </div>
    </div>`;
  } else if(item.type==="prn"){
    return `<div class="card routine-quicklog">
      <div class="dc-label">PRN medication given at ${formatTime12(occTime)} — logged to Care Log's PRN list</div>
      <div class="dc-inline-input"><input type="text" id="rq-prnReason-${item.id}" placeholder="Reason for PRN" value="${esc(existing.reason)}"></div>
      <div class="dc-inline-input"><input type="text" id="rq-prnResponse-${item.id}" placeholder="Resident response/effect" value="${esc(existing.response)}"></div>
      <div class="routine-quicklog-actions">
        <button class="btn primary small" onclick="quickLogRoutinePRN('${item.id}','${r.id}','${occTime}')">Save reading</button>
        <button class="btn small" onclick="toggleRoutineQuickLog('${item.id}','${occTime}')">Cancel</button>
      </div>
    </div>`;
  }
  return "";
}
// Records one occurrence's reading — into the in-memory today's-log immediately (so Today's Flow and
// Daily Care Log's imported list both reflect it right away) and, on a live Knollview-bound device, an
// immediate upsert to routine_occurrence_logs (not the usual debounced whole-house sync — same "a
// real record has to land before the UI can trust it's saved" reasoning as Food/Resident photo uploads).
function saveRoutineOccurrenceLog(residentId, item, occTime, vitalType, value){
  const who = currentUser();
  if(!routineOccurrenceLogs[TODAY_ISO]) routineOccurrenceLogs[TODAY_ISO] = {};
  if(!routineOccurrenceLogs[TODAY_ISO][item.id]) routineOccurrenceLogs[TODAY_ISO][item.id] = {};
  routineOccurrenceLogs[TODAY_ISO][item.id][occTime] = {
    vitalType: vitalType || null, value: value || {},
    loggedById: who ? who.id : null, loggedByName: who ? who.name : "Staff",
    loggedAt: new Date().toISOString()
  };
  const r = residents.find(x=>x.id===residentId);
  if(isDeviceSupabaseLive() && supabaseSession && r && r.house === state.house){
    sbClient.from("routine_occurrence_logs")
      .upsert(routineOccurrenceLogRowForSupabase(residentId, r.house, TODAY_ISO, item.id, occTime, vitalType, value), { onConflict: "routine_id,log_date,occurrence_time" })
      .then(({error})=>{ if(error) console.error("Supabase routine occurrence log sync failed:", error); });
  }
}
// Every occurrence log for one resident today, time-sorted — feeds both Today's Flow's per-occurrence
// "already logged" state (isFlowRowDone/renderFlowRow) and Daily Care Log's imported Vitals/PRN lists.
function routineOccurrenceLogsForResident(residentId, kind){
  const dayLog = routineOccurrenceLogs[TODAY_ISO] || {};
  const out = [];
  Object.keys(dayLog).forEach(routineId=>{
    if(findRoutineItemResidentId(routineId) !== residentId) return;
    const item = findRoutineItem(routineId);
    if(kind && (!item || item.type !== kind)) return;
    Object.keys(dayLog[routineId]).forEach(occTime=>{
      out.push({ routineId, occTime, item, ...dayLog[routineId][occTime] });
    });
  });
  out.sort((a,b)=>a.occTime.localeCompare(b.occTime));
  return out;
}
// Read-only "logged from Scheduled Routines today" list for Daily Care Log's PRN/Vitals sections —
// every occurrence's own reading, chronologically, decoupled from dc.prn/dc.vitals' single manual-entry
// fields (per Johnna's sign-off: "Daily Care Log imports all scheduled vitals/prns for that day").
function routineImportedListHtml(entries, kind){
  if(!entries.length) return "";
  const rows = entries.map(e=>{
    let text;
    if(kind==="prn"){
      text = `PRN given${e.value?.reason ? ` — Reason: ${esc(e.value.reason)}` : ""}${e.value?.response ? ` — Response: ${esc(e.value.response)}` : ""}`;
    } else {
      const vt = VITAL_TYPES.find(v=>v.key===e.vitalType) || VITAL_TYPES[0];
      const val = vitalValueDisplay(vt, e.value);
      text = `${vt.label}${val ? `: ${val}` : ""}`;
    }
    return `<div class="visitor-row"><div><div class="visitor-name">${formatTime12(e.occTime)} — ${text}</div></div><div class="visitor-note">${esc(e.loggedByName||"Staff")}</div></div>`;
  }).join("");
  return `<div class="routine-imported-list" style="margin-top:10px;">
    <div class="dc-label" style="margin-bottom:4px;">Logged from Scheduled Routines today</div>
    ${rows}
  </div>`;
}
function quickLogRoutineVital(itemId, residentId, vitalKey, occTime){
  const v1 = document.getElementById('rq-val1-'+itemId).value;
  let value;
  if(vitalKey==="bp"){
    value = { sys:v1, dia:document.getElementById('rq-val2-'+itemId).value };
  } else if(vitalKey==="pain"){
    value = { rating:v1, location:document.getElementById('rq-val2-'+itemId).value, description:document.getElementById('rq-val3-'+itemId).value };
  } else {
    value = { value:v1 };
  }
  const item = findRoutineItem(itemId);
  if(item) saveRoutineOccurrenceLog(residentId, item, occTime, vitalKey, value);
  state.expandedRoutineId = null;
  scheduleRender();
}
function quickLogRoutinePRN(itemId, residentId, occTime){
  const value = { reason: document.getElementById('rq-prnReason-'+itemId).value, response: document.getElementById('rq-prnResponse-'+itemId).value };
  const item = findRoutineItem(itemId);
  if(item) saveRoutineOccurrenceLog(residentId, item, occTime, null, value);
  state.expandedRoutineId = null;
  scheduleRender();
}

function renderResidents(){
  const list = houseResidents();
  const canAdd = moduleEdit('residents');
  document.getElementById("content").innerHTML = `
  <div class="section">

function age(dob){
  const d=new Date(dob), t=nowRef();
  let a=t.getFullYear()-d.getFullYear();
  if(t.getMonth()<d.getMonth() || (t.getMonth()===d.getMonth() && t.getDate()<d.getDate())) a--;
  return a;
}

/* ---------------- Generic per-section edit-lock / save / print (resident profile) ----------------
   Every fillable section across the resident profile (Care Plan's individual fields, Hospice/Home
   Health, Contacts, Overview, and the list-style tabs like Medications/Routines/Visitors) follows one
   shared pattern: an empty section shows a "+ Complete X" prompt; once something's on file, it locks
   to a read-only view with its own small Edit/Save/Print controls, and changes made after tapping Edit
   only take effect once Save is tapped. This is a deliberate change from the old always-autosaving
   Care Plan, and replaces the single whole-tab edit toggle and the old whole-profile-header
   Save/Edit/Print buttons. */
function isSectionEditing(residentId, sectionKey){
  return !!(state.sectionEdit[residentId] && state.sectionEdit[residentId][sectionKey]);
}
// A section opens to House Manager/Leadership always, and additionally to a Caregiver for exactly the
// three Batch 9 propose-able sections (Overview, Primary contact, Emergency contacts) — Care Plan,
// Medications, and Physician/Hospice/Home Health stay fully locked to House Manager/Leadership.
function canEditSection(sectionKey){
  if(moduleEdit('residents')) return true;
  return CAREGIVER_PROPOSABLE_SECTIONS.has(sectionKey) && isCaregiver();
}
// Reads the live value of a propose-able section, in whatever shape that section's data actually takes,
// so it can be snapshotted before a Caregiver's edit and restored if that edit is later denied.
function residentSectionCurrentValue(residentId, sectionKey){
  if(sectionKey === "overview"){
    const r = residents.find(x=>x.id===residentId);
    return r ? { room:r.room, dob:r.dob, admitted:r.admitted, note:r.note } : null;
  }
  if(sectionKey === "primaryContact"){
    const c = contacts[residentId] || defaultContacts();
    return JSON.parse(JSON.stringify(c.primary));
  }
  if(sectionKey === "emergencyContacts"){
    const c = contacts[residentId] || defaultContacts();
    return JSON.parse(JSON.stringify(c.emergency||[]));
  }
  return null;
}
function residentSectionApplyValue(residentId, sectionKey, value){
  if(value == null) return;
  if(sectionKey === "overview"){
    const r = residents.find(x=>x.id===residentId);
    if(!r) return;
    r.room = value.room; r.dob = value.dob; r.admitted = value.admitted; r.note = value.note;
  } else if(sectionKey === "primaryContact"){
    if(!contacts[residentId]) contacts[residentId] = defaultContacts();
    contacts[residentId].primary = JSON.parse(JSON.stringify(value));
  } else if(sectionKey === "emergencyContacts"){
    if(!contacts[residentId]) contacts[residentId] = defaultContacts();
    contacts[residentId].emergency = JSON.parse(JSON.stringify(value));
  }
}
function openSectionEdit(residentId, sectionKey){
  if(!canEditSection(sectionKey)) return;
  if(!state.sectionEdit[residentId]) state.sectionEdit[residentId] = {};
  state.sectionEdit[residentId][sectionKey] = true;
  // Snapshot the pre-edit value up front (fields auto-commit on every keystroke, so by Save time the
  // live data may already be overwritten) — unless there's already a pending proposal on this section,
  // in which case keep ITS previousValue so a second caregiver edit before a decision doesn't lose the
  // true original.
  if(CAREGIVER_PROPOSABLE_SECTIONS.has(sectionKey)){
    if(!residentSectionSnapshotDraft[residentId]) residentSectionSnapshotDraft[residentId] = {};
    const existing = residentSectionApprovals[residentId] && residentSectionApprovals[residentId][sectionKey];
    residentSectionSnapshotDraft[residentId][sectionKey] = (existing && existing.status === "pending")
      ? existing.previousValue
      : residentSectionCurrentValue(residentId, sectionKey);
  }
  scheduleRender();
}
let sectionSaveFlashTimer = {};
function saveSectionEdit(residentId, sectionKey){
  if(state.sectionEdit[residentId]) state.sectionEdit[residentId][sectionKey] = false;
  if(CAREGIVER_PROPOSABLE_SECTIONS.has(sectionKey)){
    if(moduleEdit('residents')){
      // A House Manager/Leadership save is authoritative — clears any pending proposal on this section.
      if(residentSectionApprovals[residentId]) delete residentSectionApprovals[residentId][sectionKey];
    } else if(isCaregiver()){
      const who = currentUser();
      if(!residentSectionApprovals[residentId]) residentSectionApprovals[residentId] = {};
      const snapshot = (residentSectionSnapshotDraft[residentId] || {})[sectionKey];
      // Reuse the same id while a proposal on this section is still open (this is just a further edit
      // to it, not a new history row); mint a fresh one otherwise — same "reuse while pending" pattern
      // as master_menus/meal notes/breakfast plans.
      const existing = residentSectionApprovals[residentId][sectionKey];
      const id = (existing && existing.status === "pending" && existing.id)
        ? existing.id
        : (isDeviceSupabaseLive() && crypto.randomUUID ? crypto.randomUUID() : sectionApprovalIdSeq++);
      residentSectionApprovals[residentId][sectionKey] = {
        id, status: "pending", addedBy: who ? who.name : "", addedById: who ? who.id : null, addedAt: "Just now",
        previousValue: snapshot, decidedBy: null, decidedById: null, decidedAt: null
      };
    }
  }
  writeSnapshotNow();
  if(!state.sectionSaveFlash[residentId]) state.sectionSaveFlash[residentId] = {};
  state.sectionSaveFlash[residentId][sectionKey] = true;
  scheduleRender();
  const flashKey = residentId+"|"+sectionKey;
  if(sectionSaveFlashTimer[flashKey]) clearTimeout(sectionSaveFlashTimer[flashKey]);
  sectionSaveFlashTimer[flashKey] = setTimeout(()=>{
    if(state.sectionSaveFlash[residentId]) state.sectionSaveFlash[residentId][sectionKey] = false;
    scheduleRender();
  }, 1600);
}
// Approve keeps the value exactly as the Caregiver entered it — only the Pending tag clears. Deny
// reverts the live section back to the previousValue snapshotted when the Caregiver opened Edit. Both
// keep the approval record itself (status flips to approved/denied) as a permanent history entry rather
// than deleting it, per item 53.
function approveResidentSection(residentId, sectionKey){
  if(!moduleEdit('residents')) return;
  const a = residentSectionApprovals[residentId] && residentSectionApprovals[residentId][sectionKey];
  if(!a) return;
  a.status = "approved";
  const who = currentUser();
  a.decidedBy = who ? who.name : "";
  a.decidedById = who ? who.id : null;
  a.decidedAt = "Just now";
  scheduleRender();
}
function denyResidentSection(residentId, sectionKey){
  if(!moduleEdit('residents')) return;
  const a = residentSectionApprovals[residentId] && residentSectionApprovals[residentId][sectionKey];
  if(!a) return;
  residentSectionApplyValue(residentId, sectionKey, a.previousValue);
  a.status = "denied";
  const who = currentUser();
  a.decidedBy = who ? who.name : "";
  a.decidedById = who ? who.id : null;
  a.decidedAt = "Just now";
  scheduleRender();
}
// Populated fresh on every render() by profileSection() below, so a section's own Print button can
// print exactly what's on screen without re-deriving/escaping HTML through an onclick attribute.
let sectionPrintRegistry = {};
function printSectionSheet(residentId, label, bodyHtml){
  const r = residents.find(x=>x.id===residentId);
  if(!r) return;

    <div class="p-section-body">${bodyHtml}</div>

}
function printRegisteredSection(residentId, sectionKey){
  const entry = sectionPrintRegistry[residentId+"|"+sectionKey];
  if(!entry) return;
  printSectionSheet(residentId, entry.label, entry.html);
}
// Care Plan intentionally prints as ONE sheet for the whole tab (see renderCarePlanBody) rather than
// through the per-field sectionPrintRegistry, so this builds the Care Plan's printable summary directly
// from carePlans — the same field-by-field text used in printProfile()'s Care Plan section.
