// Single source of truth for a medication's Pass/Refuse status at one anchor time — called from both
// the Today's Flow "Log Meds" quick-log panel and the full Daily Care Log's Medications section, so
// either one logging a dose immediately shows up in the other (same dc.medications record).
// Correction, not silent overwrite (this is what makes the log trustworthy as an eventual official
// MAR, not just a checkbox): the first time a dose is logged, it's just recorded normally. Logging it
// again with a DIFFERENT status or reason — a genuine correction, not just re-tapping the same
// answer — pushes the old value onto that entry's own `corrections` history before the new value takes
// its place, the same "who/when actually changed this" principle already used for Calendar edits
// elsewhere in this app. Nothing is ever silently replaced with no trace of what it used to say.
function setMedStatus(residentId, medId, anchor, status, reason){
  const dc = getDC(residentId);
  if(!dc.medications) dc.medications = {};
  const key = medLogKey(medId, anchor);
  const existing = dc.medications[key];
  const who = currentUser();
  const isCorrection = existing && (existing.status !== status || (status === "refuse" && (existing.reason||"") !== (reason||"")));
  const corrections = existing ? (existing.corrections || []) : [];
  if(isCorrection){
    corrections.push({ status: existing.status, reason: existing.reason||"", by: existing.by, initials: existing.initials, at: existing.at });
  }
  dc.medications[key] = { status, reason: reason||"", by: who.name, initials: who.initials, at: "Just now", corrections };
  touchSection(dc, "medications", currentUser());
}

// Medications are a variable-length repeating list (unlike the fixed CP_TEXT_FIELDS map above), so every

// syncCPFormToState, generalized to "however many medication rows currently exist".
function syncMedFormToState(residentId){
  const cp = carePlans[residentId];

function newMedId(residentId){
  const cp = carePlans[residentId];
  return (cp.medications||[]).reduce((max,m)=>Math.max(max, m.id||0), 0) + 1;
}
function addMedication(residentId){
  syncMedFormToState(residentId);

// Usable for this resident immediately either way (it's already pushed into cp.medications above) —
// this only controls whether the name becomes a quick-pick suggestion for everyone else. A name
// that's new (case-insensitively) starts pending; if it's already on the list in any status, there's
// nothing to add.
function registerCommonMedication(name){
  const exists = commonMedications.some(m=>m.name.toLowerCase()===name.toLowerCase());
  if(exists) return;
  const who = currentUser();
  commonMedications.push({ id:commonMedIdSeq++, name, status:"pending", addedBy: who?who.name:"", addedAt:"Just now" });
}
function approvedCommonMedicationNames(){
  return commonMedications.filter(m=>m.status==="approved").map(m=>m.name);
}
function pendingCommonMedications(){
  return commonMedications.filter(m=>m.status==="pending");
}
function approveCommonMedication(id){
  if(!moduleEdit('residents')) return;
  const m = commonMedications.find(x=>x.id===id);
  if(!m) return;
  m.status = "approved";
  m.approvedBy = currentUser().name;
  m.decidedBy = currentUser().name;
  m.decidedAt = "Just now";
  scheduleRender();
}
// Batch 9: denying now keeps the record with a Denied status (item 53) instead of erasing it, so
// Leadership's approval history (renderApprovalsHistoryForLeadership) shows what got turned down, not
// just what's pending or already approved.
function denyCommonMedication(id){
  if(!moduleEdit('residents')) return;
  const m = commonMedications.find(x=>x.id===id);
  if(!m) return;
  m.status = "denied";
  m.decidedBy = currentUser().name;
  m.decidedAt = "Just now";
  scheduleRender();
}
// Same "usable now, proposed for the shared list" pattern as registerCommonMedication above — a
// diagnosis a caregiver types that isn't already in DIAGNOSIS_TAGS gets queued here rather than
// silently added to the master list, so Leadership reviews it once before it becomes a shared option.
let diagnosisIdSeq = 1;
let pendingDiagnoses = []; // { id, name, addedBy, addedAt }
function registerPendingDiagnosis(name){
  if(!name) return;
  if(DIAGNOSIS_TAGS.some(d=>d.toLowerCase()===name.toLowerCase())) return;
  if(pendingDiagnoses.some(d=>d.name.toLowerCase()===name.toLowerCase() && d.status!=="denied")) return;
  const who = currentUser();
  pendingDiagnoses.push({ id:diagnosisIdSeq++, name, addedBy: who?who.name:"", addedAt:"Just now", status:"pending" });
}
function pendingDiagnosesList(){ return pendingDiagnoses.filter(d=>d.status==="pending"); }
function approveDiagnosis(id){
  if(!moduleEdit('residents')) return;
  const d = pendingDiagnoses.find(x=>x.id===id);
  if(!d) return;
  if(!DIAGNOSIS_TAGS.some(t=>t.toLowerCase()===d.name.toLowerCase())) DIAGNOSIS_TAGS.push(d.name);
  d.status = "approved";
  d.decidedBy = currentUser().name;
  d.decidedAt = "Just now";
  scheduleRender();
}
// Batch 9: denying now keeps the record with a Denied status (item 53) instead of erasing it — see
// approveCommonMedication/denyCommonMedication above for the same change applied to medication names.
function denyDiagnosis(id){
  if(!moduleEdit('residents')) return;
  const d = pendingDiagnoses.find(x=>x.id===id);
  if(!d) return;
  d.status = "denied";

  d.decidedAt = "Just now";
  scheduleRender();
}

// Required-before-review, per the rework spec: Section 1 (all except witness name(s)), Section 2 (at

// (everything except Vitals and Neuro Check, which are optional/conditional by design), Section 5 (at
// least one intervention, or Other with its text filled), Section 7 (at least one contributing factor, or
// Other with its text filled), Section 9 witness name. A judgment call, flagged for Johnna: the staff
// signature is also required here (submitting an unsigned report for review didn't seem like it should be
// possible), and the general Section 4 "Other findings" free-text field — distinct from Neuro Check's own
// optional findings box — was left optional, treated as supplementary notes rather than one of the
// mandatory assessment fields.
function irValidateForSubmit(rep){
  const missing = [];
  if(!rep.info.incidentDate) missing.push("Date of incident");
  if(!rep.info.incidentTime) missing.push("Time of incident");
  if(!rep.info.location) missing.push("Exact location");
  if(!rep.info.witnessed) missing.push("Witnessed? (yes/no)");
  if(!rep.info.discoveredBy) missing.push("Person discovering incident");
  if(!rep.types.length) missing.push("Type of incident (check at least one)");
  if(rep.types.includes("Other") && !rep.typeOther.trim()) missing.push("Type of incident — describe \"Other\"");
  if(rep.description.trim().length < 50) missing.push("Objective description (minimum 50 characters)");
  if(!rep.assessment.loc) missing.push("Level of consciousness");
  if(!rep.assessment.mentalStatus) missing.push("Mental status");
  if(!rep.assessment.pain) missing.push("Pain?");
  if(rep.assessment.pain==="yes" && !rep.assessment.painLocation.trim()) missing.push("Pain location");
  if(rep.assessment.pain==="yes" && !rep.assessment.painRating.trim()) missing.push("Pain rating");
  if(!rep.assessment.visibleInjury) missing.push("Visible injury?");
  if(!rep.interventions.length) missing.push("Immediate interventions (check at least one)");
  if(rep.interventions.includes("Other") && !rep.interventionsOther.trim()) missing.push("Interventions — describe \"Other\"");
  if(!rep.contributing.length) missing.push("Contributing/environmental factors (check at least one)");
  if(rep.contributing.includes("Other") && !rep.contributingOther.trim()) missing.push("Contributing factors — describe \"Other\"");
  if(!rep.statements.witnessName.trim()) missing.push("Witness name (Section 9)");
  if(!rep.statements.staffSigned) missing.push("Staff signature (Section 9)");
  return missing;
}
function irSubmitForReview(reportId){
  syncIRFormToState(reportId);
  const rep = findIRById(reportId);
  if(!rep) return;
  const missing = irValidateForSubmit(rep);
  if(missing.length){
    state.incidentSubmitErrors[reportId] = missing;
    scheduleRender();
    return;
  }
  delete state.incidentSubmitErrors[reportId];
  rep.status = "pending_manager_review";
  const who = currentUser();
  rep.statements.managerReview.status = "pending";
  rep.statements.managerReview.submittedBy = who.name;
  rep.statements.managerReview.submittedById = who.id;
  rep.statements.managerReview.submittedAt = `${TODAY_SHORT} · Just now`;
  rep.statements.managerReview.decidedBy = "";
  rep.statements.managerReview.decidedById = null;
  rep.statements.managerReview.decidedAt = "";
  scheduleRender();
}

/* ---------------- Food photo quality control (cross-house) ---------------- */
const MEAL_CATS = ["salad","lunch","dessert"];
const CAT_META = { salad:{label:"Salad", icon:"🥗"}, lunch:{label:"Lunch", icon:"🍽️"}, dessert:{label:"Dessert", icon:"🍰"} };

// Starts empty for the live pilot — real photos accumulate under real dates as they're uploaded.
// Browsing is bounded by shiftPhotoDate below (never past real "today"; back in time is unbounded)
// rather than a fixed PHOTO_DATES allow-list, so this keeps working indefinitely.
let foodPhotos = {};

// A house can upload/replace its own salad/lunch/dessert photos freely — nothing here is visible to
// any other house yet. Only once all three are uploaded and the house taps "Confirm Pictures" does
// foodPhotoConfirmed[date][houseId] get set (see confirmFoodPhotosNow below), which both locks that
// house out of replacing them and is the ONLY thing that makes them visible to every other house (see
// the `revealPhoto` check in renderFoodPhotos). Leadership can reverse a confirm via unlockFoodPhotosNow
// if a house needs to fix a photo after posting (agreed with Johnna, Sept 2026) — that re-opens
// uploading for that house/date and hides the photos from other houses again until re-confirmed.
let foodPhotoConfirmed = {};

function photoLockKey(date, houseId){ return date + "::" + houseId; }
function isPhotosConfirmed(date, houseId){ return !!((foodPhotoConfirmed[date]||{})[houseId]); }
function photoConfirmedInfo(date, houseId){ return (foodPhotoConfirmed[date]||{})[houseId] || null; }
// Status for a house that hasn't confirmed yet — deliberately blind to draft upload progress so
// browsing houses never learn a photo exists before it's officially posted.
function unconfirmedPhotoStatus(date){
  const deadline = new Date(date+"T17:00:00");
  return nowRef() > deadline ? "missing" : "pending";
}
function shiftPhotoDate(delta){
  const next = addDaysIso(state.photoDate, delta);
  if(next > todayIso()) return; // never browse into the future
  state.photoDate = next;
  render();
}
// Jump straight to any previous food day, same idea as the ← → steppers but without having to click
// through one day at a time — e.g. checking last Tuesday's photos. Same future-date guard as above;
// an invalid/empty value from the date picker is just ignored rather than clearing the current date.
function setPhotoDate(value){
  if(!value) return;
  if(value > todayIso()) return; // never browse into the future
  state.photoDate = value;
  render();
}
function handlePhotoUpload(evt, houseId, cat){
  if(isPhotosConfirmed(state.photoDate, houseId)){ evt.target.value = ""; return; } // locked — must be unlocked first
  const file = evt.target.files[0];
  if(!file) return;
  const date = state.photoDate; // captured now — an in-flight upload must not follow a later date change
  const reader = new FileReader();
  reader.onload = function(e){
    if(!foodPhotos[date]) foodPhotos[date] = {};
    if(!foodPhotos[date][houseId]) foodPhotos[date][houseId] = {};
    foodPhotos[date][houseId][cat] = { by: currentUser().name, at:"Just now", img: e.target.result };
    render();
  };
  reader.readAsDataURL(file);
  // Real upload to Supabase Storage + a food_photos row — own house only, matching both RLS and
  // canUploadHere's own h.id===state.house gate above.
  if(supabaseSession && houseId === state.house) uploadFoodPhotoToSupabase(houseId, date, cat, file);
}
function requestConfirmFoodPhotos(houseId){
  if(houseId !== state.house) return;
  const dayData = (foodPhotos[state.photoDate]||{})[houseId] || {};
  if(!MEAL_CATS.every(c=>dayData[c])) return; // all three required before confirming, per Johnna
  state.foodPhotoConfirmPending = photoLockKey(state.photoDate, houseId);
  scheduleRender();
}
function cancelConfirmFoodPhotos(){
  state.foodPhotoConfirmPending = null;
  scheduleRender();
}
function confirmFoodPhotosNow(houseId){
  state.foodPhotoConfirmPending = null;
  if(houseId !== state.house) { scheduleRender(); return; }
  const dayData = (foodPhotos[state.photoDate]||{})[houseId] || {};
  if(!MEAL_CATS.every(c=>dayData[c])) { scheduleRender(); return; }
  const date = state.photoDate;
  if(!foodPhotoConfirmed[date]) foodPhotoConfirmed[date] = {};
  foodPhotoConfirmed[date][houseId] = { by: currentUser().name, at:"Just now" };
  if(supabaseSession) confirmFoodPhotosToSupabase(houseId, date);
  scheduleRender();
}
function requestUnlockFoodPhotos(houseId){
  if(!isSystemAdmin()) return;
  state.foodPhotoUnlockPending = photoLockKey(state.photoDate, houseId);
  scheduleRender();
}
function cancelUnlockFoodPhotos(){
  state.foodPhotoUnlockPending = null;
  scheduleRender();
}
function unlockFoodPhotosNow(houseId){
  state.foodPhotoUnlockPending = null;
  if(!isSystemAdmin()) { scheduleRender(); return; }
  const date = state.photoDate;
  if(foodPhotoConfirmed[date]) delete foodPhotoConfirmed[date][houseId];
  if(supabaseSession) unlockFoodPhotosToSupabase(houseId, date);
  scheduleRender();
}

// Renders one house's photo card. The signed-in/toggled house (state.house) is the only one that can
// upload here, so it's visually called out (house-photo-card--mine) and is the only card where an
// unconfirmed slot carries "Due by 5 PM"/"Missing" pressure — every other house is just a read-only
// feed of what's been posted, so an unconfirmed slot there stays blank rather than nagging about a
// deadline that isn't the viewer's to hit (Oct 2026, per Johnna).
function renderHousePhotoCard(h){
  const dayData = (foodPhotos[state.photoDate]||{})[h.id] || {};
  const canUploadHere = h.id === state.house;
  const confirmed = isPhotosConfirmed(state.photoDate, h.id);
  const confirmInfo = photoConfirmedInfo(state.photoDate, h.id);
  const key = photoLockKey(state.photoDate, h.id);
  const allUploaded = MEAL_CATS.every(c=>dayData[c]);

  const slots = MEAL_CATS.map(c=>{
    const entry = dayData[c];
    const meta = CAT_META[c];
    // Cross-house viewers never see a draft — only the owning house sees its own uploads pre-confirm.
    // Once confirmed, the photo is locked in and visible to everyone (the whole point of Confirm Pictures).
    const revealPhoto = confirmed || canUploadHere;
    const media = (revealPhoto && entry && entry.img)
      ? `<img class="photo-thumb" src="${entry.img}" alt="${meta.label} photo" onclick="openLightbox(this.src)">`
      : `<div class="photo-placeholder">${meta.icon}</div>`;

    let statusBadge = "", attribution = "";
    if(confirmed){
      statusBadge = badge("good","Posted");
      attribution = entry ? `<div style="font-size:12px; color:var(--text-faint);">${entry.by} · ${entry.at}</div>` : "";
    } else if(canUploadHere && entry){
      statusBadge = badge("neutral","Uploaded — not posted yet");
      attribution = `<div style="font-size:12px; color:var(--text-faint);">${entry.by} · ${entry.at}</div>`;
    } else if(canUploadHere){
      // Only the house actually uploading today carries the deadline messaging.
      const s = unconfirmedPhotoStatus(state.photoDate);
      statusBadge = s==="missing" ? badge("alert","Missing") : badge("fall","Due by 5 PM");
    }
    // else: another house, not yet posted — no badge, just the placeholder, until it's posted.

    const inputId = `photo-${h.id}-${c}-${state.photoDate}`;
    const uploadControl = (canUploadHere && !confirmed) ? `
      <label class="btn small" for="${inputId}">${entry?"Replace":"Upload"}</label>
      <input type="file" accept="image/*" id="${inputId}" style="display:none" onchange="handlePhotoUpload(event,'${h.id}','${c}')">` : "";
    return `<div class="photo-slot">
      ${media}
      <div style="font-weight:700; font-size:13px;">${meta.label}</div>
      ${statusBadge}
      ${attribution}
      ${uploadControl}
    </div>`;
  }).join("");

  let lockAction = "";
  if(confirmed){
    const unlockControl = !isSystemAdmin() ? "" : (state.foodPhotoUnlockPending === key
      ? `<span class="hint" style="font-weight:600;">Unlock so this house can replace today's photos?</span>
         <button class="btn primary small" onclick="unlockFoodPhotosNow('${h.id}')">Unlock</button>
         <button class="btn small" onclick="cancelUnlockFoodPhotos()">Cancel</button>`
      : `<button class="btn small" onclick="requestUnlockFoodPhotos('${h.id}')">Unlock</button>`);
    lockAction = `<div class="photo-lock-row">
      ${badge("good", `🔒 Locked${confirmInfo ? ` · confirmed by ${confirmInfo.by} · ${confirmInfo.at}` : ''}`)}
      ${unlockControl}
    </div>`;
  } else if(canUploadHere){
    lockAction = state.foodPhotoConfirmPending === key
      ? `<div class="photo-lock-row">
           <span class="hint" style="font-weight:600;">Lock in today's photos for every house to see?</span>
           <button class="btn primary small" onclick="confirmFoodPhotosNow('${h.id}')">Confirm Pictures</button>
           <button class="btn small" onclick="cancelConfirmFoodPhotos()">Cancel</button>
         </div>`
      : allUploaded
        ? `<div class="photo-lock-row"><button class="btn primary small" onclick="requestConfirmFoodPhotos('${h.id}')">🔒 Confirm Pictures</button></div>`
        : `<div class="photo-lock-row"><span class="hint">Upload all three to confirm and post them</span></div>`;
  }

  return `<div class="card house-photo-card${canUploadHere ? ' house-photo-card--mine' : ''}">
    <div class="house-photo-head">
      <h3 style="font-size:14px;">${h.name}${canUploadHere ? ' <span class="shift-tag" style="margin-left:6px;">Your house — uploading</span>' : ''}</h3>

      ${lockAction}
    </div>
    <div class="photo-grid">${slots}</div>
  </div>`;
}
function renderFoodPhotos(){
  const dateLabel = new Date(state.photoDate+"T12:00:00").toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});

  // The signed-in/toggled house always leads, called out from the rest, which are just a read-only
  // feed of everyone else's posted photos — no separate summary strip needed on top of that.
  const mine = houses.find(h=>h.id===state.house);
  const others = houses.filter(h=>h.id!==state.house);
  const mineCard = mine ? renderHousePhotoCard(mine) : "";
  const otherCards = others.map(renderHousePhotoCard).join("");

  document.getElementById("content").innerHTML = `
  <div class="section">
    <div class="section-head">
      <h2>Food Photo Quality Control</h2>
      <div class="date-nav">
        <button class="btn small" onclick="shiftPhotoDate(-1)">←</button>
        <span style="font-weight:700; font-size:13px;">${dateLabel}${state.photoDate===todayIso() ? " (Today)" : ""}</span>
        <button class="btn small" onclick="shiftPhotoDate(1)" ${state.photoDate>=todayIso()?'disabled':''}>→</button>
        <input type="date" class="btn small" style="padding:5px 8px;" value="${state.photoDate}" max="${todayIso()}" onchange="setPhotoDate(this.value)" aria-label="Jump to a date">
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:14px;">
      ${mineCard}
      ${others.length ? `<div class="house-photo-feed-label">Other Houses</div>` : ""}
      ${otherCards}
    </div>
  </div>`;
}

// A staff member can now be assigned to more than one house (float staff who cover shifts at more than
// one location) — matches the many-to-many staff-to-house assignment the architecture plan called for
// from the start. `staff.houses` (an array) is the current shape; a still-singular `staff.house` from
// before this existed is read as a one-item list rather than migrated in place, so nothing breaks for a
// staff record that hasn't been touched since. Every house id returned is checked against the live
// `houses` list, so a since-removed house never lingers here. Falls back to the first real house if a
// staff record somehow has none on file at all, so nobody is ever left with nowhere to land.
function staffHouseIds(staff){
  if(!staff) return [];
  if(Array.isArray(staff.houses)){
    const valid = staff.houses.filter(id=>houses.some(h=>h.id===id));
    if(valid.length) return valid;
  } else if(staff.house && houses.some(h=>h.id===staff.house)){
    return [staff.house];
  }
  return houses.length ? [houses[0].id] : [];
}

// only from the password screen's "forgot password" link, never shown to a first-time account. ----
let remoteLoginOpen = false;
let remoteLoginStage = "email"; // "email" | "password" | "linkSent" | "code" | "setPassword"
let remoteLoginEmail = "";
let remoteLoginCode = "";
let remoteLoginPendingSession = null; // session from a code sign-in or a clicked setup/recovery link, held until a password is set
let remoteLoginError = null;
let remoteLoginBusy = false;

function openRemoteLogin(){
  remoteLoginOpen = true; remoteLoginStage = "email"; remoteLoginEmail = ""; remoteLoginCode = "";
  remoteLoginPendingSession = null;
  remoteLoginError = null; remoteLoginBusy = false;
  render();
}
function closeRemoteLogin(){ remoteLoginOpen = false; render(); }

function backToEmailStage(){
  remoteLoginStage = "email";
  remoteLoginError = null;
  render();
}
function usePasswordInstead(){
  remoteLoginStage = "password";
  remoteLoginError = null;
  render();
}

// First stage: just the email. Looks up whether this account has ever set a password (the RPC
// itself never reveals *why* — a nonexistent email and a genuine not-yet-set-up account both just
// come back false) and branches to the right next screen.
async function submitRemoteLoginEmail(){
  const email = (document.getElementById("remoteLoginEmail")?.value || "").trim().toLowerCase();
  if(!email){ remoteLoginError = "Enter your email."; render(); return; }
  remoteLoginEmail = email;
  remoteLoginBusy = true; remoteLoginError = null; render();
  try{
    const { data, error } = await sbClient.rpc("email_has_password", { p_email: email });
    if(error) throw error;
    if(data === true){
      remoteLoginStage = "password";
      remoteLoginBusy = false; render();
    } else {
      const redirectTo = window.location.origin + window.location.pathname;
      const { error: linkErr } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo });
      if(linkErr) throw linkErr;
      remoteLoginStage = "linkSent";
      remoteLoginBusy = false; render();
    }
  } catch(err){
    console.error("email_has_password / resetPasswordForEmail failed:", err);
    remoteLoginError = "Something went wrong checking that email — try again.";
    remoteLoginBusy = false; render();
  }
}
async function resendSetupLink(){
  remoteLoginBusy = true; remoteLoginError = null; render();
  try{
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await sbClient.auth.resetPasswordForEmail(remoteLoginEmail, { redirectTo });
    if(error) throw error;
  } catch(err){
    console.error("Resending setup link failed:", err);
    remoteLoginError = "Couldn't resend that link — try again in a moment.";
  } finally {
    remoteLoginBusy = false; render();
  }
}

async function submitRemoteLoginPassword(){
  const password = document.getElementById("remoteLoginPassword")?.value || "";
  if(!remoteLoginEmail || !password){ remoteLoginError = "Enter your password."; render(); return; }
  remoteLoginBusy = true; remoteLoginError = null; render();
  try{
    const { data, error } = await sbClient.auth.signInWithPassword({ email: remoteLoginEmail, password });
    if(error || !data.session) throw (error || new Error("Could not start a session."));
    await finishSupabaseSignIn(data.session, { remote:true });
    remoteLoginOpen = false;
  } catch(err){
    console.error("Password sign-in failed:", err);
    remoteLoginError = "That password didn't match. Use “Email me a one-time code” below if you forgot it.";
    remoteLoginBusy = false; render();
  }
}

async function sendRemoteLoginCode(){
  if(!remoteLoginEmail){ remoteLoginError = "Enter your email."; render(); return; }
  remoteLoginBusy = true; remoteLoginError = null; render();
  try{
    const { error } = await sbClient.auth.signInWithOtp({ email: remoteLoginEmail, options:{ shouldCreateUser:false } });
    if(error) throw error;
    remoteLoginStage = "code";
  } catch(err){
    console.error("signInWithOtp failed:", err);
    remoteLoginError = "Couldn't send a code to that email — check it's the email your account was set up with.";
  } finally {
    remoteLoginBusy = false; render();
  }
}
async function submitRemoteLoginCode(){
  const code = (document.getElementById("remoteLoginCode")?.value || "").trim();
  if(!code){ remoteLoginError = "Enter the code from your email."; render(); return; }
  remoteLoginBusy = true; remoteLoginError = null; render();
  try{
    const { data, error } = await sbClient.auth.verifyOtp({ email: remoteLoginEmail, token: code, type:"email" });
    if(error || !data.session) throw (error || new Error("Could not start a session."));
    if(data.session.user?.user_metadata?.password_set){
      await finishSupabaseSignIn(data.session, { remote:true });
      remoteLoginOpen = false;
    } else {
      remoteLoginPendingSession = data.session;
      remoteLoginStage = "setPassword";
      remoteLoginBusy = false; render();
    }
  } catch(err){
    console.error("Remote sign-in failed:", err);
    remoteLoginError = (err && err.message) ? err.message : "That code didn't work — check it and try again.";
    remoteLoginBusy = false; render();
  }
}
async function submitRemoteLoginNewPassword(){
  const pw1 = document.getElementById("remoteLoginNewPassword")?.value || "";
  const pw2 = document.getElementById("remoteLoginNewPassword2")?.value || "";
  if(pw1.length < 8){ remoteLoginError = "Choose a password with at least 8 characters."; render(); return; }
  if(pw1 !== pw2){ remoteLoginError = "Those passwords don't match."; render(); return; }
  remoteLoginBusy = true; remoteLoginError = null; render();
  try{
    const { error } = await sbClient.auth.updateUser({ password: pw1, data: { password_set: true } });
    if(error) throw error;
    const { data: fresh } = await sbClient.auth.getSession();
    const session = (fresh && fresh.session) || remoteLoginPendingSession;
    remoteLoginPendingSession = null;
    await finishSupabaseSignIn(session, { remote:true });
    remoteLoginOpen = false;
  } catch(err){
    console.error("Setting password failed:", err);
    remoteLoginError = (err && err.message) ? err.message : "Couldn't set that password — try again.";
    remoteLoginBusy = false; render();
  }
}
async function cancelSetPassword(){
  try{ await sbClient.auth.signOut(); } catch(e){}
  remoteLoginPendingSession = null;
  closeRemoteLogin();
}

// A clicked password-setup link lands back here with a recovery session already established by
// supabase-js from the URL. Jump straight to the "set your password" screen instead of the PIN pad —
// this is the landing half of submitRemoteLoginEmail()'s auto-sent setup link.
sbClient.auth.onAuthStateChange((event, session) => {
  if(event === "PASSWORD_RECOVERY" && session){
    remoteLoginOpen = true;
    remoteLoginPendingSession = session;
    remoteLoginStage = "setPassword";
    remoteLoginError = null;
    remoteLoginBusy = false;
    try{ window.history.replaceState(null, "", window.location.pathname + window.location.search); }catch(e){}
    render();
  }
});

// Shared finish-up once we have a real Supabase session, from either the PIN pad or remote
// sign-in: confirms who this is, makes sure the rest of the app (which looks staff up by id in
// the local STAFF array, e.g. currentUser()) has a real record for them, then loads live data.
// opts.houseId — the device's own bound house (PIN-pad path). opts.remote — a remote Leadership
// sign-in, gated to role="leadership" and given every house's real name plus every live house's data.
async function finishSupabaseSignIn(session, opts){
  opts = opts || {};
  supabaseSession = session;
  const { data: profile, error } = await sbClient
    .from("users").select("id, full_name, role").eq("id", session.user.id).maybeSingle();
  if(error || !profile){
    await sbClient.auth.signOut();
    supabaseSession = null;
    throw new Error("No staff profile found for that account.");
  }
  if(opts.remote && profile.role !== "leadership"){
    await sbClient.auth.signOut();
    supabaseSession = null;
    throw new Error("Remote sign-in is for Leadership accounts only right now.");
  }
  isRemoteLeadershipSession = !!opts.remote;
  const { data: assignedHouses } = await sbClient.from("house_staff").select("house_id").eq("user_id", profile.id);
  const houseIds = (assignedHouses||[]).map(r=>r.house_id);
  upsertLocalStaffRecord({ id: profile.id, name: profile.full_name, role: profile.role, houses: houseIds });
  // Sept 29 fix: this single upsert is all that ever populated the local STAFF array with anything
  // real — Manage Staff's own screen (renderStaffManagement) just renders whatever's in STAFF, and
  // nothing had ever loaded the OTHER real staff/house-assignment rows already sitting live in
  // Supabase, so Manage Staff looked empty of the real 24-person roster even though it was fully and
  // correctly in the database the whole time. Leadership-only (matches Manage Staff's own visibility;
  // no need for a Caregiver/Manager/PRN session to pull the company-wide roster into local state).
  if(profile.role === "leadership"){ await loadAllStaffFromSupabase(); }

  await loadSupabaseHousesInto(houses, opts.remote ? null : opts.houseId);
  if(opts.houseId){
    await loadHouseDataFromSupabase(opts.houseId);
  } else if(opts.remote){
    for(const hid of SUPABASE_LIVE_HOUSE_IDS){ await loadHouseDataFromSupabase(hid); }
  }
  await loadFoodPhotosFromSupabase(); // cross-house, not part of the per-house loop above

  state.userId = profile.id;
  state.house = opts.houseId || houseIds.find(h=>SUPABASE_LIVE_HOUSE_IDS.has(h)) || houseIds[0] || (houses[0] && houses[0].id) || null;
  pinBuffer = ""; pinError = false; supabaseLoginError = null;
  resetIdleTimer();
  syncCheckedFromTaskLog(); // rebuild Today's Flow checkmarks from whatever dailyTaskDone Supabase just loaded (Batch F)
  render();
}

function upsertLocalStaffRecord(u){
  const existing = STAFF.find(s=>s.id===u.id);
  const rec = {
    id: u.id, pin: null, name: u.name, role: u.role,
    label: ROLE_LABELS[u.role] || u.role, rail: ROLE_RAILS[u.role] || "var(--accent)",
    shift: u.role==="leadership" ? "n/a" : "Day",
    houses: (u.houses && u.houses.length) ? u.houses : (houses[0] ? [houses[0].id] : []),
    initials: computeInitials(u.name)
  };
  if(existing) Object.assign(existing, rec); else STAFF.push(rec);
}

// Sept 29 fix: pulls every real staff row (and their house assignments) from Supabase into the local
// STAFF array via the same upsertLocalStaffRecord() every other live-sync path already uses — so
// Manage Staff's list (which just renders STAFF as-is, see renderStaffManagement) actually shows the
// whole company roster instead of only whoever happens to be signed in on this device. Two small
// queries (all users, all house_staff rows) rather than a join, since RLS is written per-table and
// this keeps each query's own row-visibility rules simple to reason about; at this project's size (25
// staff, 55 assignments) the extra round trip costs nothing worth optimizing away.
async function loadAllStaffFromSupabase(){
  const { data: rows, error } = await sbClient.from("users").select("id, full_name, role");
  if(error || !rows) return;
  const { data: assignments } = await sbClient.from("house_staff").select("user_id, house_id");
  const houseMap = {};
  (assignments||[]).forEach(a=>{ (houseMap[a.user_id] || (houseMap[a.user_id]=[])).push(a.house_id); });
  rows.forEach(r=>{
    upsertLocalStaffRecord({ id:r.id, name:r.full_name, role:r.role, houses: houseMap[r.id] || [] });
  });
  // Oct 1, 2026: Manage Staff can now show a live account's actual PIN (per Johnna's decision — see
  // get_staff_pins()'s own comment). This is a SEPARATE call, deliberately: pin_plain has no column-level
  // SELECT grant at all (same lockdown pin_hash has always had), so it's only ever reachable through this
  // one Leadership-gated RPC, never a plain .from("users").select(...) like the rest of this function.
  // A refused/failed call (e.g. this session somehow isn't Leadership) just leaves pinPlain unset on
  // every row — renderStaffRow() already falls back to "PIN on file" for that case.
  const { data: pinRows, error: pinError } = await sbClient.rpc("get_staff_pins");
  if(!pinError && pinRows){
    pinRows.forEach(p=>{
      const s = STAFF.find(x=>x.id===p.id);
      if(s) s.pinPlain = p.pin_plain || null;
    });
  }
}

// Replaces the in-memory `houses` list with real rows from Supabase. `onlyHouseId`, when given,
// narrows to just that one house — the Knollview device only ever needs its own house.
async function loadSupabaseHousesInto(targetArr, onlyHouseId){
  let q = sbClient.from("houses").select("id, name, address");
  if(onlyHouseId) q = q.eq("id", onlyHouseId);
  const { data, error } = await q;
  if(error || !data || !data.length) return;
  targetArr.length = 0;
  targetArr.push(...data.map(h=>({ id:h.id, name:h.name, address:h.address||"" })));
}

// True only for a signed-in Manager/Leadership — the RLS "clinical lock" (care_plans,

function canWriteClinicalToSupabase(){

}

// Supplies Received specifically excludes PRN — matches canProposeSupplies()/moduleEdit('supplies'),

// A short, consistent display timestamp for a loaded Supabase row whose local shape only ever
// stored a one-time literal like "Just now" — matches the app's existing fmtShort() style
// ("Wed Sep 25") rather than inventing a new date format.
function formatEventTimestamp(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  let h = d.getHours(); const m = d.getMinutes();
  const ap = h>=12 ? "PM" : "AM"; h = h%12; if(h===0) h=12;
  return `${fmtShort(d)} · ${h}:${String(m).padStart(2,"0")} ${ap}`;
}

// Combines the calendar grid's separate day (calendarEvents object key) + time ("HH:MM", possibly "")
// into the single starts_at timestamptz activities_calendar actually stores — reversed by
// calendarEventRowFromSupabase below. Both directions use the browser's own local time (same
// convention as every other client-generated timestamp in this app, e.g. decided_at/edited_at)
// rather than tracking a house timezone.
function calStartsAtIso(day, time){
  return new Date(`${day}T${time || "00:00"}:00`).toISOString();
}
function calendarEventRowForSupabase(day, e){
  return {
    id: e.id, house_id: e.house, title: e.t, event_type: e.k,
    starts_at: calStartsAtIso(day, e.time), notes: e.notes || null,
    is_recurring: !!e.seriesId, status: e.status || "approved",
    created_by: e.createdById,
    edited_by: e.editedById || null, edited_at: e.editedById ? (new Date()).toISOString() : null,
    decided_by: e.decidedById || null, decided_at: e.decidedById ? (new Date()).toISOString() : null,
    deleted_by: e.deletedById || null, deleted_at: e.deletedById ? (new Date()).toISOString() : null,
    series_id: e.seriesId || null, birthday_of: e.birthdayOf || null, birthday_year: e.birthdayYear || null
  };
}
// Returns { day, event } — day is derived from starts_at (browser-local calendar date) so the caller
// can push straight into calendarEvents[day], the same day-keyed shape a locally-created event uses.
// Birthday events are never synced (see syncResidentBirthdayEvents) so a loaded row is always a real
// user-authored one-off or series occurrence.
function calendarEventRowFromSupabase(row){
  const d = new Date(row.starts_at);
  const day = isoDate(d);
  const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  const event = {

  if(!dc.id) dc.id = isDeviceSupabaseLive() && crypto.randomUUID ? crypto.randomUUID() : dailyCareLogIdSeq++;
