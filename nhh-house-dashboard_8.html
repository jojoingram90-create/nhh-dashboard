<title>NHH House Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --bg:#F3F6FA; --surface:#FFFFFF; --surface-alt:#EAEFF6; --border:#D7DFEA;
    --text:#1A2433; --text-muted:#5C6B7D; --text-faint:#8695A8;
    --accent:#1F3F66; --accent-strong:#142C47; --accent-soft:#DEE8F4; --accent-soft-text:#1F3F66;
    --shadow: 0 1px 2px rgba(20,32,52,.06), 0 6px 20px rgba(20,32,52,.06);

    --fall-bg:#FCEEDC; --fall-text:#8A4B08; --fall-dot:#C77A1F;
    --hospice-bg:#F0E6F8; --hospice-text:#5B3B87; --hospice-dot:#7C57A8;
    --away-bg:#E1EDF8; --away-text:#1F5788; --away-dot:#3E7CB1;
    --alert-bg:#FBE3E1; --alert-text:#9A2C22; --alert-dot:#C0392B;
    --good-bg:#E1F2E8; --good-text:#256A44; --good-dot:#2E7D57;
    --diab-bg:#DDF1F1; --diab-text:#14595B; --diab-dot:#1F8A8D;

    --duenow-bg:#142C47; --duenow-card-bg:#FFFFFF; --duenow-text:#FFFFFF; --duenow-text-muted:#B9CBE2;
    --duenow-tag-bg:#E1EDF8; --duenow-tag-text:#1F5788;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1620; --surface:#161F2C; --surface-alt:#1D2836; --border:#2B3A4C;
      --text:#E7ECF3; --text-muted:#9AACC2; --text-faint:#71839A;
      --accent:#8FB4E3; --accent-strong:#BFD6F0; --accent-soft:#1E3350; --accent-soft-text:#BFD6F0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);

      --fall-bg:#3A2A12; --fall-text:#F0B266; --fall-dot:#E0954A;
      --hospice-bg:#2C2340; --hospice-text:#D2B9F0; --hospice-dot:#A57FD6;
      --away-bg:#152B40; --away-text:#9CC6EE; --away-dot:#5B9AD1;
      --alert-bg:#3A1D1A; --alert-text:#F2A79E; --alert-dot:#D9584B;
      --good-bg:#16301F; --good-text:#8FD3AA; --good-dot:#49A06E; --diab-bg:#0F2F31; --diab-text:#8ADADC; --diab-dot:#3FB5B8;

      --duenow-bg:#1E3350; --duenow-card-bg:#243347; --duenow-text:#E7ECF3; --duenow-text-muted:#9AACC2;
      --duenow-tag-bg:#152B40; --duenow-tag-text:#9CC6EE;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1620; --surface:#161F2C; --surface-alt:#1D2836; --border:#2B3A4C;
    --text:#E7ECF3; --text-muted:#9AACC2; --text-faint:#71839A;
    --accent:#8FB4E3; --accent-strong:#BFD6F0; --accent-soft:#1E3350; --accent-soft-text:#BFD6F0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --fall-bg:#3A2A12; --fall-text:#F0B266; --fall-dot:#E0954A;
    --hospice-bg:#2C2340; --hospice-text:#D2B9F0; --hospice-dot:#A57FD6;
    --away-bg:#152B40; --away-text:#9CC6EE; --away-dot:#5B9AD1;
    --alert-bg:#3A1D1A; --alert-text:#F2A79E; --alert-dot:#D9584B;
    --good-bg:#16301F; --good-text:#8FD3AA; --good-dot:#49A06E; --diab-bg:#0F2F31; --diab-text:#8ADADC; --diab-dot:#3FB5B8;

    --duenow-bg:#1E3350; --duenow-card-bg:#243347; --duenow-text:#E7ECF3; --duenow-text-muted:#9AACC2;
    --duenow-tag-bg:#152B40; --duenow-tag-text:#9CC6EE;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Public Sans", -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1,h2,h3,h4{ margin:0; text-wrap:balance; font-weight:700; letter-spacing:-.01em; }
  /* Browsers give <button> its own default text color instead of inheriting the page's, which is why
     plain-text labels placed directly inside a button (no class of their own setting a color, e.g.
     the Resident Quick View count and resident-card names) rendered black even in dark mode — every
     other piece of text on the page gets its color from the --text/--text-muted/etc. tokens below,
     but a bare button never picked those up on its own. color:inherit fixes that at the root so any
     button-wrapped text follows the same theme tokens as everything else. */
  button{ font-family:inherit; font-size:inherit; cursor:pointer; color:inherit; }
  table{ border-collapse:collapse; width:100%; }
  .tabular{ font-variant-numeric:tabular-nums; }

  #app{ display:flex; min-height:100vh; visibility:hidden; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:228px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex:none;
  }
  .brand-text{ line-height:1.2; }
  .brand-text .top{ font-weight:800; font-size:14.5px; }
  .brand-text .sub{ font-size:12.5px; color:var(--text-muted); }

  .house-picker{ position:relative; }
  .house-picker select{
    width:100%; appearance:none; background:var(--surface-alt); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:9px 30px 9px 11px; font-weight:600; font-size:13.5px;
  }
  .house-picker::after{
    content:"⌄"; position:absolute; right:11px; top:50%; transform:translateY(-55%);
    color:var(--text-muted); pointer-events:none; font-size:14px;
  }
  .house-picker.locked select{ opacity:.75; cursor:not-allowed; }

  nav.primary{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:12px 11px; border-radius:8px;
    color:var(--text-muted); background:none; border:none; text-align:left; width:100%; font-weight:600; font-size:14px;
  }
  .nav-item .ic{ width:18px; text-align:center; font-size:14px; }
  .nav-item:hover{ background:var(--surface-alt); color:var(--text); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent-soft-text); }
  .nav-badge{ margin-left:auto; background:var(--accent); color:#fff; border-radius:99px; padding:1px 8px; font-size:11.5px; font-weight:700; min-width:18px; text-align:center; }

  /* Expandable nav sections (Meals, Admin) — a group header that reveals its own unchanged pages
     underneath, rather than merging them into one page. See visibleNavItems()/renderSidebar(). */
  .nav-group.active .nav-group-toggle{ color:var(--text); }
  .nav-group-caret{ font-size:11px; color:var(--text-faint); margin-left:auto; }
  .nav-group-toggle .nav-badge{ margin-left:6px; }
  .nav-group-children{ display:flex; flex-direction:column; gap:2px; margin:2px 0 4px; }
  .nav-subitem{ padding-left:30px; font-size:13.5px; }

  .sidebar-foot{ margin-top:auto; padding:10px 6px 0; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-faint); }

  button.sidebar-toggle{ display:none; }
  .sidebar-backdrop{ display:none; }

  @media (max-width: 900px){
    button.sidebar-toggle{ display:inline-flex; }
    #sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:60; box-shadow:0 0 0 100vw rgba(0,0,0,0), var(--shadow);
      transform:translateX(-100%); transition:transform .25s ease; width:250px;
    }
    #app.sidebar-open #sidebar{ transform:translateX(0); }
    .sidebar-backdrop{
      display:none; position:fixed; inset:0; background:rgba(20,20,20,.4); z-index:55;
    }
    #app.sidebar-open .sidebar-backdrop{ display:block; }
  }

  /* ---------- Main ---------- */
  #main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 26px; border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  #topbar h1{ font-size:19px; }
  .topbar-date{ color:var(--text-muted); font-size:13px; font-weight:600; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .identity-chip{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid var(--border); border-radius:99px; padding:6px 13px 6px 9px; font-size:13px; font-weight:700; line-height:1.3; }
  .identity-dot{ width:9px; height:9px; border-radius:99px; flex:none; }
  .identity-role{ display:block; font-size:12px; font-weight:600; color:var(--text-faint); }

  /* PIN lock screen */
  .lock-screen{ position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; background:var(--bg); }
  .lock-card{ width:min(360px, 90vw); background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:32px 28px; text-align:center; }
  .lock-title{ font-size:15px; font-weight:700; margin:20px 0 18px; }
  .pin-dots{ display:flex; justify-content:center; gap:14px; margin-bottom:26px; }
  .pin-dot{ width:14px; height:14px; border-radius:99px; border:2px solid var(--border); background:transparent; }
  .pin-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .pin-dot.error{ background:var(--alert-dot); border-color:var(--alert-dot); }
  .pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
  .pin-key{ padding:16px 0; border-radius:12px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); font-size:19px; font-weight:700; font-family:inherit; }
  .pin-key:hover{ border-color:var(--accent); }
  .pin-key-del{ font-size:14px; color:var(--text-muted); }
  .lock-hint{ font-size:12px; color:var(--text-faint); line-height:1.5; margin-bottom:12px; }

  #content{ padding:22px 26px 60px; max-width:1180px; }

  /* ---------- Shared bits ---------- */
  .section{ margin-bottom:30px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .section-head h2{ font-size:15px; }
  .section-head .hint{ font-size:13px; color:var(--text-faint); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:10px 15px; border-radius:8px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px; min-height:40px;
  }
  .btn:hover{ background:var(--surface-alt); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-strong); }
  .btn.small{ padding:8px 13px; font-size:12.5px; min-height:34px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* Big, one-tap logging buttons for Today's Flow — Meals Eaten / Log Vitals / Medications. Replaces
     a small text button + separate checkbox with one clear, easy-to-hit action; see task-log-options
     for the icon-button row a tap opens (% eaten, or Pass/Refuse). */
  .task-log-btn{ padding:12px 18px; border-radius:10px; font-weight:700; font-size:14px; min-height:48px; }
  .task-log-options{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .task-log-opt{ border:1px solid var(--border); background:var(--surface-alt); color:var(--text); padding:14px 10px; border-radius:10px; font-weight:700; font-size:14px; min-width:64px; min-height:52px; flex:1 1 64px; text-align:center; }
  .task-log-opt.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .task-log-opt.pass{ background:var(--good-bg); border-color:var(--good-dot); color:var(--good-text); }
  .task-log-opt.pass.active{ background:var(--good-dot); color:#fff; }
  .task-log-opt.refuse{ background:var(--alert-bg); border-color:var(--alert-dot); color:var(--alert-text); }
  .task-log-opt.refuse.active{ background:var(--alert-dot); color:#fff; }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .badge .dot{ width:6px; height:6px; border-radius:99px; }
  .badge.fall{ background:var(--fall-bg); color:var(--fall-text); } .badge.fall .dot{ background:var(--fall-dot); }
  .badge.hospice{ background:var(--hospice-bg); color:var(--hospice-text); } .badge.hospice .dot{ background:var(--hospice-dot); }
  .badge.away{ background:var(--away-bg); color:var(--away-text); } .badge.away .dot{ background:var(--away-dot); }
  .badge.alert{ background:var(--alert-bg); color:var(--alert-text); } .badge.alert .dot{ background:var(--alert-dot); }
  .badge.good{ background:var(--good-bg); color:var(--good-text); } .badge.good .dot{ background:var(--good-dot); }
  .badge.diabetic{ background:var(--diab-bg); color:var(--diab-text); } .badge.diabetic .dot{ background:var(--diab-dot); }

  /* stat strip */
  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .stat-tile{ padding:14px 16px; transition:box-shadow .15s ease, transform .15s ease; }
  .stat-tile:hover{ box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-1px); }
  .stat-tile .n{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-tile .l{ font-size:13px; color:var(--text-muted); font-weight:600; margin-top:2px; }

  /* Dashboard "Due Now" banner — medications, Scheduled Routines (vitals/PRN included), and showers
     only; see renderDueNowBanner()/dueNowCandidates(). Always a dark, high-attention surface in both
     themes, via dedicated --duenow-* tokens rather than the shared --accent-strong (which flips light
     in dark mode). */
  .due-now-banner{ background:var(--duenow-bg); color:var(--duenow-text); border-radius:14px; padding:16px 18px 14px; box-shadow:var(--shadow); margin-bottom:18px; }
  .due-now-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .due-now-pill{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--duenow-text); }
  .due-now-dot{ width:8px; height:8px; border-radius:99px; background:var(--good-dot); flex:none; }
  .due-now-count{ font-size:12.5px; font-weight:700; color:var(--duenow-text-muted); }
  .due-now-cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px; }
  .due-now-card{ background:var(--duenow-card-bg); color:var(--text); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
  .due-now-card-meta{ font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:6px; }
  .due-now-card-tag{ background:var(--duenow-tag-bg); color:var(--duenow-tag-text); border-radius:5px; padding:1px 6px; font-size:10.5px; font-weight:800; letter-spacing:.04em; }
  .due-now-card-title{ font-size:15px; font-weight:800; color:var(--text); }
  .due-now-card-line{ font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .due-now-check{ font-size:13.5px; font-weight:800; }
  .due-now-nav{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; }
  .due-now-toggle{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28); color:var(--duenow-text); }
  .due-now-toggle:hover{ background:rgba(255,255,255,.2); }
  .due-now-dots{ display:flex; gap:5px; }
  .due-now-dots .dot-ind{ background:rgba(255,255,255,.3); }
  .due-now-dots .dot-ind.active{ background:#fff; }

  /* Dashboard "On the Calendar Today" card — a compact, colored-bar list replacing the old chip-grid
     layout; see renderTodayEvents(). */
  .cal-today-card{ padding:14px 18px; display:flex; flex-direction:column; }
  .cal-today-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:8px; }
  .cal-today-row{ display:flex; align-items:center; gap:12px; padding:7px 4px; border-radius:7px; cursor:pointer; background:none; border:none; text-align:left; width:100%; font-family:inherit; }
  .cal-today-row:hover{ background:var(--surface-alt); }
  .cal-today-time{ width:66px; flex:none; font-size:13px; font-weight:700; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .cal-today-bar{ width:4px; height:22px; border-radius:3px; flex:none; }
  .cal-today-bar.activity{ background:var(--good-dot); }
  .cal-today-bar.visit{ background:var(--away-dot); }
  .cal-today-bar.appointment{ background:var(--fall-dot); }
  .cal-today-bar.birthday{ background:var(--hospice-dot); }
  .cal-today-title{ font-size:14.5px; font-weight:700; color:var(--text); }
  @keyframes statListIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
  .stat-detail-list{ margin-top:12px; animation:statListIn .18s ease-out; }

  /* resident grid */
  .resident-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(215px,1fr)); gap:12px; }
  .resident-card{ padding:14px; text-align:left; display:flex; flex-direction:column; gap:9px; }
  .resident-card:hover{ border-color:var(--accent); cursor:pointer; }
  .r-top{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:38px; height:38px; border-radius:99px; background:var(--accent-soft); color:var(--accent-soft-text);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; flex:none;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .r-name{ font-weight:700; font-size:14px; }
  .r-room{ font-size:12.5px; color:var(--text-muted); }
  .r-badges{ display:flex; flex-wrap:wrap; gap:5px; }
  .r-note{ font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:8px; }

  /* today's flow */
  .flow-block{ padding:16px 18px; margin-bottom:12px; }
  .flow-head{ display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .flow-head h3{ font-size:21px; font-weight:800; letter-spacing:.01em; }
  .flow-head .shift-tag{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); background:var(--surface-alt); padding:3px 8px; border-radius:99px; }

  /* time-of-day buckets — collapsed by default except the one matching the current time */
  .flow-bucket{ border-top:1px solid var(--border); }
  .flow-bucket:first-child{ border-top:none; }
  .flow-bucket-toggle{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
    padding:12px 4px; font-family:inherit; cursor:pointer; color:var(--text);
  }
  .flow-bucket-caret{ font-size:12px; color:var(--text-faint); width:12px; flex:none; }
  .flow-bucket-label{ font-size:13.5px; font-weight:700; }
  .flow-bucket-now-pill{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#fff; background:var(--accent); padding:2px 8px; border-radius:99px; }
  .flow-bucket-count{ margin-left:auto; font-size:12.5px; color:var(--text-faint); font-weight:600; }
  .flow-bucket-body{ padding-bottom:6px; }

  .task-row{ display:flex; align-items:flex-start; gap:9px; padding:8px 6px 8px 9px; border-top:1px solid var(--border); border-left:3px solid transparent; }
  .task-row:first-of-type{ border-top:none; }
  .flow-now-marker + .task-row, .mealgroup-members .task-row:first-child{ border-top:none; }
  .task-row[data-type="wake"]{ border-left-color:var(--fall-dot); }
  .task-row[data-type="shower"]{ border-left-color:var(--away-dot); }
  .task-row[data-type="breakfast"], .task-row[data-type="lunch"], .task-row[data-type="dinner"]{ border-left-color:var(--good-dot); }
  .task-row[data-type="routine"]{ border-left-color:var(--hospice-dot); }
  .task-row[data-type="bedtime"]{ border-left-color:var(--accent); }
  .task-row.flow-row-current{ background:var(--accent-soft); border-radius:8px; }
  .flow-now-marker{ display:flex; align-items:center; gap:8px; margin:8px 0; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); }
  .flow-now-marker::before, .flow-now-marker::after{ content:""; flex:1; height:1px; background:var(--accent); opacity:.35; }
  .flow-completed-toggle{ cursor:pointer; font-size:13px; font-weight:700; color:var(--text-muted); padding:11px 2px 7px; margin-top:6px; border-top:1px solid var(--border); user-select:none; }
  .flow-completed-toggle:hover{ color:var(--text); }
  .task-row input[type=checkbox]{ width:22px; height:22px; accent-color:var(--accent); flex:none; margin-top:2px; }
  .task-row-headline{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
  .task-row .who{ font-weight:700; font-size:13.5px; display:flex; align-items:center; flex-wrap:wrap; gap:2px; }
  .task-row-desc{ display:flex; align-items:flex-start; gap:6px; color:var(--text-muted); font-size:13px; flex-wrap:wrap; }
  .desc-text{ flex:1; min-width:0; }
  .show-more-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12.5px; padding:0; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .show-more-btn:hover{ text-decoration:underline; }
  .task-row-actions{ display:flex; align-items:center; gap:8px; flex:none; margin-left:auto; padding-top:1px; }
  .task-row .staff{ font-size:12.5px; color:var(--good-text); font-weight:600; white-space:nowrap; }
  .task-row .added-by{ font-size:12.5px; color:var(--text-faint); white-space:nowrap; }
  .task-row.done .who, .task-row.done .task-row-desc{ text-decoration:line-through; opacity:.5; }
  .dc-stamp-editable{ display:flex; align-items:center; gap:6px; }

  /* meal groups — residents sharing a standard mealtime nest under one collapsible row */
  .mealgroup-row{ cursor:pointer; }
  .mealgroup-row:hover{ background:var(--surface-alt); border-radius:8px; }
  .mealgroup-caret{ font-size:12px; color:var(--text-faint); padding-top:3px; flex:none; }
  .mealgroup-count-pill{ font-size:12px; font-weight:700; color:var(--text-faint); white-space:nowrap; }
  .mealgroup-members{ padding-left:27px; }
  .custom-time-badge{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-soft-text); padding:2px 8px; border-radius:99px; white-space:nowrap; }

  /* resident profile */
  .profile-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .profile-id{ display:flex; gap:14px; align-items:center; }
  .avatar.lg{ width:58px; height:58px; font-size:19px; }
  .profile-id h2{ font-family:"Source Serif 4", Georgia, serif; font-size:23px; font-weight:600; }
  .profile-meta{ font-size:13px; color:var(--text-muted); margin-top:3px; }
  .back-link{ background:none; border:none; color:var(--text-muted); font-weight:600; font-size:13px; padding:0 0 10px; }
  .back-link:hover{ color:var(--accent); }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab{ background:none; border:none; padding:10px 14px; font-weight:600; font-size:13px; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--accent); border-color:var(--accent); }

  .kv-grid{ display:grid; grid-template-columns:170px 1fr; gap:11px 16px; }
  .kv-grid dt{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); }
  .kv-grid dd{ margin:0; font-size:14px; }
  .tag-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ background:var(--surface-alt); border:1px solid var(--border); border-radius:99px; padding:3px 10px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .tag-remove{ background:none; border:none; color:inherit; opacity:.55; cursor:pointer; font-size:12px; padding:6px; margin:-6px; font-family:inherit; line-height:1; }
  .tag-remove:hover{ opacity:1; }
  .tag.perm-tag-none{ color:var(--text-faint); background:transparent; border-style:dashed; }
  .cp-section{ padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  .cp-section:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .cp-hint{ font-size:12.5px; color:var(--text-faint); margin-top:5px; }
  .cp-section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .cp-section-head .dc-label{ margin:0; }
  .cp-section-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .cp-section-empty{ padding:4px 0; }
  .cp-complete-btn{ width:100%; text-align:left; padding:12px 14px; border-radius:10px; border:1.5px dashed var(--border); background:var(--surface-alt); color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; }
  .cp-complete-btn:hover{ border-color:var(--accent); }
  .p-section-body .tag-list{ margin-top:4px; }
  .flow-tag{ display:inline-block; font-size:19px; line-height:1; flex:none; }
  .meal-time-settings{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
  .meal-time-settings label{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); display:block; margin-bottom:6px; }

  .visitor-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); gap:12px; }
  .visitor-row:first-child{ border-top:none; }
  .visitor-name{ font-weight:700; font-size:13.5px; }
  .visitor-rel{ font-size:12.5px; color:var(--text-muted); }
  .visitor-note{ font-size:12.5px; color:var(--text-faint); text-align:right; max-width:220px; }

  .comment{ padding:11px 0; border-top:1px solid var(--border); }
  .comment:first-child{ border-top:none; }
  .comment-meta{ font-size:12px; color:var(--text-faint); margin-bottom:3px; font-weight:600; }
  .comment-body{ font-size:13.5px; }
  .comment-form{ display:flex; gap:8px; margin-top:12px; }
  .comment-form input{ flex:1; border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; }
  .comment-form select, .routine-add-form select, .form-select{ border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; flex:none; }
  .routine-add-form{ margin-top:14px; }
  .routine-add-form input[type=text]{ border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; }

  /* dashboard meal quick-log & routine quick-log — shared form styling */
  .routine-quicklog{ padding:14px 16px; margin:0 0 10px 34px; background:var(--surface-alt); border-style:dashed; }
  .routine-quicklog select{ border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:8px 10px; font-size:12.5px; font-family:inherit; color:var(--text); min-height:36px; }
  .routine-quicklog-actions{ display:flex; gap:8px; margin-top:10px; }
  .med-log-row{ padding:10px 0; border-top:1px solid var(--border); }
  .med-log-row:first-of-type{ border-top:none; padding-top:0; }
  .med-log-name{ font-weight:700; font-size:13.5px; margin-bottom:7px; }
  .med-log-actions{ display:flex; gap:8px; }

  /* incident reports */
  .incident-row{ display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px; cursor:pointer; gap:12px; flex-wrap:wrap; font-family:inherit; }
  .incident-row-main .who{ font-weight:700; font-size:13.5px; }
  .incident-row-main .detail{ font-size:13px; color:var(--text-muted); margin-top:2px; }
  .incident-row-meta{ display:flex; align-items:center; gap:10px; flex:none; }

  /* calendar */
  .cal-week-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  /* Blocks every control in a past day's Daily Care Log from being clicked/typed into, without having
     to individually disable dozens of chip/input/button call sites — a past day is meant to be read
     exactly as it was written, never edited after the fact. */
  .dc-readonly{ pointer-events:none; opacity:.68; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .cal-day{ padding:10px; min-height:150px; display:flex; flex-direction:column; gap:6px; }
  .cal-day .d-label{ font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; }
  .cal-day.today{ outline:2px solid var(--accent); outline-offset:-2px; }
  .ev{ display:block; width:100%; border:none; text-align:left; border-radius:7px; padding:7px 8px; font-size:12px; font-weight:600; line-height:1.3; font-family:inherit; cursor:pointer; min-height:34px; }
  .ev:hover{ filter:brightness(0.95); }
  .ev.activity{ background:var(--good-bg); color:var(--good-text); }
  .ev.visit{ background:var(--away-bg); color:var(--away-text); }
  .ev.appointment{ background:var(--fall-bg); color:var(--fall-text); }
  .ev.birthday{ background:var(--hospice-bg); color:var(--hospice-text); }
  .ev-edited-mark{ opacity:.7; }

  /* menu */
  .menu-table th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--border); }
  .menu-table td{ padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13.5px; min-width:108px; max-width:150px; }
  .menu-table tr:last-child td{ border-bottom:none; }
  .menu-item{ display:flex; flex-direction:column; gap:5px; }
  .menu-item-name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .menu-item-input{ border:1px solid var(--border); background:var(--surface-alt); border-radius:7px; padding:8px; font-size:13.5px; font-weight:700; color:var(--text); font-family:inherit; width:100%; box-sizing:border-box; text-overflow:ellipsis; min-height:36px; }
  .recipe-btn{ font-size:12px; padding:6px 9px; min-height:30px; justify-content:center; }
  .recipe-link{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700; color:var(--accent); text-decoration:none; }
  .recipe-link:hover{ text-decoration:underline; }
  .menu-note{ font-size:12.5px; color:var(--text-muted); }
  .menu-week-bar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .menu-week-tabs{ display:flex; gap:8px; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }

  /* Today's Meal Plan (default single-day Food Menu view, Batch 8) */
  .today-meal-row{ padding:12px 0; border-top:1px solid var(--border); }
  .today-meal-row:first-of-type{ border-top:none; padding-top:0; }
  .today-meal-label{ font-weight:700; font-size:13.5px; margin-bottom:8px; }
  .today-meal-list{ display:flex; flex-direction:column; gap:4px; }
  .today-meal-resident{ font-size:13.5px; }
  .today-meal-resident .who{ font-weight:700; }
  .today-meal-item-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  /* Full Menu's Breakfast row — "See more" expands to every resident's breakfast for that day
     (Batch 8, item 46) since breakfast no longer has one shared dish for the house. */
  .menu-breakfast-expand{ display:flex; flex-direction:column; gap:4px; margin-top:8px; font-size:12.5px; }
  .menu-breakfast-resident .who{ font-weight:700; }

  /* Manage Staff — a long roster scrolls in place at a fixed height (~7 rows) instead of pushing the
     page down, with a visible/grabbable scrollbar for finger scrolling on an iPad or phone. */
  .staff-list-scroll{ display:flex; flex-direction:column; gap:10px; max-height:860px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:10px; scrollbar-width:auto; scrollbar-color:var(--text-faint) var(--surface-alt); }
  .staff-list-scroll::-webkit-scrollbar{ width:12px; }
  .staff-list-scroll::-webkit-scrollbar-track{ background:var(--surface-alt); border-radius:99px; }
  .staff-list-scroll::-webkit-scrollbar-thumb{ background:var(--text-faint); border-radius:99px; border:2px solid var(--surface-alt); }
  .staff-list-scroll::-webkit-scrollbar-thumb:hover{ background:var(--accent); }

  /* recipe modal */
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,14,20,.6); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-card{ background:var(--surface); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.35); width:min(560px, 100%); max-height:88vh; overflow-y:auto; }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  .modal-head h2{ font-size:16px; }
  .recipe-modal-body{ padding:18px 20px 22px; display:flex; flex-direction:column; gap:20px; }
  .recipe-section h3{ font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); margin-bottom:8px; }
  .recipe-textarea{ width:100%; box-sizing:border-box; border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:10px 12px; font-size:13.5px; color:var(--text); font-family:inherit; line-height:1.6; resize:vertical; }
  .recipe-text-display{ font-size:13.5px; color:var(--text); line-height:1.7; white-space:pre-line; }
  .recipe-video-wrap{ position:relative; width:100%; padding-top:56.25%; border-radius:8px; overflow:hidden; background:var(--surface-alt); margin-bottom:10px; }
  .recipe-video-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .recipe-video-input{ border:1px solid var(--border); background:var(--surface-alt); border-radius:7px; padding:9px 10px; font-size:13px; color:var(--text); font-family:inherit; width:100%; box-sizing:border-box; min-height:36px; }
  .recipe-video-hint{ font-size:12px; color:var(--text-faint); margin-top:6px; }

  /* dietary needs + special instructions (combined per resident) */
  .diet-resident-card{ padding:14px 0; border-top:1px solid var(--border); }
  .diet-resident-card:first-child{ border-top:none; }
  .diet-resident-head{ font-weight:700; font-size:13.5px; margin-bottom:9px; }
  .diet-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .diet-tag{ background:var(--good-bg); color:var(--good-text); border-color:transparent; }
  .allergy-tag{ background:var(--alert-bg); color:var(--alert-text); border-color:transparent; font-weight:700; }
  .diet-details-text{ font-size:12.5px; color:var(--text-muted); margin-bottom:10px; line-height:1.5; }
  .diet-instructions-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); font-weight:700; margin-bottom:6px; }
  .diet-instructions{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }

  /* per-resident meal notes */
  .meal-note-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent-soft-text); font-size:12.5px; font-weight:600; padding:5px 6px 5px 10px; border-radius:99px; }
  .meal-note-remove{ background:none; border:none; color:inherit; opacity:.6; cursor:pointer; font-size:12px; padding:7px 9px; font-family:inherit; }
  .meal-note-remove:hover{ opacity:1; }
  .meal-note-add{ display:flex; gap:6px; flex:none; flex-wrap:wrap; }
  .meal-note-add input{ border:1px solid var(--border); background:var(--surface-alt); border-radius:7px; padding:6px 10px; font-size:13px; color:var(--text); font-family:inherit; width:220px; }
  .meal-note-by{ opacity:.75; font-weight:500; font-size:11.5px; }
  .meal-note-pending, .meal-note-confirm{ border-radius:10px; padding:7px 10px; flex-wrap:wrap; }
  .meal-note-pending{ background:var(--fall-bg); color:var(--fall-text); }
  .meal-note-confirm{ background:var(--alert-bg); color:var(--alert-text); font-weight:700; }

  /* showers */
  .shower-table th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); padding:10px; border-bottom:1px solid var(--border); }
  .shower-table td{ padding:10px; border-bottom:1px solid var(--border); text-align:center; font-size:13px; }
  .shower-table td:first-child{ text-align:left; font-weight:700; }
  .shower-cell{ display:inline-flex; flex-direction:column; align-items:center; gap:2px; }
  .shower-cell .t{ font-weight:700; }
  .shower-cell .s{ color:var(--text-faint); font-size:12px; }

  /* shift announcements */
  .announce-card{ display:flex; border-radius:12px; overflow:hidden; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); margin-bottom:10px; }
  .announce-rail{ width:5px; flex:none; }
  .announce-body{ padding:13px 16px; flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .announce-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .announce-who{ display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .announce-author{ font-weight:700; font-size:13.5px; }
  .announce-role{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); background:var(--surface-alt); padding:2px 7px; border-radius:99px; }
  .announce-time{ font-size:12px; color:var(--text-faint); white-space:nowrap; }
  .announce-msg{ font-size:14px; }
  .announce-history{ font-size:12px; color:var(--text-faint); font-style:italic; }
  .announce-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:4px; padding-top:9px; border-top:1px solid var(--border); }
  .announce-expires{ font-size:12.5px; color:var(--text-muted); font-weight:700; }
  .extend-controls{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .extend-controls input[type=datetime-local]{ border:1px solid var(--border); background:var(--surface-alt); border-radius:6px; padding:5px 7px; font-size:12.5px; color:var(--text); font-family:inherit; }
  .announce-locked{ font-size:12.5px; color:var(--text-faint); display:inline-flex; align-items:center; gap:5px; }
  .announce-compose{ padding:14px 16px; }
  .posting-as{ font-size:12.5px; color:var(--text-faint); margin-bottom:9px; }
  .posting-as b{ color:var(--text); }
  .announce-compose textarea{ width:100%; border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13.5px; resize:vertical; min-height:46px; }
  .announce-compose-row{ display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .announce-compose select{ border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:7px 10px; font-size:13px; color:var(--text); font-family:inherit; font-weight:600; }
  .announce-carousel-nav{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:8px; }
  .announce-dots{ display:flex; gap:6px; }
  .dot-ind{ width:6px; height:6px; border-radius:99px; background:var(--border); }
  .dot-ind.active{ background:var(--accent); }

  /* daily care */
  .badge.neutral{ background:var(--surface-alt); color:var(--text-muted); } .badge.neutral .dot{ background:var(--text-faint); }
  .dc-section{ padding:16px 18px; margin-bottom:12px; }
  .dc-section-title{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-bottom:12px; }
  .dc-section-title .n{ width:20px; height:20px; border-radius:99px; background:var(--accent-soft); color:var(--accent-soft-text); font-size:12px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; flex:none; }
  .dc-section-title .dc-stamp{ margin-left:auto; }
  .dc-stamp{ font-size:12px; font-weight:700; letter-spacing:.02em; color:var(--text-faint); background:var(--surface-alt); border:1px solid var(--border); padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .dc-stamp.empty{ font-weight:600; font-style:italic; color:var(--text-faint); background:none; border-style:dashed; }
  .dc-meal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; }
  .dc-field{ margin-bottom:12px; }
  .dc-field:last-child{ margin-bottom:0; }
  .dc-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); margin-bottom:7px; display:block; }
  .dc-required{ color:var(--alert-text); text-transform:none; letter-spacing:normal; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip-btn{ border:1px solid var(--border); background:var(--surface-alt); color:var(--text-muted); padding:9px 15px; border-radius:99px; font-size:13px; font-weight:600; font-family:inherit; min-height:36px; }
  .chip-btn:hover{ border-color:var(--accent); }
  .chip-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .perm-grid{ display:flex; flex-direction:column; gap:9px; }
  .perm-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .perm-label{ font-size:13px; font-weight:600; color:var(--text-muted); }
  .perm-chip-row{ gap:6px; }
  .perm-chip{ padding:7px 12px; min-height:30px; font-size:12.5px; }
  .perm-chip.perm-none.active{ background:var(--text-faint); border-color:var(--text-faint); }
  .perm-chip.perm-view.active{ background:var(--away-dot); border-color:var(--away-dot); }
  .perm-chip.perm-edit.active{ background:var(--good-dot); border-color:var(--good-dot); }
  .dc-inline-input{ margin-top:9px; }
  .dc-inline-input input[type=text], .dc-inline-input input[type=number], .dc-inline-input input[type=time], .dc-inline-input textarea{
    width:100%; border:1px solid var(--border); background:var(--surface-alt); border-radius:8px; padding:8px 11px; color:var(--text); font-family:inherit; font-size:13.5px;
  }
  .dc-inline-input textarea{ min-height:44px; resize:vertical; }
  .vital-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); flex-wrap:wrap; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ---------------- Mock data (mirrors the Supabase schema in the design spec) ---------------- */
// ---- Live date/time engine ----
// Everything below reads the REAL current date/time rather than a fixed demo snapshot, so the app
// keeps working correctly day after day at a real house instead of being frozen on one walkthrough
// date. TODAY/TODAY_SHORT/TODAY_ISO/TODAY_DOW are refreshed once per render() (see refreshTodayIfNeeded)
// so a shared iPad left open overnight rolls into the new day on its own next render, without needing
// a page reload.
function pad2(n){ return String(n).padStart(2,"0"); }
function isoDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseIso(s){ const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); }
function addDaysIso(s, n){ const d = parseIso(s); d.setDate(d.getDate()+n); return isoDate(d); }
function addMonthsIso(s, n){ const d = parseIso(s); d.setMonth(d.getMonth()+n); return isoDate(d); }
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtLong(d){ return `${DOW_LONG[d.getDay()]}, ${MONTH_LONG[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function fmtShort(d){ return `${DOW_SHORT[d.getDay()]} ${MONTH_LONG[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
function fmtDayLabel(d){ return `${DOW_SHORT[d.getDay()]} ${d.getDate()}`; }
function nowRef(){ return new Date(); } // the real current moment — replaces the old fixed NOW_REF
function todayIso(){ return isoDate(nowRef()); }
let TODAY = fmtLong(nowRef());
let TODAY_SHORT = fmtShort(nowRef());
let TODAY_ISO = todayIso();
let TODAY_DOW = DOW_SHORT[nowRef().getDay()];
function refreshTodayIfNeeded(){
  const iso = todayIso();
  if(iso !== TODAY_ISO){
    TODAY_ISO = iso;
    TODAY = fmtLong(nowRef());
    TODAY_SHORT = fmtShort(nowRef());
    TODAY_DOW = DOW_SHORT[nowRef().getDay()];
    // New day — Today's Flow's wake-up/bedtime/routine checkmarks are date-scoped now (Batch F), so
    // clear yesterday's marks from the ephemeral state.checked/completedBy view and repopulate from
    // today's (fresh, empty until logged) dailyTaskDone bucket. Shower keys are deliberately left
    // alone — still the older, never-resets behavior, unchanged from before this batch.
    if(typeof state !== "undefined" && state.checked){
      Object.keys(state.checked).forEach(k=>{ if(k.startsWith("wake-") || k.startsWith("bed-") || k.startsWith("sched")) delete state.checked[k]; });
      Object.keys(state.completedBy||{}).forEach(k=>{ if(k.startsWith("wake-") || k.startsWith("bed-") || k.startsWith("sched")) delete state.completedBy[k]; });
      syncCheckedFromTaskLog();
    }
  }
}

// Starts with just the pilot house — Leadership can add more from the new Manage Houses screen
// (see renderManageHouses()/addHouse()), which pushes onto this same array. `houses` is declared
// const and mutated in place (push/splice) rather than reassigned, same pattern already used for
// STAFF and residents below.
const houses = [
  { id:"boca-bay", name:"Boca Bay", address:"4157 Boca Bay Dr" }
];

// Starts empty for the live pilot — add this house's real residents from the new Manage Residents
// screen (Residents & Care Plans module, Edit access) once it's up and running.
const residents = [];

// Care Plan option lists — used to drive chip-select UI throughout the Care Plan tab.
// These six option lists (plus DIAGNOSIS_TAGS below) are `let`, not `const` — Leadership can add to
// them from the Care Plan's Master Settings panel (see MASTER_SETTINGS_LISTS/openMasterSettings), so
// every resident's Care Plan immediately gets the new option as a choice.
let MOBILITY_TYPES = ["Independent","Cane","Walker","Wheelchair","Bed bound"];
let TRANSFER_TYPES = ["Independent","Standby assist","One person transfer","Two person transfer","Mechanical lift"];
let TOILETING_TYPES = ["Goes by themselves","Needs prompting after meals","Bladder incontinent","Bowel incontinent","Bladder & bowel incontinent"];
let COMM_TYPES = ["Can speak","Nonverbal"];
let DIET_TAGS = ["Diabetic","Pureed","Cut into bite-size pieces","Thickener required for liquids"];
let WEARABLE_TAGS = ["Hearing aids","Glasses"];
// Diagnosis is a curated multi-select (like Diet tags) rather than free text — Leadership seeds/curates
// this list via Master Settings. A caregiver can still type a diagnosis that isn't listed yet (see
// registerPendingDiagnosis) — it's usable for that resident right away and queued on Pending Approvals.
let DIAGNOSIS_TAGS = ["Dementia","Alzheimer's disease","Diabetes","Hypertension","COPD","Congestive heart failure","Parkinson's disease","Depression","Anxiety","Osteoporosis","Chronic kidney disease","Stroke / CVA history"];
const HYGIENE_DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const HYGIENE_MODE_OPTIONS = [ {value:"bedbath",label:"Bed baths only"}, {value:"shower",label:"Shower"}, {value:"independent",label:"Independent — no assistance needed"} ];
function hygieneModeLabel(mode){ return (HYGIENE_MODE_OPTIONS.find(o=>o.value===mode)||{}).label || "Bed baths only"; }
const HYGIENE_SHIFT_OPTIONS = [ {value:"Day",label:"Day shift"}, {value:"Night",label:"Night shift"} ];

// How each transfer type reads in the Dashboard's Today's Flow — kept short since it's
// combined with a per-resident wake/bedtime note below.
const TRANSFER_PHRASES = {
  "Independent":"Independent", "Standby assist":"Stand-by assist", "One person transfer":"One-person transfer",
  "Two person transfer":"2-person transfer", "Mechanical lift":"Mechanical lift transfer"
};

// House-standard meal times — editable by any house manager/leadership user on the Food Menu page.
// Per-house: each house gets its own breakfast/lunch/dinner defaults, keyed by house id. A newly added
// house lazily gets the same starter defaults the pilot house began with the first time its meal times
// are read (see currentHouseMealTimes()) — nothing needs to happen at Manage Houses' addHouse() time.
// A resident's carePlans.mealTimes override (set on their Care Plan tab) takes priority when set;
// see effectiveMealTime().
let houseMealTimesByHouse = { "boca-bay": { breakfast:"08:30", lunch:"11:30", dinner:"16:00" } };
function defaultHouseMealTimes(){ return { breakfast:"08:30", lunch:"11:30", dinner:"16:00" }; }
function currentHouseMealTimes(){
  if(!houseMealTimesByHouse[state.house]) houseMealTimesByHouse[state.house] = defaultHouseMealTimes();
  return houseMealTimesByHouse[state.house];
}
function setHouseMealTime(mealKey, value){
  if(!moduleEdit('menu') || !value) return;
  currentHouseMealTimes()[mealKey] = value;
  scheduleRender();
}
// Today's Flow still groups Wake-Up/Bedtime rows under one shared clock-time so residents on a similar
// schedule nest together (see wakeUpRows()/bedtimeRows() and todaysFlowRows()) — but per Johnna (Sept
// 2026), there's no more house-wide default a manager sets on the Dashboard; every resident's own
// wake/bed time comes from their Care Plan. This pair of constants only anchors that internal grouping
// (which time-of-day bucket the group itself sorts into) — nothing shows this pair to staff anymore,
// on the Dashboard or otherwise (see renderWakeBedGroupRow). Bed is 19:00 (7:00 PM), matching the new
// display default below — the app's old internal 21:00 (9:00 PM) value is gone entirely, not kept for
// anything else.
const houseWakeBedTimes = { wake:"07:00", bed:"19:00" };
function effectiveMealTime(residentId, mealKey){
  return (carePlans[residentId].mealTimes && carePlans[residentId].mealTimes[mealKey]) || currentHouseMealTimes()[mealKey];
}

// Care plans, medical info, visitors, and comments all start empty for the live pilot — each is
// created automatically (via defaultCarePlan()) the moment a resident is added from Manage Residents,
// and filled in from that resident'"'"'s own Care Plan / Medical / Visitors / Comments tabs from there.
function defaultCarePlan(){
  return {
    diagnosisTags:[], diagnosisDetails:"",
    fallRisk:{ yn:"no", details:"" },
    mobility:"Independent", transfer:"Independent",
    wakeTime:"", wakeNotes:"", wakeIndependent:"no",
    bedTime:"", bedNotes:"", bedIndependent:"no",
    mealTimes:{ breakfast:"", lunch:"", dinner:"" },
    hygiene:{ mode:"shower", days:[], timeOfDay:"", shift:"Day", notes:"" },
    toileting:"Goes by themselves", communication:"Can speak",
    hearing:{ yn:"no", details:"" },
    behaviorNotes:"",
    diet:{ tags:[], details:"" },
    allergies:["None known"], wearables:[],
    medications:[]
  };
}
// Hospice and Home Health each get the same shape — a company plus a specific point-of-contact nurse
// and their visiting schedule — since either one, both, or neither can apply to a given resident.
// There is deliberately no code-status field: New Horizon doesn't use that here.
function defaultAgencyInfo(){
  return { company:"", nurseName:"", nursePhone:"", visitingDays:[] };
}
function defaultMedicalInfo(){
  return { physician:"Not on file", phone:"", hospice: defaultAgencyInfo(), homeHealth: defaultAgencyInfo() };
}
// A resident's own contacts — distinct from Approved Visitors (who's allowed to visit) and from the
// house-wide Directory (Section below) — one primary contact (who can also be flagged as the Medical
// POA) plus any number of additional contacts (labeled "Additional contacts" in the UI — Sept 2026,
// was "Emergency contacts"; the underlying `emergency` field/key names are unchanged). Feeds the
// Directory screen automatically; edited only from this resident's own Contacts tab.
function defaultContacts(){
  return { primary: { name:"", phone:"", relationship:"", medicalPOA:false }, emergency: [] };
}
const carePlans = {};
const medicalInfo = {};
const visitors = {};
const comments = {};
const contacts = {};

// House-wide phone directory — general numbers staff need that aren't tied to one resident (a
// hospice agency's main line, another partner org, a management contact, etc.), each filed under one
// of these categories. Independent of any one resident's own Hospice/Home Health or Contacts info,
// though a manager may naturally end up entering the same agency in both places.
const HOUSE_CONTACT_CATEGORIES = [
  { key:"home_health", label:"Home Health" },
  { key:"hospice", label:"Hospice" },
  { key:"other_partner", label:"Other Partner" },
  { key:"emergency_contact", label:"Emergency Contact" },
  { key:"management", label:"Management" }
];
function houseContactCategoryLabel(key){ return (HOUSE_CONTACT_CATEGORIES.find(c=>c.key===key)||{}).label || key; }
// Each contact is stamped with the house it was added under (.house) — per-house, like residents.
let houseContacts = [];
let houseContactIdSeq = 1;
function currentHouseContacts(){ return houseContacts.filter(c=>c.house===state.house); }

// Supplies Received — a simple per-resident log (what was received, date received, optional notes),
// gated by its own "supplies" module permission like every other nav section. See renderSupplies().
let suppliesReceived = []; // { id, residentId, item, dateReceived, notes, addedBy, addedAt }
let suppliesIdSeq = 1;

// Wake-Up / Bedtime rows are computed from each resident's Care Plan — the transfer type drives the
// physical-assistance phrase, and the editable wakeTime/bedTime + wakeNotes/bedNotes (set on the Care
// Plan tab) drive the row's clock time and flavor note. Today's Flow sorts every row across the whole
// house by this time, so editing either field here moves the row immediately.
function transferPhrase(residentId){
  const cp = carePlans[residentId];
  return TRANSFER_PHRASES[cp.transfer] || cp.transfer || "Independent";
}
function wakeUpRows(){
  return houseResidents().filter(r=>carePlans[r.id].wakeIndependent!=="yes").map(r=>{
    const cp = carePlans[r.id];
    const note = cp.wakeNotes;
    const detail = note ? `${transferPhrase(r.id)} — ${note}.` : `${transferPhrase(r.id)}.`;
    return { time: cp.wakeTime, who:r.name, detail, residentId:r.id };
  });
}
function bedtimeRows(){
  return houseResidents().filter(r=>carePlans[r.id].bedIndependent!=="yes").map(r=>{
    const cp = carePlans[r.id];
    const note = cp.bedNotes;
    const detail = note ? `${transferPhrase(r.id)} — ${note}.` : `${transferPhrase(r.id)} — standard routine.`;
    return { time: cp.bedTime, who:r.name, detail, residentId:r.id };
  });
}

// Showers are computed from carePlans[r.id].hygiene (see todaysFlowRows()), not stored here. Meal
// rows work the same way: every house resident gets one row per meal, with the detail text pulled
// live from that resident's own Care Plan diet notes (Care Plan tab → Diet), so a new resident shows
// up in Today's Flow the moment they're added — nothing to hardcode or keep in sync by hand.
function dietDetailFor(residentId){
  const diet = (carePlans[residentId] && carePlans[residentId].diet) || { tags:[], details:"" };
  if(diet.details && diet.details.trim()) return diet.details.trim();
  if(diet.tags && diet.tags.length) return diet.tags.join(", ") + ".";
  return "No dietary notes on file — add via Care Plan.";
}
function mealRowsFor(mealKey){
  return houseResidents().map(r=>{
    let detail = dietDetailFor(r.id);
    if(mealKey === "breakfast"){
      // Breakfast now comes entirely from each resident's own Breakfast Preferences (Batch 8) — there's
      // no house-standard dish to fall back to, so a resident with nothing set for today just shows
      // blank/not-set rather than a default (item 44).
      const plan = breakfastPlanForDow(r.id, TODAY_DOW);
      detail = plan ? breakfastPlanItemsText(plan) : "No breakfast preferences set for today.";
    }
    return { id:r.id, who:r.name, detail };
  });
}
const dailyTasks = {
  get breakfast(){ return mealRowsFor("breakfast"); },
  get lunch(){ return mealRowsFor("lunch"); },
  get dinner(){ return mealRowsFor("dinner"); }
};

// ---- Calendar: rolling real weeks, not one fixed demo week ----
// Events are keyed by real ISO date ("2026-09-14"), not a fixed "Mon 7"-style label, so the calendar
// keeps working for every week going forward rather than being frozen on one walkthrough week.
// mondayOfWeek/weekDates below compute whichever week is being viewed (state.calendarWeekStart,
// defaulting to the real current week) from the real calendar, and Prev/Next Week move that anchor
// by 7 days indefinitely in either direction — see renderCalendar().
function mondayOfIso(iso){
  const d = parseIso(iso);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = dow === 0 ? -6 : 1 - dow; // shift back to Monday
  d.setDate(d.getDate() + diff);
  return isoDate(d);
}
function weekDatesFrom(mondayIso){
  const out = [];
  for(let i=0;i<7;i++) out.push(addDaysIso(mondayIso, i));
  return out;
}
// Each event carries a real id (so it can be clicked, edited, and soft-deleted) plus attribution:
// createdBy/createdAt always, editedBy/editedAt once someone changes it, deletedBy/deletedAt once
// someone removes it — a deleted event stays in this array with deleted:true rather than being spliced
// out, so it can be listed under "Deleted Events" and restored. See renderCalendar()/eventModal().
// Every event is stamped with the house it belongs to (.house), defaulting to whichever house is
// currently selected — correct for a manually-added event or a just-generated series occurrence.
// Birthday auto-gen overrides this via `extra.house` (the resident's own house), since
// syncResidentBirthdayEvents() sweeps every resident across every house regardless of state.house.
function ce(id, t, k, time, notes, createdBy, createdById, createdAt, extra){
  return Object.assign({ id, t, k, time, notes: notes||"", createdBy, createdById: createdById||null, createdAt, house: state.house,
    editedBy:null, editedById:null, editedAt:null, deleted:false, deletedBy:null, deletedById:null, deletedAt:null }, extra||{});
}
let calendarEventIdSeq = 1;
// Starts empty for the live pilot — house-wide activities and resident appointments get added fresh
// from the Calendar screen once the house is up and running, rather than carrying over sample events.
const calendarEvents = {};

// A recurring event's definition (repeat pattern + how far it's been generated). Each individual day
// it produces is still a normal entry in calendarEvents, tagged with seriesId — the series object
// itself is never shown on the calendar grid directly. See generateSeriesEvents()/renderCalendar().
let calendarSeriesIdSeq = 1;
let calendarSeries = {};

const menuDays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// Master menu: originally a named allow-list (Johnna/Tucker/Buke only). Batch D (Sept 2026, confirmed
// with Johnna) replaced that with the same House Manager/Leadership edit tier used everywhere else —
// MENU_ADMINS/is_menu_admin are no longer read anywhere, kept only as historical/DB leftovers. A House
// Manager's edit now goes live immediately but tagged Pending until Leadership reviews it; a Leadership
// edit applies immediately with no pending tag — see proposeMenuCellChange()/approveMenuCell().
function canEditMasterMenu(){ return moduleEdit('menu'); }

// Each menu item can carry a written recipe (recipeText, free text) and an embedded YouTube video
// (videoUrl — a real YouTube link, converted to an embeddable player at render time). Both are edited
// from the item's "Recipe" button/modal, not inline in the table. Until an admin fills these in, the
// modal offers a one-click search-result link instead of a dead end.
function ytSearch(q){ return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q); }
function recipeSearch(q){ return "https://www.allrecipes.com/search?q=" + encodeURIComponent(q); }
// Batch D: each cell also carries its own pending-edit state — status ("approved"|"pending"),
// preEditSnapshot (the {item,recipeText,videoUrl} to revert to on Deny, null when not pending),
// proposedBy/proposedById/proposedAt (who's House Manager edit is awaiting review), and
// decidedBy/decidedById/decidedAt (the most recent Leadership decision, approve or deny).
function mi(item, recipeText){
  return { item, recipeText: recipeText || "", videoUrl:"",
    status:"approved", preEditSnapshot:null,
    proposedBy:null, proposedById:null, proposedAt:null,
    decidedBy:null, decidedById:null, decidedAt:null };
}
// Blank Week A/B menu (every cell present but empty) — used to seed the one shared menu below before
// anything real has been entered.
function blankMasterMenuWeek(){
  const week = {};
  ["Breakfast","Lunch","Dinner"].forEach(meal=>{
    week[meal] = {};
    menuDays.forEach(d=>{ week[meal][d] = mi("",""); });
  });
  return week;
}
function blankMasterMenu(){ return { A: blankMasterMenuWeek(), B: blankMasterMenuWeek() }; }
function currentMasterMenu(){ return masterMenu; }

// Batch D (Sept 2026, confirmed with Johnna): ONE shared menu company-wide, not per-house — this
// reverses the per-house split the Manage Houses batch incidentally introduced by keying master menu
// state off state.house like everything else there. That per-house split was never actually a
// confirmed design decision for the menu specifically (the original schema/spec always had master_menus
// as company-wide, "the same way food_photos is shared"), so this corrects drift back to that original
// design rather than changing it. Boca Bay's hand-written Week A/B recipes below become the one shared
// starting menu for every house, including Knollview.
let masterMenu = {

// ISO week number of the real current date — the two menus alternate automatically as calendar weeks
// pass, with no one needing to remember to flip a switch.
function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // Mon=0 .. Sun=6
  d.setUTCDate(d.getUTCDate() - dayNum + 3); // nearest Thursday
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
}

// Batch D: applies a House Manager/Leadership edit to one menu cell. A Leadership edit applies
// immediately (status stays/returns "approved", no review needed — they carry the approval authority
// already). A House Manager's edit goes live right away (visible to everyone immediately, same
// "shows up live, tagged Pending" convention used everywhere else in this app) but is tagged "pending"
// until a Leadership user reviews it — see approveMenuCell()/denyMenuCell(). The very first edit in a
// pending cycle snapshots the cell's pre-edit values so Deny has something to revert to; a second
// House Manager edit before that review just updates the live value again without re-snapshotting
// (so Deny always reverts to what was there before the FIRST unreviewed edit, not the most recent one).
function proposeMenuCellChange(cell, mutate){
  const who = currentUser();
  if(!who) return;
  if(isSystemAdmin()){
    mutate(cell);
    cell.status = "approved";
    cell.preEditSnapshot = null;
    cell.decidedBy = who.name; cell.decidedById = who.id; cell.decidedAt = "Just now";
  } else {
    if(cell.status !== "pending"){
      cell.preEditSnapshot = { item: cell.item, recipeText: cell.recipeText, videoUrl: cell.videoUrl };
    }
    mutate(cell);
    cell.status = "pending";
    cell.proposedBy = who.name; cell.proposedById = who.id; cell.proposedAt = "Just now";
  }
}

// Accepts a normal youtube.com/watch, youtu.be, /shorts/, or existing /embed/ link and returns an
// embeddable player URL, or "" if the link doesn't look like a YouTube video.
function youtubeEmbedUrl(url){
  if(!url) return "";
  try{
    const u = new URL(url);
    let id = "";
    if(u.hostname.includes("youtu.be")) id = u.pathname.slice(1);
    else if(u.searchParams.get("v")) id = u.searchParams.get("v");
    else if(u.pathname.includes("/embed/")) id = u.pathname.split("/embed/")[1];
    else if(u.pathname.includes("/shorts/")) id = u.pathname.split("/shorts/")[1];
    id = (id || "").split("&")[0].split("?")[0].split("/")[0];
    return id ? `https://www.youtube.com/embed/${id}` : "";
  } catch(e){ return ""; }
}

// Each resident can have one or more named plans ("Breakfast 1", "Breakfast 2", ...), each built from
// a multi-select of quick items plus any number of written-in items, assigned to either every day or

function residentBreakfastPlansFor(residentId){
  if(!residentBreakfastPlans[residentId]) residentBreakfastPlans[residentId] = [];

// The plan covering a given day-of-week ("Mon".."Sun", same format as TODAY_DOW/menuDays), if any. A
// resident can't have two plans covering the same day (enforced when saving, see saveBreakfastPlan()),
// so at most one plan ever matches.

// whatever a Caregiver enters shows up right away, tagged Pending, rather than being hidden until
// reviewed (see renderBreakfastPlanRow's Pending badge). A denied plan is excluded, same as if it never
// existed.
function breakfastPlanForDow(residentId, dow){
  return residentBreakfastPlansFor(residentId).find(p => p.status!=="denied" && (p.scope==="all" || (p.days||[]).includes(dow))) || null;

// Every day already spoken for by one of this resident's OTHER plans — used both to grey out/guard
// against picking a day twice (item 43's guardrail) and to block a new "Every day" plan from silently
// overlapping an existing specific-days plan.
function breakfastDaysTakenByOtherPlans(residentId, excludePlanId){
  const taken = new Set();
  residentBreakfastPlansFor(residentId).forEach(p=>{
    if(p.id === excludePlanId || p.status==="denied") return;
    if(p.scope === "all") menuDays.forEach(d=>taken.add(d));
    else (p.days||[]).forEach(d=>taken.add(d));
  });
  return taken;
}

// One-time migration (item 47): any resident with an active legacy Breakfast Exception becomes a new
// "Breakfast 1" plan — the old free-text description becomes a single written-in item, carried over to
// whichever days the old override already covered. Runs once (guarded by breakfastOverridesMigrated,
// which is itself persisted) so it never re-runs and duplicates plans on a later reload.
function migrateBreakfastOverridesIfNeeded(){
  if(breakfastOverridesMigrated) return;
  Object.keys(breakfastOverrides).forEach(residentId=>{
    const o = breakfastOverrides[residentId];
    if(!o || !o.active) return;
    const text = (o.text||"").trim();
    if(!text) return;
    const plans = residentBreakfastPlansFor(residentId);
    plans.push({
      id: breakfastPlanIdSeq++,
      label: "Breakfast 1",
      items: [],
      customItems: [text],
      scope: o.scope === "days" ? "days" : "all",
      days: o.scope === "days" ? (o.days||[]).slice() : []
    });
  });
  breakfastOverridesMigrated = true;
}

function saveBreakfastPlan(){

  if(d.scope==="days" && !d.days.length){

    const approved = moduleEdit('menu');

    plans.push({ id: newId, label:d.label, items:d.items, customItems:d.customItems, scope:d.scope, days:d.days,
      status: approved ? "approved" : "pending", addedBy: who ? who.name : "", addedById: who ? who.id : null, addedAt: "Just now" });
  } else {
    const idx = plans.findIndex(p=>p.id===d.id);
    if(idx>=0) plans[idx] = Object.assign({}, plans[idx], { label:d.label, items:d.items, customItems:d.customItems, scope:d.scope, days:d.days });
  }

// (item 53) instead of erasing it, so Leadership's history shows it — removing an already-approved,
// live instruction (a manager cleaning up the menu card) still just deletes it outright, since there was

function confirmDeleteMealNote(residentId, noteId){

    note.decidedBy = who ? who.name : "";
    note.decidedById = who ? who.id : null;
    note.decidedAt = "Just now";

    // folded into the next debounced whole-house sync, same reasoning as confirmRemoveSupply().

function formatTime12(t){
  // Guards against a blank/invalid time (e.g. a resident whose Care Plan wake/bed/shower time was never
  // filled in) — without this, "".split(":") silently parses as hour 0, minute undefined, producing the
  // nonsense "12:undefined AM" instead of a clear "Not set".
  if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return "Not set";
  const [h,m] = t.split(":").map(Number);
  const ap = h>=12 ? "PM" : "AM";
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,"0")} ${ap}`;
}
// Wake/bed times specifically default to a display-only 7:00 AM / 7:00 PM when nothing's on file yet,
// rather than the generic "Not set" every other blank time in the app shows (meal times, hygiene time,
// etc. are unaffected — they still fall through to formatTime12's plain "Not set"). This is purely a
// display fallback: it never writes 07:00/19:00 into a resident's actual Care Plan data, so a manager
// opening Edit on a resident who's never had a wake/bed time entered still sees a genuinely blank field,
// not a pre-filled one. Used everywhere a resident's wake or bed time is shown — Today's Flow and the
// Care Plan tab alike — so the same resident never shows "Not set" in one place and 7:00 in another.
function formatWakeBedTime12(t, kind){
  if(t && /^\d{1,2}:\d{2}$/.test(t)) return formatTime12(t);
  return kind === "bed" ? "7:00 PM" : "7:00 AM";
}
// Calendar event time is now entered via a native 24-hour "HH:MM" time picker (see eventFormFields),
// but events saved before that change may still hold the old free-typed display string (e.g. "2:00
// PM"). This formats the new 24-hour value normally and falls back to showing an old value exactly as
// stored, rather than letting formatTime12 choke on it.
function fmtEventTime(t){
  if(!t) return "";
  if(/^\d{1,2}:\d{2}$/.test(t)) return formatTime12(t);
  return t;
}

// ---------------------------------------------------------------------------
// Quarter-hour time picker (Sept 29, 2026) — Scheduled Routines specifically.
// Every other time field in the app uses <input type="time" step="900">, which snaps correctly on
// desktop browsers but iOS Safari's native time wheel does not reliably honor the step attribute — on
// the actual Knollview iPad it still scrolled through all 60 minutes. Rather than touch every other
// stepped time input in the app (all of which are working as intended on desktop and haven't been
// flagged), this builds a plain three-<select> Hour/Minute/AM-PM picker, scoped to just the two time
// fields Scheduled Routines needs (starting time, and the new repeat "until" time) — a real dropdown
// can only ever offer the four minute values, on any device, with no dependence on the browser's own
// native picker behavior at all.
const QUARTER_HOUR_MINUTES = [0,15,30,45];
function quarterHourSelectHtml(idPrefix, value){
  let h24=8, m=0;
  if(value && /^\d{1,2}:\d{2}$/.test(value)){
    const [hh,mm] = value.split(":").map(Number);
    if(hh>=0 && hh<24) h24=hh;
    if(mm>=0 && mm<60) m=mm;
  }
  const mSnapped = QUARTER_HOUR_MINUTES.reduce((best,q)=>Math.abs(q-m)<Math.abs(best-m)?q:best, 0);
  const h12 = ((h24+11)%12)+1;
  const ap = h24>=12 ? "PM" : "AM";
  const hourOpts = Array.from({length:12},(_,i)=>i+1).map(hh=>`<option value="${hh}" ${hh===h12?"selected":""}>${hh}</option>`).join("");
  const minOpts = QUARTER_HOUR_MINUTES.map(mm=>`<option value="${mm}" ${mm===mSnapped?"selected":""}>${String(mm).padStart(2,"0")}</option>`).join("");
  const apOpts = ["AM","PM"].map(a=>`<option value="${a}" ${a===ap?"selected":""}>${a}</option>`).join("");
  return `<span class="qh-time-select" style="display:inline-flex; gap:4px; flex:none;">
    <select id="${idPrefix}-h" aria-label="Hour">${hourOpts}</select>
    <select id="${idPrefix}-m" aria-label="Minute">${minOpts}</select>
    <select id="${idPrefix}-ap" aria-label="AM/PM">${apOpts}</select>
  </span>`;
}
// Returns "HH:MM" (24-hour), or "" if the selects aren't on the page (e.g. a stale id after re-render).
function quarterHourSelectValue(idPrefix){
  const h = document.getElementById(idPrefix+"-h"), m = document.getElementById(idPrefix+"-m"), ap = document.getElementById(idPrefix+"-ap");
  if(!h || !m || !ap) return "";
  let h24 = Number(h.value) % 12;
  if(ap.value === "PM") h24 += 12;
  return `${String(h24).padStart(2,"0")}:${String(Number(m.value)).padStart(2,"0")}`;
}

// ---------------------------------------------------------------------------
// Every remaining native <input type="time"> -> the 15-minute picker (Batch L item 98, Oct 2026).
// iPad Safari's native time wheel ignores step="900", so Care Plan wake/bed/meal/hygiene times, house
// meal times, Calendar event times, nurse-notified times, etc. still scrolled minute by minute on the
// real iPad even though the code asked for 15-minute steps. Rather than rewrite 16 separate inputs and
// every handler that reads them, this upgrades each one in place after any render: the original input
// stays on the page as a hidden field with the SAME id/value/onchange (so every existing
// document.getElementById(id).value read and `this.value` handler keeps working untouched), and a
// Hour / 15-minute / AM-PM trio of <select>s drives it. A blank time stays blank until an hour is chosen;
// an existing by-the-minute value (e.g. 6:07) is shown snapped to the nearest quarter hour and normalized
// into the hidden field, so it's saved at 15-minute precision the next time that section is saved.
function qhSnapMinutes(m){ return QUARTER_HOUR_MINUTES.concat([60]).reduce((best,q)=>Math.abs(q-m)<Math.abs(best-m)?q:best, 0); } // 60 = roll to next hour (e.g. :53 -> next :00)
function qhNormalizeTime(value){
  if(!value || !/^\d{1,2}:\d{2}/.test(value)) return "";
  let [hh,mm] = value.split(":").map(Number);
  if(!(hh>=0 && hh<24) || !(mm>=0 && mm<60)) return "";
  mm = qhSnapMinutes(mm);
  if(mm===60){ mm=0; hh=(hh+1)%24; }
  return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
}
function qhUpgradeTimeInput(inp){
  if(!inp || inp.getAttribute("data-qh")) return;
  const norm = qhNormalizeTime(inp.value);
  const disabled = inp.disabled;
  inp.setAttribute("data-qh","1");
  inp.type = "hidden";
  inp.value = norm; // snapped (or "" when blank) — see header comment
  let h12 = "", mSel = 0, ap = "AM";
  if(norm){
    const [hh,mm] = norm.split(":").map(Number);
    h12 = String(((hh+11)%12)+1); mSel = mm; ap = hh>=12 ? "PM" : "AM";
  }
  const wrap = document.createElement("span");
  wrap.className = "qh-time-select";
  wrap.style.cssText = "display:inline-flex; gap:4px; flex:none; vertical-align:middle;";
  const mk = (aria, opts, selected) => {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", aria);
    if(disabled) sel.disabled = true;
    opts.forEach(([v,l])=>{ const o=document.createElement("option"); o.value=v; o.textContent=l; if(String(v)===String(selected)) o.selected=true; sel.appendChild(o); });
    return sel;
  };
  const hSel = mk("Hour", [["","Hr"]].concat(Array.from({length:12},(_,i)=>[String(i+1),String(i+1)])), h12);
  const mmSel = mk("Minute", QUARTER_HOUR_MINUTES.map(q=>[String(q),String(q).padStart(2,"0")]), String(mSel));
  const apSel = mk("AM or PM", [["AM","AM"],["PM","PM"]], ap);
  const commit = () => {
    let v = "";
    if(hSel.value){
      let h24 = Number(hSel.value) % 12;
      if(apSel.value==="PM") h24 += 12;
      v = `${String(h24).padStart(2,"0")}:${String(Number(mmSel.value)).padStart(2,"0")}`;
    }
    inp.value = v;
    // The original inline onchange="..." handler, run with the hidden input as `this`, exactly as the
    // native control would have called it.
    if(typeof inp.onchange === "function") inp.onchange.call(inp, { type:"change", target:inp });
  };
  [hSel,mmSel,apSel].forEach(sel=>sel.addEventListener("change", commit));
  wrap.appendChild(hSel); wrap.appendChild(mmSel); wrap.appendChild(apSel);
  inp.insertAdjacentElement("afterend", wrap);
}
function qhUpgradeAllTimeInputs(root){
  try{ (root||document).querySelectorAll('input[type="time"]:not([data-qh])').forEach(qhUpgradeTimeInput); }catch(e){ console.error("time-picker upgrade failed:", e); }
}
(function startTimePickerUpgrade(){
  if(typeof MutationObserver === "undefined" || typeof document === "undefined" || !document.body) return;
  let pending = false;
  new MutationObserver(()=>{
    if(pending) return; pending = true;
    Promise.resolve().then(()=>{ pending = false; qhUpgradeAllTimeInputs(document); });
  }).observe(document.body, { childList:true, subtree:true });
  qhUpgradeAllTimeInputs(document);
})();

// Scheduled Routines — repeat every N hours (Sept 29, 2026)
// ---------------------------------------------------------------------------
const ROUTINE_REPEAT_OPTIONS = [
  { value:"",   label:"Does not repeat" },
  { value:"1",  label:"Every hour" },
  { value:"2",  label:"Every 2 hours" },
  { value:"3",  label:"Every 3 hours" },
  { value:"4",  label:"Every 4 hours" },
  { value:"6",  label:"Every 6 hours" },
  { value:"8",  label:"Every 8 hours" },
  { value:"12", label:"Every 12 hours" }
];
// Expands one routine item into every clock time it's due today — a single-element list for a
// non-repeating routine, or a full round-the-clock cycle for a repeating one: "start, start+N,
// start+2N, ..." wrapping all the way around the 24-hour day and back to just before "start" again.
// (Oct 2, 2026 — per Johnna: a repeating routine should never need a daily cutoff time picked for it;
// it just goes every N hours, all day, every day, until someone removes it. Previously this required a
// separate "until" time, which both implied and actually produced a bounded window each day — removed
// entirely, see routineRepeatSummary below and the dropped "until" picker in the Routines tab.) Every
// option in ROUTINE_REPEAT_OPTIONS divides 1440 evenly (1/2/3/4/6/8/12), so this always lands on a whole
// number of evenly-spaced occurrences with no remainder/drift.
function routineOccurrenceTimes(item){
  if(!item.repeatHours) return [item.time];
  const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
  const toTime = mins => `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;
  const start = toMin(item.time), stepMin = item.repeatHours*60;
  const count = Math.round(1440/stepMin);
  const times = [];
  for(let i=0;i<count;i++) times.push(toTime((start + i*stepMin) % 1440));
  return times;
}
function routineRepeatSummary(item){
  if(!item.repeatHours) return "";
  const opt = ROUTINE_REPEAT_OPTIONS.find(o=>o.value===String(item.repeatHours));
  return opt ? opt.label : `Every ${item.repeatHours} hours`;
}

  if(removed && isDeviceSupabaseLive() && supabaseSession){
    sbClient.from("resident_routines").delete().eq("id", removed.id).then(({error})=>{
      if(error) console.error("Supabase routine delete failed:", error);

}
// itemId arrives from an onclick attribute as whatever type it was interpolated as — always a string
// once quoted (see renderFlowRow/routineQuickLogForm), but a legacy local record's id may still be a
// plain number, so compare as strings on both sides rather than assume either type.
function findRoutineItem(itemId){
  for(const rid in residentRoutines){
    const found = (residentRoutines[rid]||[]).find(it=>String(it.id)===String(itemId));

    elimination:{ bm:null, bmTime:"", unusualNoted:null, unusualType:[], bowelIssue:null, bowelIssueOther:"", urinationIssue:null, urinationIssueOther:"", nurseNotified:null, nurseNotifiedTime:"", comments:"" },
