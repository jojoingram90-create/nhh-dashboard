// ---------------------------------------------------------------------------
// Food Photos (food_photos table + the "food-photos" Storage bucket) — Sept 28, 2026
// ---------------------------------------------------------------------------
// Unlike every other table this app syncs, food_photos is genuinely cross-house (any signed-in
// staff member can see every house's CONFIRMED photos, per the confirm/lock design from Sept 23),
// so it's never scoped to state.house/loadHouseDataFromSupabase's per-house fan-out the way
// everything else is — it's loaded and pushed on its own. RLS does the real work of hiding an
// unconfirmed house's draft from everyone else (food_photos_select: confirmed = true or
// has_house_access(house_id)) — this is just where that data lands locally.
//
// The image itself lives in the private "food-photos" Storage bucket, one object per
// house/date/category (path "<house_id>/<photo_date>/<meal_category>.<ext>" — re-uploading
// overwrites the same object, matching "Replace" freely-until-confirmed). The bucket is private,
// so what actually makes a photo viewable is a signed URL, generated here (never in the render
// code) and only for rows this signed-in user is already allowed to see — same rule as the
// storage bucket's own read policy, which checks has_house_access() or a confirmed food_photos row.

// Full replace, same as everywhere else that loads an accumulating cross-device table (Comments,
// Supplies, etc.) — safe because this only ever runs at sign-in and when the Food Photo QC screen
// is opened, before any local edit exists to lose (a local upload writes straight to Supabase too,
// see uploadFoodPhotoToSupabase below, so there's nothing this could clobber).
async function loadFoodPhotosFromSupabase(){
  if(!supabaseSession) return;
  const { data, error } = await sbClient.from("food_photos").select("*");
  if(error){ console.error("Loading food photos failed:", error); return; }
  const rows = data || [];
  let signedByPath = {};
  if(rows.length){
    const { data: signedRows, error: signErr } = await sbClient.storage
      .from("food-photos").createSignedUrls(rows.map(r=>r.image_url), 3600);
    if(signErr) console.error("Signing food photo URLs failed:", signErr);
    (signedRows||[]).forEach(s=>{ if(s && s.path && s.signedUrl) signedByPath[s.path] = s.signedUrl; });
  }
  const byDate = {}, confirmedByDate = {};
  rows.forEach(row=>{
    if(!byDate[row.photo_date]) byDate[row.photo_date] = {};
    if(!byDate[row.photo_date][row.house_id]) byDate[row.photo_date][row.house_id] = {};
    byDate[row.photo_date][row.house_id][row.meal_category] = {
      by: (STAFF.find(s=>s.id===row.posted_by)||{}).name || "Staff",
      at: formatEventTimestamp(row.posted_at),
      img: signedByPath[row.image_url] || null
    };
    if(row.confirmed){
      if(!confirmedByDate[row.photo_date]) confirmedByDate[row.photo_date] = {};
      confirmedByDate[row.photo_date][row.house_id] = {
        by: (STAFF.find(s=>s.id===row.confirmed_by)||{}).name || "Staff",
        at: formatEventTimestamp(row.confirmed_at)
      };
    }
  });
  foodPhotos = byDate;
  foodPhotoConfirmed = confirmedByDate;
}
// Called immediately from handlePhotoUpload, not on the usual debounced sync loop — this is a real
// file, not JSON, and (unlike every other table) an upload has to actually reach Storage before the
// food_photos row pointing at it means anything. Own house only, matching food_photos_insert's
// has_house_access(house_id) + posted_by = auth.uid() and the storage bucket's own insert policy.
async function uploadFoodPhotoToSupabase(houseId, dateIso, cat, file){
  if(!supabaseSession) return;
  try{
    const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || "");
    const ext = (extMatch ? extMatch[1] : "jpg").toLowerCase();
    const path = `${houseId}/${dateIso}/${cat}.${ext}`;
    const { error: upErr } = await sbClient.storage.from("food-photos")
      .upload(path, file, { upsert:true, contentType: file.type || undefined });
    if(upErr){ console.error("Supabase food photo upload failed:", upErr); return; }
    const { error: rowErr } = await sbClient.from("food_photos").upsert({
      house_id: houseId, photo_date: dateIso, meal_category: cat, image_url: path,
      posted_by: supabaseSession.user.id, posted_at: new Date().toISOString(), confirmed: false
    }, { onConflict: "house_id,photo_date,meal_category" });
    if(rowErr) console.error("Supabase food photo row sync failed:", rowErr);
  } catch(err){ console.error("Supabase food photo upload failed:", err); }
}
// Locks all three categories together in one call, matching the app's own all-or-nothing Confirm —
// own house only (requestConfirmFoodPhotos/confirmFoodPhotosNow already enforce houseId===state.house
// before this is ever reached).
async function confirmFoodPhotosToSupabase(houseId, dateIso){
  if(!supabaseSession) return;
  const { error } = await sbClient.from("food_photos")
    .update({ confirmed:true, confirmed_by: supabaseSession.user.id, confirmed_at: new Date().toISOString() })
    .eq("house_id", houseId).eq("photo_date", dateIso);
  if(error) console.error("Supabase food photo confirm failed:", error);
}
// Leadership-only in the app (unlockFoodPhotosNow already checks isSystemAdmin() before this is ever
// reached) and Leadership-only at the database level too (food_photos_update blocks anyone else from
// touching an already-confirmed row at all).
async function unlockFoodPhotosToSupabase(houseId, dateIso){
  if(!supabaseSession) return;
  const { error } = await sbClient.from("food_photos")
    .update({ confirmed:false, confirmed_by:null, confirmed_at:null })
    .eq("house_id", houseId).eq("photo_date", dateIso);
  if(error) console.error("Supabase food photo unlock failed:", error);
}

// ---------------------------------------------------------------------------
// Resident profile photos (the private "resident-photos" Storage bucket) — Sept 28, 2026
// ---------------------------------------------------------------------------
// Unlike Food Photos, a resident's photo isn't cross-house or confirm/lock'd — it's just one more
// field on that resident's own record, gated exactly like every other direct edit to the residents
// table (Manager/Leadership only, matching residents_update's RLS). The image itself lives at
// "<resident_id>/photo.<ext>" in the private "resident-photos" bucket; has_resident_house_access()
// (an existing helper, unchanged) is what the bucket's own storage.objects policies check, using
// that same path's first folder segment as the resident id.
//
// Only Manager/Leadership can upload/replace/remove (moduleEdit('residents') gates the control in
// the UI; RLS enforces it for real). Every role with house access can view — has_resident_house_access
// is the read policy, same as residents_select itself.

// Called immediately from handleResidentPhotoUpload, same reasoning as Food Photos: the real file has
// to actually reach Storage before residents.photo_url pointing at it means anything.
async function uploadResidentPhotoToSupabase(residentId, file){
  if(!supabaseSession) return;
  try{
    const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || "");
    const ext = (extMatch ? extMatch[1] : "jpg").toLowerCase();
    const path = `${residentId}/photo.${ext}`;
    const { error: upErr } = await sbClient.storage.from("resident-photos")
      .upload(path, file, { upsert:true, contentType: file.type || undefined });
    if(upErr){ console.error("Supabase resident photo upload failed:", upErr); return; }
    const { error: rowErr } = await sbClient.from("residents").update({ photo_url: path }).eq("id", residentId);
    if(rowErr){ console.error("Supabase resident photo row sync failed:", rowErr); return; }
    await refreshResidentPhotoSignedUrl(residentId, path);
  } catch(err){ console.error("Supabase resident photo upload failed:", err); }
}
// Called immediately from removeResidentPhoto. Deletes the actual file (not just clearing the
// column) — a stale, unreferenced object left in the bucket would still be readable by anyone with
// house access to that resident, per the storage select policy, even after photo_url is cleared.
async function removeResidentPhotoFromSupabase(residentId, path){
  if(!supabaseSession) return;
  if(path){
    const { error: rmErr } = await sbClient.storage.from("resident-photos").remove([path]);
    if(rmErr) console.error("Supabase resident photo delete failed:", rmErr);
  }
  const { error: rowErr } = await sbClient.from("residents").update({ photo_url: null }).eq("id", residentId);
  if(rowErr) console.error("Supabase resident photo row clear failed:", rowErr);
}
// Regenerates one resident's signed URL and stores it on the in-memory record (photoSignedUrl —
// separate from photoUrl, which holds the raw storage path for Supabase-synced houses). Called after
// a fresh upload and whenever a resident's profile is opened, so a photo shown mid-session doesn't
// run into its 1-hour signed-URL expiry, and so another device's newer upload/removal shows up.
async function refreshResidentPhotoSignedUrl(residentId, pathOverride){
  const r = residents.find(x=>x.id===residentId);
  if(!r) return;
  const path = pathOverride || r.photoUrl;
  if(!path){ r.photoSignedUrl = null; return; }
  const { data, error } = await sbClient.storage.from("resident-photos").createSignedUrl(path, 3600);
  if(error){ console.error("Signing resident photo URL failed:", error); r.photoSignedUrl = null; return; }
  r.photoSignedUrl = data ? data.signedUrl : null;
}
// Batch version for a freshly-loaded house's whole resident list (loadHouseDataFromSupabase) —
// one createSignedUrls call rather than one round trip per resident with a photo on file.
async function loadResidentPhotoSignedUrls(list){
  const withPhotos = list.filter(r=>typeof r.photoUrl === "string" && r.photoUrl);
  if(!withPhotos.length) return;
  const { data, error } = await sbClient.storage.from("resident-photos")
    .createSignedUrls(withPhotos.map(r=>r.photoUrl), 3600);
  if(error){ console.error("Signing resident photo URLs failed:", error); return; }
  const signedByPath = {};
  (data||[]).forEach(s=>{ if(s && s.path && s.signedUrl) signedByPath[s.path] = s.signedUrl; });
  withPhotos.forEach(r=>{ r.photoSignedUrl = signedByPath[r.photoUrl] || null; });
}

// Loads one house's residents + Contacts + Care Plan + Medications + Medical Info + Comments +
// Approved Visitors + resident profile section approvals from Supabase into the app's normal
// in-memory shape, replacing whatever local data existed for that house's residents.
// Batch L item 89 added three columns to residents (diabetic, no_home_health, declining). Until the SQL
// that adds them has been run on the live database, asking for them would make the whole residents
// query/upsert fail — so both the load and the sync fall back to the original column list on error and
// remember it, which keeps every other resident field working either way.
const RESIDENT_SELECT_COLS = "id, house_id, full_name, room_number, dob, admission_date, status, fall_risk, hospice, out_of_building, out_of_building_reason, out_of_building_expected_return, general_notes, photo_url";
const RESIDENT_FLAG_COLS_SQL = ", diabetic, no_home_health, declining";
let residentFlagColumnsLive = true;
async function loadHouseDataFromSupabase(houseId){
  let { data: residentRows, error } = await sbClient
    .from("residents")
    .select(RESIDENT_SELECT_COLS + (residentFlagColumnsLive ? RESIDENT_FLAG_COLS_SQL : ""))
    .eq("house_id", houseId);
  if(error && residentFlagColumnsLive){
    console.warn("Resident status-flag columns not available yet — loading without them:", error.message);
    const retry = await sbClient.from("residents").select(RESIDENT_SELECT_COLS).eq("house_id", houseId);
    if(!retry.error) residentFlagColumnsLive = false; // only conclude "columns missing" if the plain query works
    residentRows = retry.data; error = retry.error;
  }
  if(error){ console.error("Loading residents failed:", error); return; }

  // Calendar (series + events) is house-wide rather than per-resident, so it's loaded by house_id
  // directly instead of riding the residents-ids fan-out below. Drop any previously-loaded series/
  // events for this house first, same "full replace" approach as residents, before repopulating —
  // safe because, same as residents, this only ever runs at sign-in/house-switch.
  const { data: seriesRows, error: seriesErr } = await sbClient.from("calendar_series").select("*").eq("house_id", houseId);
  if(seriesErr) console.error("Loading calendar series failed:", seriesErr);
  const { data: eventRows, error: eventsErr } = await sbClient.from("activities_calendar").select("*").eq("house_id", houseId);
  if(eventsErr) console.error("Loading calendar events failed:", eventsErr);
  Object.keys(calendarSeries).forEach(id=>{ if(calendarSeries[id].house===houseId) delete calendarSeries[id]; });
  (seriesRows||[]).forEach(row=>{ const s = calendarSeriesRowFromSupabase(row); calendarSeries[s.id] = s; });
  Object.keys(calendarEvents).forEach(day=>{
    calendarEvents[day] = (calendarEvents[day]||[]).filter(e=>e.house!==houseId);
    if(!calendarEvents[day].length) delete calendarEvents[day];
  });
  (eventRows||[]).forEach(row=>{
    const { day, event } = calendarEventRowFromSupabase(row);
    if(!calendarEvents[day]) calendarEvents[day] = [];
    calendarEvents[day].push(event);
  });

  // Master menu is company-wide (no house_id), so it's loaded once here regardless of which house
  // signed in — every house reads and writes the same 42 rows. House-standard meal times are the one
  // part of Food Menu that stays per-house (house_settings.house_id), loaded right alongside it.
  const { data: menuRows, error: menuErr } = await sbClient.from("master_menus").select("*");
  if(menuErr) console.error("Loading master menu failed:", menuErr);
  (menuRows||[]).forEach(applyMasterMenuRow);

  // Batch F — Today's Flow's persisted wake-up/bedtime/routine checkmarks (daily_tasks), house-scoped
  // and just today's date (Today's Flow never shows any other day, so there's no reason to load more).
  // Custom routine types (routine_types) are house-scoped too — the built-in seed list in ROUTINE_TYPES
  // stays purely client-side and is never read from or written to this table; only a house's own added
  // types live here.
  const { data: taskRows, error: taskErr } = await sbClient.from("daily_tasks").select("*").eq("house_id", houseId).eq("task_date", TODAY_ISO);
  if(taskErr) console.error("Loading daily tasks failed:", taskErr);
  dailyTaskDone[TODAY_ISO] = {};
  (taskRows||[]).forEach(row=>{
    const t = dailyTaskRowFromSupabase(row);
    let key = null;
    if(t.taskType === "wake_up") key = `wake-${t.residentId}`;
    else if(t.taskType === "bedtime") key = `bed-${t.residentId}`;
    // Sept 29, 2026 — a repeating routine has more than one occurrence sharing the same item id, so the
    // key now also carries the occurrence's own clock time (scheduled_time), matching how it's built in
    // todaysFlowRows()/taskKeyMeta(). scheduled_time is a real column on every daily_tasks row already,
    // so this needed no schema change of its own.
    else if(t.taskType === "routine") key = `sched${t.detail}@${t.scheduledTime}`; // detail holds the routine item's own id — see taskKeyMeta
    if(key) dailyTaskDone[TODAY_ISO][key] = t;
  });
  routineOccurrenceLogs[TODAY_ISO] = {};
  const { data: occLogRows, error: occLogErr } = await sbClient.from("routine_occurrence_logs").select("*").eq("house_id", houseId).eq("log_date", TODAY_ISO);
  if(occLogErr) console.error("Loading routine occurrence logs failed:", occLogErr);
  (occLogRows||[]).forEach(row=>{
    const l = routineOccurrenceLogRowFromSupabase(row);
    if(!routineOccurrenceLogs[TODAY_ISO][l.routineId]) routineOccurrenceLogs[TODAY_ISO][l.routineId] = {};
    routineOccurrenceLogs[TODAY_ISO][l.routineId][l.occTime] = { vitalType:l.vitalType, value:l.value, loggedById:l.loggedById, loggedByName:l.loggedByName, loggedAt:l.loggedAt };
  });
  const { data: routineTypeRows, error: routineTypeErr } = await sbClient.from("routine_types").select("*").eq("house_id", houseId);
  if(routineTypeErr) console.error("Loading routine types failed:", routineTypeErr);
  for(let i=ROUTINE_TYPES.length-1;i>=0;i--){ if(ROUTINE_TYPES[i].houseId===houseId) ROUTINE_TYPES.splice(i,1); }
  (routineTypeRows||[]).forEach(row=>ROUTINE_TYPES.push(routineTypeRowFromSupabase(row)));
  const { data: settingsRow, error: settingsErr } = await sbClient.from("house_settings").select("*").eq("house_id", houseId).maybeSingle();
  if(settingsErr) console.error("Loading house meal times failed:", settingsErr);
  if(settingsRow){
    houseMealTimesByHouse[houseId] = {
      breakfast: settingsRow.meal_time_breakfast ? String(settingsRow.meal_time_breakfast).slice(0,5) : defaultHouseMealTimes().breakfast,
      lunch: settingsRow.meal_time_lunch ? String(settingsRow.meal_time_lunch).slice(0,5) : defaultHouseMealTimes().lunch,
      dinner: settingsRow.meal_time_dinner ? String(settingsRow.meal_time_dinner).slice(0,5) : defaultHouseMealTimes().dinner
    };
  }

  // Drop any previously-loaded residents for this house before repopulating, so one removed in
  // Supabase since the last load doesn't linger locally.
  for(let i=residents.length-1;i>=0;i--){ if(residents[i].house===houseId) residents.splice(i,1); }

  const ids = (residentRows||[]).map(r=>r.id);
  let contactRows = [], emergencyRows = [], carePlanRows = [], medicationRows = [], medicalInfoRows = [];
  let commentRows = [], supplyRows = [], incidentRows = [], mealNoteRows = [], breakfastPlanRows = [];
  let sectionApprovalRows = [], visitorRows = [], routineRows = [], careLogRows = [], careLogUpdateRows = [];
  if(ids.length){
    const [{ data:c }, { data:e }, { data:cpRows }, { data:mRows }, { data:miRows }, { data:comRows }, { data:supRows }, { data:irRows }, { data:mnRows }, { data:bpRows }, { data:saRows }, { data:visRows }, { data:rrRows }, { data:dcRows }] = await Promise.all([
      sbClient.from("resident_contacts").select("*").in("resident_id", ids),
      sbClient.from("resident_emergency_contacts").select("*").in("resident_id", ids),
      sbClient.from("care_plans").select("*").in("resident_id", ids),
      sbClient.from("resident_medications").select("*").in("resident_id", ids).order("created_at"),
      sbClient.from("medical_info").select("*").in("resident_id", ids),
      sbClient.from("resident_comments").select("*").in("resident_id", ids).order("created_at"),
      sbClient.from("supplies_received").select("*").in("resident_id", ids).order("added_at"),
      sbClient.from("incident_reports").select("*").in("resident_id", ids).order("created_at"),
      sbClient.from("resident_meal_notes").select("*").in("resident_id", ids).order("added_at"),
      sbClient.from("breakfast_plans").select("*").in("resident_id", ids).order("added_at"),
      sbClient.from("resident_section_approvals").select("*").in("resident_id", ids).order("proposed_at"),
      sbClient.from("approved_visitors").select("*").in("resident_id", ids).order("proposed_at"),
      sbClient.from("resident_routines").select("*").in("resident_id", ids).eq("active", true).order("scheduled_time"),
      sbClient.from("daily_care_logs").select("*").in("resident_id", ids).order("care_date")
    ]);
    contactRows = c || []; emergencyRows = e || [];
    carePlanRows = cpRows || []; medicationRows = mRows || []; medicalInfoRows = miRows || [];
    commentRows = comRows || []; supplyRows = supRows || []; incidentRows = irRows || [];
    mealNoteRows = mnRows || []; breakfastPlanRows = bpRows || [];
    sectionApprovalRows = saRows || []; visitorRows = visRows || [];
    routineRows = rrRows || []; careLogRows = dcRows || [];

    // daily_care_log_updates has no resident_id of its own — it only points back at its parent
    // daily_care_logs row — so it can only be fetched once we know which log ids exist, hence this
    // separate query rather than folding it into the Promise.all above.
    const careLogIds = careLogRows.map(row=>row.id);
    if(careLogIds.length){
      const { data:updRows, error:updErr } = await sbClient.from("daily_care_log_updates").select("*")
        .in("daily_care_log_id", careLogIds).order("updated_at", { ascending:false });
      if(updErr) console.error("Loading daily care log updates failed:", updErr);
      careLogUpdateRows = updRows || [];
    }
  }
  // Only the most recent row per (resident_id, section_key) matters — older ones are the permanent
  // history a fresh proposal cycle leaves behind, same "latest wins" idea as everywhere else that loads
  // an accumulating-history table. Ordered by proposed_at above, so a later Map.set() for the same key
  // simply overwrites the earlier one.
  const latestSectionApprovalByKey = new Map();
  sectionApprovalRows.forEach(row=>{ latestSectionApprovalByKey.set(row.resident_id+"|"+row.section_key, row); });

  (residentRows||[]).forEach(r=>{
    residents.push({
      id: r.id, house: r.house_id, name: r.full_name,
      initials: computeInitials(r.full_name), room: r.room_number || "",
      dob: r.dob || "", admitted: r.admission_date || "",
      flags: {
        fall: !!r.fall_risk, hospice: !!r.hospice, away: !!r.out_of_building,
        diabetic: !!r.diabetic, noHomeHealth: !!r.no_home_health, declining: !!r.declining,
        awayReason: r.out_of_building_reason || null,
        awayReturn: r.out_of_building_expected_return ? String(r.out_of_building_expected_return).slice(0,10) : null
      },
      note: r.general_notes || "",
      photoUrl: r.photo_url || null, photoSignedUrl: null
    });
    if(!carePlans[r.id]) carePlans[r.id] = defaultCarePlan();
    applyCarePlanRow(r.id, carePlanRows.find(cp=>cp.resident_id===r.id));
    // Overview's quick fall-risk flag always wins over whatever Care Plan last had, same as the
    // residents-table sync below (fall_risk is intentionally stored on both rows).
    carePlans[r.id].fallRisk.yn = r.fall_risk ? "yes" : "no";
    // Diabetic flag and the Care Plan "Diabetic" diet tag are one fact kept in two places: if either says
    // yes, both do (so existing residents already tagged Diabetic in their Care Plan light up the flag).
    { const hasTag = (((carePlans[r.id].diet||{}).tags)||[]).includes("Diabetic"); const res = residents[residents.length-1];
      if(hasTag) res.flags.diabetic = true; else if(res.flags.diabetic) setCarePlanDiabeticTag(r.id, true); }
    applyMedicationRows(r.id, medicationRows.filter(m=>m.resident_id===r.id));
    if(!medicalInfo[r.id]) medicalInfo[r.id] = defaultMedicalInfo();
    applyMedicalInfoRow(r.id, medicalInfoRows.find(mi=>mi.resident_id===r.id));
    visitors[r.id] = visitorRows.filter(v=>v.resident_id===r.id).map(approvedVisitorRowFromSupabase);
    comments[r.id] = commentRows.filter(c=>c.resident_id===r.id).map(commentRowFromSupabase);
    incidentReports[r.id] = incidentRows.filter(ir=>ir.resident_id===r.id).map(incidentReportRowFromSupabase);
    suppliesReceived = suppliesReceived.filter(s=>s.residentId!==r.id)
      .concat(supplyRows.filter(s=>s.resident_id===r.id).map(supplyRowFromSupabase));
    residentMealNotes[r.id] = mealNoteRows.filter(n=>n.resident_id===r.id).map(mealNoteRowFromSupabase);
    residentBreakfastPlans[r.id] = breakfastPlanRows.filter(p=>p.resident_id===r.id).map(breakfastPlanRowFromSupabase);
    residentRoutines[r.id] = routineRows.filter(rt=>rt.resident_id===r.id).map(residentRoutineRowFromSupabase);
    // Daily Care Log — full history, not just today, since a resident's Daily Care Log screen lets
    // staff page back through previous days (state.dcViewDate/shiftDailyCareDate have no lower bound).
    // Clear any date bucket this resident already has locally first, same "full replace, not merge"
    // pattern as visitors/comments/etc. above, so a log entry removed in Supabase since the last load
    // (there's no delete flow for these today, but the pattern costs nothing to keep consistent) can't
    // linger.
    Object.keys(dailyCare).forEach(dateKey=>{ delete dailyCare[dateKey][r.id]; });
    careLogRows.filter(row=>row.resident_id===r.id).forEach(row=>{
      const dateKey = row.care_date;
      if(!dailyCare[dateKey]) dailyCare[dateKey] = {};
      const dc = dailyCareLogRowFromSupabase(row);
      dc.log = careLogUpdateRows.filter(u=>u.daily_care_log_id===row.id).map(dailyCareLogUpdateRowFromSupabase);
      dailyCare[dateKey][r.id] = dc;
    });
    const cRow = contactRows.find(c=>c.resident_id===r.id);
    contacts[r.id] = {
      primary: {
        name: cRow?.primary_name || "", phone: cRow?.primary_phone || "",
        relationship: cRow?.primary_relationship || "", medicalPOA: !!cRow?.primary_is_medical_poa
      },
      emergency: emergencyRows.filter(e=>e.resident_id===r.id)
        .map(e=>({ id:e.id, name:e.name||"", phone:e.phone||"", relationship:e.relationship||"" }))
    };
    // Resident profile section approvals — applied last, after residents/contacts above are both in
    // place, since a still-pending proposal's value has to overlay whatever those just set (matching
    // what the local runtime already shows a Caregiver mid-review: the live value updated immediately
    // at Save time, tagged Pending until a decision).
    residentSectionApprovals[r.id] = {}; // full replace, same as residents/contacts above
    CAREGIVER_PROPOSABLE_SECTIONS.forEach(sectionKey=>{
      const row = latestSectionApprovalByKey.get(r.id+"|"+sectionKey);
      if(!row) return;
      residentSectionApprovals[r.id][sectionKey] = residentSectionApprovalRowFromSupabase(row);
      if(row.status === "pending") residentSectionApplyValue(r.id, sectionKey, row.proposed_value);
    });
  });
  syncResidentBirthdayEvents();
  await loadResidentPhotoSignedUrls(residents.filter(r=>r.house===houseId));
}

// Turns one resident's local Care Plan into a care_plans row. Kept separate from
// applyCarePlanRow() above (which does the reverse) so the two field-mapping lists sit right next
// to each other in a diff. NOTE: mobility/transfer/toileting/communication/hygiene_mode/
// hygiene_shift are plain text columns, not enums — Manage Settings lets each house customize
// those option lists, and an enum would hard-fail the first customized value.
function carePlanRowForSupabase(residentId, cp, userId){
  return {
    resident_id: residentId,
    diagnosis_tags: cp.diagnosisTags || [], diagnosis_details: cp.diagnosisDetails || null,
    fall_risk_yn: cp.fallRisk.yn === "yes", fall_risk_details: cp.fallRisk.details || null,
    mobility: cp.mobility || null, transfer_type: cp.transfer || null,
    wake_time: cp.wakeTime || null, wake_notes: cp.wakeNotes || null, wake_independent: cp.wakeIndependent === "yes",
    bed_time: cp.bedTime || null, bed_notes: cp.bedNotes || null, bed_independent: cp.bedIndependent === "yes",
    meal_time_breakfast: cp.mealTimes.breakfast || null, meal_time_lunch: cp.mealTimes.lunch || null,
    meal_time_dinner: cp.mealTimes.dinner || null,
    hygiene_mode: cp.hygiene.mode || "shower", hygiene_days: cp.hygiene.days || [],
    hygiene_time_of_day: cp.hygiene.timeOfDay || null, hygiene_shift: cp.hygiene.shift || null,
    hygiene_notes: cp.hygiene.notes || null,
    toileting: cp.toileting || null, communication: cp.communication || null,
    hearing_loss_yn: cp.hearing.yn === "yes", hearing_details: cp.hearing.details || null,
    behavioral_notes: cp.behaviorNotes || null,
    diet_tags: cp.diet.tags || [], diet_details: cp.diet.details || null,
    allergies: cp.allergies || [], wearables: cp.wearables || [],
    updated_by: userId
  };
}
function medicalInfoRowForSupabase(residentId, mi){
  return {
    resident_id: residentId,
    physician_name: mi.physician && mi.physician !== "Not on file" ? mi.physician : null,
    physician_phone: mi.phone || null,
    hospice_company: mi.hospice.company || null, hospice_nurse_name: mi.hospice.nurseName || null,
    hospice_nurse_phone: mi.hospice.nursePhone || null, hospice_visiting_days: mi.hospice.visitingDays || [],
    home_health_company: mi.homeHealth.company || null, home_health_nurse_name: mi.homeHealth.nurseName || null,
    home_health_nurse_phone: mi.homeHealth.nursePhone || null, home_health_visiting_days: mi.homeHealth.visitingDays || []
  };
}

// Debounced full re-sync of the current live house's data up to Supabase — see the sync-strategy
// note at the top of this section for why it's whole-house rather than per-field. Called from
// writeSnapshotNow() on the same 700ms debounce as the local save, so every normal save for a
// Supabase-live house now writes both places.
//
// Not every section below runs for every role. Residents/Contacts/Care Plan/Medications/Medical
// Info stay gated to canWriteClinicalToSupabase() (Manager/Leadership only, per RLS's clinical
// lock) — a Caregiver/PRN session attempting those would just get a silent "permission denied" on
// every debounce tick, so it's skipped up front. Comments and Incident Reports are open to all
// four roles (RLS: can_document_care()/has_resident_house_access()) and Supplies Received to all
// but PRN — those sections run whenever the signed-in role actually has that ability, matching the
// app's own canProposeSupplies()/moduleEdit() gates exactly.
//
// Comments/Supplies/Incident Reports are UPSERT-ONLY here, deliberately never delete-by-absence
// the way residents/contacts above do — they're accumulating lists more than one signed-in device
// can add to at once (Knollview's iPad plus any remote Leadership sign-in), and a device syncing
// its own possibly-stale local list must never delete a row some other device already added. A
// real delete (Supplies only) is sent immediately from confirmRemoveSupply() instead of being
// inferred here.
let sbSyncInFlight = false, sbSyncQueuedAgain = false;
async function syncLiveHouseToSupabase(){
  if(!supabaseSession) return;
  const houseId = state.house;
  if(!houseId || !SUPABASE_LIVE_HOUSE_IDS.has(houseId)) return;
  if(sbSyncInFlight){ sbSyncQueuedAgain = true; return; }
  sbSyncInFlight = true;
  try{
    const localList = residents.filter(r=>r.house===houseId);
    const localIds = localList.map(r=>r.id);

    if(canWriteClinicalToSupabase() && localList.length){
      const rows = localList.map(r=>({
        id: r.id, house_id: houseId, full_name: r.name, room_number: r.room || null,
        dob: r.dob || null, admission_date: r.admitted || null,
        fall_risk: !!r.flags.fall, hospice: !!r.flags.hospice,
        out_of_building: !!r.flags.away, out_of_building_reason: r.flags.awayReason || null,
        out_of_building_expected_return: r.flags.awayReturn || null,
        general_notes: r.note || null, updated_by: supabaseSession.user.id,
        ...(residentFlagColumnsLive ? { diabetic: !!r.flags.diabetic, no_home_health: !!r.flags.noHomeHealth, declining: !!r.flags.declining } : {})
      }));
      let { error } = await sbClient.from("residents").upsert(rows);
      if(error && residentFlagColumnsLive){
        // Most likely the new status-flag columns haven't been added to the live table yet (see
        // RESIDENT_FLAG_COLS_SQL) — retry without them so every other resident field still saves.
        console.warn("Resident sync failed with the status-flag columns — retrying without them:", error.message);
        rows.forEach(row=>{ delete row.diabetic; delete row.no_home_health; delete row.declining; });
        const retry = await sbClient.from("residents").upsert(rows);
        if(!retry.error) residentFlagColumnsLive = false; // only conclude "columns missing" if the plain upsert works
        error = retry.error;
      }
      if(error) console.error("Supabase resident sync failed:", error);
    }

    if(canWriteClinicalToSupabase()){
      // Real deletes made on this device — remove anything Supabase still has for this house that
      // no longer exists in the local list.
      const { data: remoteIdRows } = await sbClient.from("residents").select("id").eq("house_id", houseId);
      const toDelete = (remoteIdRows||[]).map(r=>r.id).filter(id=>!localIds.includes(id));
      if(toDelete.length) await sbClient.from("residents").delete().in("id", toDelete);

      for(const r of localList){
        const c = contacts[r.id] || defaultContacts();
        await sbClient.from("resident_contacts").upsert({
          resident_id: r.id, primary_name: c.primary.name || null, primary_phone: c.primary.phone || null,
          primary_relationship: c.primary.relationship || null, primary_is_medical_poa: !!c.primary.medicalPOA,
          updated_by: supabaseSession.user.id
        });
        await sbClient.from("resident_emergency_contacts").delete().eq("resident_id", r.id);
        if((c.emergency||[]).length){
          await sbClient.from("resident_emergency_contacts").insert(
            c.emergency.map(e=>({ resident_id:r.id, name:e.name||null, phone:e.phone||null, relationship:e.relationship||null }))
          );
        }

        const cp = carePlans[r.id] || defaultCarePlan();
        const { error: cpErr } = await sbClient.from("care_plans")
          .upsert(carePlanRowForSupabase(r.id, cp, supabaseSession.user.id), { onConflict: "resident_id" });
        if(cpErr) console.error("Supabase care plan sync failed:", cpErr);

        // Medications are a small, fully-replaceable child list — same delete-then-insert approach
        // as emergency contacts above, rather than trying to match each local int id to a remote row.
        await sbClient.from("resident_medications").delete().eq("resident_id", r.id);
        if((cp.medications||[]).length){
          const { error: medErr } = await sbClient.from("resident_medications").insert(
            cp.medications.map(m=>({
              resident_id: r.id, name: m.name || "", dosage: m.dosage || null,
              times: m.times || [], other_time: (m.times||[]).includes("other") ? (m.otherTime || null) : null
            }))
          );
          if(medErr) console.error("Supabase medication sync failed:", medErr);
        }

        const mi = medicalInfo[r.id] || defaultMedicalInfo();
        const { error: miErr } = await sbClient.from("medical_info")
          .upsert(medicalInfoRowForSupabase(r.id, mi), { onConflict: "resident_id" });
        if(miErr) console.error("Supabase medical info sync failed:", miErr);
      }
    }

    if(canDocumentCareViaSupabase()){
      for(const r of localList){
        const rComments = (comments[r.id]||[]).filter(c=>typeof c.id === "string"); // only real (UUID) rows are live-synced
        for(const c of rComments){
          const { error: cErr } = await sbClient.from("resident_comments")
            .upsert(commentRowForSupabase(r.id, c), { onConflict: "id" });
          if(cErr) console.error("Supabase comment sync failed:", cErr);
        }
        const rReports = (incidentReports[r.id]||[]).filter(rep=>typeof rep.id === "string");
        for(const rep of rReports){
          const { error: irErr } = await sbClient.from("incident_reports")
            .upsert(incidentReportRowForSupabase(rep), { onConflict: "id" });
          if(irErr) console.error("Supabase incident report sync failed:", irErr);
        }
      }
    }

    if(canSyncSuppliesToSupabase()){
      const rSupplies = suppliesReceived.filter(s=>localIds.includes(s.residentId) && typeof s.id === "string");
      for(const s of rSupplies){
        const { error: sErr } = await sbClient.from("supplies_received")
          .upsert(supplyRowForSupabase(s), { onConflict: "id" });
        if(sErr) console.error("Supabase supply sync failed:", sErr);
      }
    }

    // Calendar is house-wide (not per-resident), so it's scoped directly off houseId/state.house
    // rather than localList/localIds. Series (the recurrence definition) stays Manager/Leadership-only,
    // matching calendar_series' RLS exactly (same gate as the clinical-lock tables above). Individual
    // events reuse canSyncSuppliesToSupabase() — any role but PRN — matching activities_calendar's own
    // insert-policy split (Manager/Leadership for approved, Caregiver for their own pending one-offs);
    // an upsert a Caregiver's own RLS can't cover (e.g. a second edit after their first sync) just logs
    // and is skipped, same non-fatal handling as everywhere else in this function.
    if(canWriteClinicalToSupabase()){
      const rSeries = Object.values(calendarSeries).filter(s=>s.house===houseId && typeof s.id === "string");
      for(const s of rSeries){
        const { error: csErr } = await sbClient.from("calendar_series")
          .upsert(calendarSeriesRowForSupabase(s), { onConflict: "id" });
        if(csErr) console.error("Supabase calendar series sync failed:", csErr);
      }
    }

    if(canSyncSuppliesToSupabase()){
      // Upsert-only, never delete-by-absence — same reasoning as Comments/Supplies/Incident Reports
      // above. Calendar deletes are always soft (deleted_by/deleted_at set via a normal field update,
      // see confirmDeleteEvent/confirmDeleteSeries), so unlike Supplies there's no separate immediate-
      // delete call path needed here at all — a soft-delete just rides this same debounced upsert.
      const rEvents = [];
      Object.keys(calendarEvents).forEach(day=>{
        (calendarEvents[day]||[]).forEach(e=>{ if(e.house===houseId && typeof e.id === "string") rEvents.push({ day, e }); });
      });
      for(const { day, e } of rEvents){
        const { error: ceErr } = await sbClient.from("activities_calendar")
          .upsert(calendarEventRowForSupabase(day, e), { onConflict: "id" });
        if(ceErr) console.error("Supabase calendar event sync failed:", ceErr);
      }
    }

    // Master menu is company-wide (not scoped to houseId/localList) — every signed-in House Manager/
    // Leadership session re-upserts the same 42 cells, same "whole thing, not per-field" sync strategy
    // as everywhere else in this function. Reuses canWriteClinicalToSupabase() (Manager/Leadership only)
    // since master_menus' own RLS now matches that exactly (is_manager_or_leadership()), not the old
    // is_menu_admin_user() allow-list. House-standard meal times (house_settings) ride the same gate —
    // its RLS is_manager_or_leadership() too — and are per-house, unlike the menu itself.
    if(canWriteClinicalToSupabase()){
      for(const week of ["A","B"]){
        for(const meal of ["Breakfast","Lunch","Dinner"]){
          for(const day of menuDays){
            const cell = masterMenu[week][meal][day];
            const { error: mmErr } = await sbClient.from("master_menus")
              .upsert(masterMenuCellRowForSupabase(week, meal, day, cell), { onConflict: "week_label,meal,day_of_week" });
            if(mmErr) console.error("Supabase master menu sync failed:", mmErr);
          }
        }
      }
      const { error: hsErr } = await sbClient.from("house_settings")
        .upsert(houseSettingsRowForSupabase(houseId, currentHouseMealTimes()), { onConflict: "house_id" });
      if(hsErr) console.error("Supabase house meal times sync failed:", hsErr);
    }

    // Resident meal notes and breakfast plans — Manager/Leadership (approved) or Caregiver (pending),
    // matching canProposeMenu()/resident_meal_notes' and breakfast_plans' RLS split exactly. Upsert-only
    // like Comments/Supplies above; a true delete (an already-approved note/plan actually being removed)
    // is sent immediately from confirmDeleteMealNote()/confirmDeleteBreakfastPlan() instead.
    if(canProposeMenu()){
      for(const r of localList){
        const rNotes = (residentMealNotes[r.id]||[]).filter(n=>typeof n.id === "string");
        for(const n of rNotes){
          const { error: mnErr } = await sbClient.from("resident_meal_notes")
            .upsert(mealNoteRowForSupabase(r.id, n), { onConflict: "id" });
          if(mnErr) console.error("Supabase meal note sync failed:", mnErr);
        }
        const rPlans = (residentBreakfastPlans[r.id]||[]).filter(p=>typeof p.id === "string");
        for(const p of rPlans){
          const { error: bpErr } = await sbClient.from("breakfast_plans")
            .upsert(breakfastPlanRowForSupabase(r.id, p), { onConflict: "id" });
          if(bpErr) console.error("Supabase breakfast plan sync failed:", bpErr);
        }
      }
    }

    // Batch E: resident profile section approvals (Overview/Contacts) and Approved Visitors —
    // Manager/Leadership (decisions, or a direct visitor add) or Caregiver (their own pending
    // proposal), matching canProposeResidents()/both tables' RLS split exactly (INSERT: is_caregiver()
    // + pending + own, or — approved_visitors only — is_manager_or_leadership() + approved + own;
    // UPDATE: is_manager_or_leadership() only). Upsert-only, same as every other approval-shaped table
    // above; a visitor's true hard delete is sent immediately from removeVisitor() instead, and a
    // section proposal is never hard-deleted at all, only approved/denied.
    if(canProposeResidents()){
      for(const r of localList){
        const secs = residentSectionApprovals[r.id];
        if(secs){
          for(const sectionKey of Object.keys(secs)){
            const a = secs[sectionKey];
            if(typeof a.id !== "string") continue; // only real (UUID) rows are live-synced
            const { error: rsaErr } = await sbClient.from("resident_section_approvals")
              .upsert(residentSectionApprovalRowForSupabase(r.id, sectionKey, a), { onConflict: "id" });
            if(rsaErr) console.error("Supabase resident section approval sync failed:", rsaErr);
          }
        }
        const rVisitors = (visitors[r.id]||[]).filter(v=>typeof v.id === "string");
        for(const v of rVisitors){
          const { error: avErr } = await sbClient.from("approved_visitors")
            .upsert(approvedVisitorRowForSupabase(r.id, v), { onConflict: "id" });
          if(avErr) console.error("Supabase visitor sync failed:", avErr);
        }
      }
    }

    // Batch F: Scheduled Routines (resident_routines/routine_types), Today's Flow's persisted
    // checkmarks (daily_tasks), and Daily Care Log (daily_care_logs/daily_care_log_updates) — all
    // gated by canDocumentCareViaSupabase() (every role that can document care: Manager/Caregiver/
    // Leadership/PRN), matching those tables' RLS exactly. Upsert-only, same as every other table in
    // this function; a routine's true hard delete is sent immediately from removeRoutine() instead.
    if(canDocumentCareViaSupabase()){
      // Custom routine types this house itself added — never touch the shared built-in seed list
      // (no houseId) or another house's own custom types.
      const rTypes = ROUTINE_TYPES.filter(t=>t.custom && t.houseId===houseId);
      for(const t of rTypes){
        const { error: rtErr } = await sbClient.from("routine_types")
          .upsert(routineTypeRowForSupabase(t), { onConflict: "key" });
        if(rtErr) console.error("Supabase routine type sync failed:", rtErr);
      }

      for(const r of localList){
        const rRoutines = (residentRoutines[r.id]||[]).filter(item=>typeof item.id === "string");
        for(const item of rRoutines){
          const { error: rrErr } = await sbClient.from("resident_routines")
            .upsert(residentRoutineRowForSupabase(r.id, item), { onConflict: "id" });
          if(rrErr) console.error("Supabase resident routine sync failed:", rrErr);
        }
      }

      // Today's Flow's persisted checkmarks — today only, same reasoning as loadHouseDataFromSupabase's
      // task_date filter (Today's Flow never shows another day).
      const todayTasks = dailyTaskDone[TODAY_ISO] || {};
      for(const key of Object.keys(todayTasks)){
        const t = todayTasks[key];
        if(typeof t.id !== "string") continue; // only real (UUID) rows are live-synced
        const { error: dtErr } = await sbClient.from("daily_tasks")
          .upsert(dailyTaskRowForSupabase(houseId, TODAY_ISO, key, t), { onConflict: "id" });
        if(dtErr) console.error("Supabase daily task sync failed:", dtErr);
      }

      // Daily Care Log — today's record only, and only once something has actually been documented.
      // getDC() auto-vivifies a blank record just from opening the screen to look at it (see
      // renderDailyCareDetail), so "record exists" isn't the same as "someone actually documented
      // something" — dc.meta (set the moment any field is actually edited) or dc.log (set at Save/
      // sign-off) is. NOTE: this deliberately does NOT pre-filter on typeof dc.id / entry.id === "string"
      // the way every other table in this function does — dailyCareLogRowForSupabase/
      // dailyCareLogUpdateRowForSupabase mint a fresh string id in place for a legacy record that
      // predates this batch (one with no id field at all), and filtering first would skip exactly the
      // records that backfill exists to catch. Past days are read-only in the UI, and getDC()'s writes
      // always resolve to state.dcViewDate || todayIso() — dcViewDate is never set while actively
      // documenting, so today is the only date that can ever need syncing.
      const todayCare = dailyCare[TODAY_ISO] || {};
      for(const r of localList){
        const dc = todayCare[r.id];
        if(!dc || (Object.keys(dc.meta).length === 0 && dc.log.length === 0)) continue;
        const { error: dcErr } = await sbClient.from("daily_care_logs")
          .upsert(dailyCareLogRowForSupabase(r.id, houseId, TODAY_ISO, dc), { onConflict: "id" });
        if(dcErr) console.error("Supabase daily care log sync failed:", dcErr);
        for(const entry of dc.log){
          const { error: dcuErr } = await sbClient.from("daily_care_log_updates")
            .upsert(dailyCareLogUpdateRowForSupabase(dc, entry), { onConflict: "id" });
          if(dcuErr) console.error("Supabase daily care log update sync failed:", dcuErr);
        }
      }
    }
  } catch(err){
    console.error("Supabase sync failed:", err);
  } finally {
    sbSyncInFlight = false;
    if(sbSyncQueuedAgain){ sbSyncQueuedAgain = false; syncLiveHouseToSupabase(); }
  }
}

async function attemptSupabasePinLogin(pin){
  const houseId = getDeviceHouseId();
  supabaseBusyMsg = "Checking PIN…";
  supabaseLoginError = null;
  render();
  try{
    const resp = await fetch(PIN_LOGIN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ action:"login", house_id: houseId, device_id: DEVICE_ID, pin })
    });
    const body = await resp.json();
    if(!resp.ok || body.error){
      pinError = true;
      supabaseLoginError = body.error || "Incorrect PIN.";
      render();
      setTimeout(()=>{ pinError=false; supabaseLoginError=null; render(); }, 1200);
      return;
    }
    // Note: this is the token_hash overload (no email) — GoTrue rejects the request if an email
    // is included alongside a token_hash ("Only the token_hash and type should be provided"),
    // confirmed against the live project before shipping this.
    const { data, error } = await sbClient.auth.verifyOtp({ token_hash: body.token_hash, type:"magiclink" });
    if(error || !data.session) throw (error || new Error("Could not start a session."));
    await finishSupabaseSignIn(data.session, { houseId });
  } catch(err){
    console.error("PIN login failed:", err);
    pinError = true;
    supabaseLoginError = "Couldn't reach the server — check the connection and try again.";
    render();
    setTimeout(()=>{ pinError=false; supabaseLoginError=null; render(); }, 1500);
  } finally {
    supabaseBusyMsg = null;
    render();
  }
}

const IDLE_LOCK_MS = 2 * 60 * 1000; // auto-lock after 2 minutes of no taps/clicks
let idleTimer = null;
let pinBuffer = "";
let pinError = false;

// auto=true means this lock was triggered automatically (idle timeout, tab backgrounded/closed) rather
// than someone deliberately tapping "🔒 Lock" — a remote Leadership session skips only the automatic
// kind, since it's always that person's own private phone/computer, never a shared house iPad. The
// manual Lock button always calls this with no argument, so it keeps working either way.
function lockApp(auto){
  if(!state.userId) return; // already locked
  if(auto && isRemoteLeadershipSession) return;
  // don't lose anything the current user was mid-typing
  if(document.activeElement && typeof document.activeElement.blur === "function") document.activeElement.blur();
  if(state.view==="dailycaredetail" && state.dcResidentId) syncFormToState(state.dcResidentId);
  state.userId = null;
  pinBuffer = "";
  pinError = false;
  render();
}
function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  if(state.userId && !isRemoteLeadershipSession) idleTimer = setTimeout(()=>lockApp(true), IDLE_LOCK_MS);
}
function pinDigit(d){
  if(pinBuffer.length>=4) return;
  pinError = false;
  pinBuffer += String(d);
  if(pinBuffer.length===4){
    // Knollview pilot: this device is bound to a house whose PINs live in Supabase now — verify
    // there instead of against the local list. Every other device never takes this branch.
    if(isDeviceSupabaseLive()){
      const pin = pinBuffer;
      pinBuffer = "";
      attemptSupabasePinLogin(pin);
      return;
    }
    const match = STAFF.find(s=>s.pin===pinBuffer);
    // Land on this staff member's first assigned house by default (their only house for most staff;
    // float staff assigned to more than one land on the first and can switch from the sidebar picker —
    // see renderSidebar()) rather than whichever house the device was last left on.
    if(match){ state.userId = match.id; state.house = staffHouseIds(match)[0]; pinBuffer=""; resetIdleTimer(); render(); }
    else { pinError = true; render(); setTimeout(()=>{ pinBuffer=""; pinError=false; render(); }, 500); }
  } else {
    render();
  }
}
function pinBackspace(){ pinBuffer = pinBuffer.slice(0,-1); pinError=false; render(); }
function renderLockScreen(){
  const overlay = document.getElementById("lockScreen");
  overlay.style.display = "flex";
  if(remoteLoginOpen){ renderRemoteLoginScreen(overlay); return; }
  const dots = [0,1,2,3].map(i => `<span class="pin-dot ${i<pinBuffer.length?'filled':''} ${pinError?'error':''}"></span>`).join("");
  const keys = [1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  const title = supabaseBusyMsg ? supabaseBusyMsg
    : pinError ? (supabaseLoginError || "PIN not recognized")
    : "Enter your 4-digit PIN";
  overlay.innerHTML = `
    <div class="lock-card">
      <div class="brand" style="justify-content:center; margin-bottom:6px;">
        <div class="brand-mark">NH</div>
        <div class="brand-text" style="text-align:left;"><div class="top">New Horizon Homes</div><div class="sub">${houses[0] ? esc(houses[0].name) : "House Dashboard"} · House Dashboard</div></div>
      </div>
      <div class="lock-title">${title}</div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-pad">
        ${keys.map(k=> k==="" ? `<span></span>` : k==="⌫" ? `<button class="pin-key pin-key-del" onclick="pinBackspace()">⌫</button>` : `<button class="pin-key" onclick="pinDigit(${k})">${k}</button>`).join("")}
      </div>
      <div class="lock-hint">Locks automatically when this tab isn't active, or after ${IDLE_LOCK_MS/60000} minutes idle — so it's always clear which caregiver documented what.</div>
      <div class="lock-hint" style="margin-top:14px;"><a href="#" onclick="openRemoteLogin(); return false;" style="color:var(--accent);">Sign in remotely (Leadership) →</a></div>
    </div>`;
}
// Remote Leadership sign-in — email first. If that account has never set a password we auto-send a
// one-time SETUP LINK (expected only for a brand-new Leadership member) and show "linkSent"; otherwise
// we ask for the password. A separate emailed one-time CODE is a forgot-password fallback, reachable
// only from the password screen. Shown in place of the PIN pad on the same lock-screen overlay;
// "← Back to PIN pad" returns to it untouched, except mid-way through setting a password (no bail-out
// but "Cancel and sign out", since a stray abandoned session there just gets re-prompted next time).
function renderRemoteLoginScreen(overlay){
  const busy = remoteLoginBusy;
  let body;
  if(remoteLoginStage === "email"){
    body = `
      <div class="lock-title" style="font-size:15px; font-weight:600;">Enter your leadership email to continue.</div>
      <div class="dc-inline-input" style="margin:14px 0;">
        <input id="remoteLoginEmail" type="email" placeholder="you@nhresidentialcare.com" value="${esc(remoteLoginEmail)}" style="width:100%;" ${busy?"disabled":""} onkeydown="if(event.key==='Enter') submitRemoteLoginEmail();">
      </div>

      <button class="btn primary" style="width:100%; margin-top:8px;" onclick="submitRemoteLoginEmail()" ${busy?"disabled":""}>${busy?"Checking…":"Continue"}</button>
    `;
  } else if(remoteLoginStage === "linkSent"){
    body = `
      <div class="lock-title" style="font-size:15px; font-weight:600;">Check your email.</div>
      <div class="lock-hint" style="margin:6px 0 14px;">This looks like your first time signing in remotely — we sent a link to <strong>${esc(remoteLoginEmail)}</strong> to set up your password. Open it on this device to finish.</div>

// Starts empty for the live pilot — real shift announcements get posted from the Dashboard once

let announcements = [];

function fmtWhen(d){
  return d.toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
function expiresLabel(d){
  const hrs = (d - nowRef())/3600000;
  if(hrs<0) return "Expired";
  if(hrs<36) return `Expires ${fmtWhen(d)} · ~${Math.round(hrs)} hrs left`;
  return `Expires ${fmtWhen(d)}`;
}
function quickExtend(id,hours){
  const a = announcements.find(x=>x.id===id);
  if(!a) return;
  if(a.author !== currentUser().name) return; // only the original poster may extend
  a.expiresAt = new Date(a.expiresAt.getTime() + hours*3600000);
  const label = hours>=24 ? `${Math.round(hours/24)} day${hours>24?'s':''}` : `${hours} hrs`;
  a.history.push(`Extended by ${currentUser().name} — +${label}`);
  render();
}
function customExtend(id){
  const input = document.getElementById('customExtend-'+id);
  if(!input || !input.value) return;
  const a = announcements.find(x=>x.id===id);
  if(!a || a.author !== currentUser().name) return; // only the original poster may extend
  a.expiresAt = new Date(input.value);
  a.history.push(`Extended by ${currentUser().name} — set to ${fmtWhen(a.expiresAt)}`);
  render();
}
function toggleComposeCustom(){
  const dur = document.getElementById('announceDuration').value;
  document.getElementById('announceCustomWrap').style.display = dur==='custom' ? 'inline-flex' : 'none';
}
function postAnnouncement(){
  const msgEl = document.getElementById('announceMsg');
  const durEl = document.getElementById('announceDuration');
  const customEl = document.getElementById('announceCustom');
  const msg = msgEl.value.trim();
  if(!msg) return;
  const id = currentUser();
  let expiresAt;
  if(durEl.value==='custom'){
    expiresAt = customEl.value ? new Date(customEl.value) : new Date(nowRef().getTime()+24*3600000);
  } else {
    expiresAt = new Date(nowRef().getTime() + Number(durEl.value)*3600000);
  }
  announcements.unshift({ id:nextAnnId++, house: state.house, author:id.name, role:id.label, rail:id.rail, message:msg, postedAt:new Date(nowRef()), expiresAt, history:[] });
  msgEl.value = "";
  render();
}
function announceShift(delta){
  const active = announcements.filter(a => a.house===state.house && (a.expiresAt - nowRef()) > 0);
  if(active.length===0) return;
  state.announceIndex = (state.announceIndex + delta + active.length) % active.length;
  render();
}
function toggleComposeOpen(){ state.composeOpen = !state.composeOpen; render(); }
function renderAnnouncements(){
  const active = announcements.filter(a => a.house===state.house && (a.expiresAt - nowRef()) > 0);
  const me = currentUser();
  if(state.announceIndex >= active.length) state.announceIndex = 0;
  const a = active[state.announceIndex];

  const cardHtml = !a ? `<div class="card" style="padding:16px 18px; text-align:center; font-size:13px; color:var(--text-faint);">No active shift announcements right now.</div>` : (() => {
    const mine = a.author === me.name;
    return `

            ${mine ? `

              <button class="btn small" onclick="quickExtend(${a.id},24)">+24 hrs</button>
              <button class="btn small" onclick="quickExtend(${a.id},168)">+1 week</button>
              <input type="datetime-local" id="customExtend-${a.id}">

            </div>` : `<span class="announce-locked">🔒 Only ${a.author} can extend this</span>`}
          </div>
        </div>
      </div>`;
  })();

  const navHtml = active.length>1 ? `
    <div class="announce-carousel-nav">
      <button class="btn small" onclick="announceShift(-1)">‹ Prev</button>
      <span class="announce-dots">${active.map((_,i)=>`<span class="dot-ind ${i===state.announceIndex?'active':''}"></span>`).join("")}</span>
      <button class="btn small" onclick="announceShift(1)">Next ›</button>
    </div>` : "";

  const composeHtml = !state.composeOpen ? "" : `
    <div class="card announce-compose">
      <div class="posting-as">Posting as <b>${me.name}</b> (${me.label})</div>
      <textarea id="announceMsg" placeholder="Leave a reminder for the next shift..."></textarea>
      <div class="announce-compose-row">
        <select id="announceDuration" onchange="toggleComposeCustom()">
          <option value="12">Runs for: rest of this shift (~12 hrs)</option>
          <option value="24">Runs for: 24 hours</option>
          <option value="168">Runs for: 1 week</option>
          <option value="custom">Runs until: custom date &amp; time</option>
        </select>
        <span id="announceCustomWrap" style="display:none;"><input type="datetime-local" id="announceCustom"></span>
        <button class="btn primary small" onclick="postAnnouncement()">Post Announcement</button>
      </div>
    </div>`;

  return `
  <div class="section announce-section">
    <div class="section-head">
      <h2>Shift Announcements${active.length>1 ? ` <span class="hint">(${state.announceIndex+1} of ${active.length})</span>` : ""}</h2>
      <button class="btn small" onclick="toggleComposeOpen()">${state.composeOpen ? "Cancel" : "+ Leave a reminder"}</button>
    </div>
    ${cardHtml}
    ${navHtml}
    ${composeHtml}
  </div>`;
}

// Sidebar groups that reveal their real, unchanged nav items underneath a single expandable header —
// "Meals" folds in Food Menu + Food Photos, "Admin" folds in Pending Approvals + Manage Staff. Each
// item still routes to exactly the same view it always did; only where it shows up in the sidebar
// changes. See groupNavItems()/renderSidebar().
const NAV_GROUP_OF = { menu:"meals", foodphotos:"meals", approvals:"admin", staff:"admin", houses:"admin" };
const NAV_GROUP_META = { meals:{label:"Meals", icon:"▤"}, admin:{label:"Admin", icon:"⚙"} };
function groupNavItems(items){
  const groups = {};
  const out = [];
  items.forEach(item=>{
    const groupId = NAV_GROUP_OF[item.id];
    if(!groupId){ out.push(item); return; }
    let g = groups[groupId];
    if(!g){
      const meta = NAV_GROUP_META[groupId];
      g = { id:groupId, label:meta.label, icon:meta.icon, isGroup:true, children:[] };
      groups[groupId] = g;
      out.push(g);
    }
    g.children.push(item);
  });
  return out;
}

function canEdit(){ const r=currentUser().role; return r==="manager" || r==="leadership"; }

/* ---------------- Module permissions (Batch 9 — role-based only) ----------------
   Access is now determined ENTIRELY by which of the four roles a staff member holds — House Manager,
   Caregiver, Leadership, or PRN — with no per-person override matrix anymore (Manage Staff used to let
   an admin fine-tune view/edit/none per module per person; that's gone, confirmed with Johnna, since it
   made "what can this person do" a two-place lookup instead of one). PRN is new: view-only everywhere,
   the same as Caregiver's default tier below, with the one exception that PRN never gets the Batch 9
   caregiver-propose abilities (isCaregiver() below is checked by role string, not by tier). */
const MODULES = [
  {key:"dashboard", label:"Dashboard"},
  {key:"residents", label:"Residents & Care Plans"},
  {key:"dailycare", label:"Care Log"},
  {key:"incidents", label:"Incident Reports"},
  {key:"calendar", label:"Calendar"},
  {key:"menu", label:"Food Menu"},
  {key:"showers", label:"Shower Schedule"},
  {key:"supplies", label:"Supplies Received"},
  {key:"foodphotos", label:"Food Photo QC"},
  {key:"directory", label:"Directory"}
];
function defaultPermissionsForRole(role){
  const tier = (role==="manager" || role==="leadership") ? "edit" : "view";
  const perms = {};
  MODULES.forEach(m=>{ perms[m.key] = tier; });
  return perms;
}
// Kept for the Manage Staff summary tag-list — now always just the role default, since there's no more
// per-person override to fall back from.
function staffPermissions(staff){ return defaultPermissionsForRole(staff.role); }
function moduleAccess(key){
  const u = currentUser();
  if(!u) return "none";
  return defaultPermissionsForRole(u.role)[key] || "view";
}
function moduleView(key){ return moduleAccess(key) !== "none"; }
function moduleEdit(key){ return moduleAccess(key) === "edit"; }
// "Admin" (can add/remove staff, assign PINs) is the leadership role itself, not a separate
// hand-maintained name list like MENU_ADMINS — so a newly added leadership account is automatically an
// admin too, without editing code.
function isSystemAdmin(){ const u = currentUser(); return !!u && u.role === "leadership"; }
// Batch 9: a Caregiver (and only a Caregiver — not PRN, not a House Manager who happens to lack edit
// somewhere) can propose a change in four areas even without edit rights on that module: it shows up
// live immediately, tagged Pending, until a house manager or leadership user reviews it. See
// residentSectionApprovals / the *Pending()/approve*/deny* functions below for how each area implements
// this on top of its existing data shape.
function isCaregiver(){ const u = currentUser(); return !!u && u.role === "caregiver"; }
function canProposeResidents(){ return moduleEdit('residents') || isCaregiver(); }
function canProposeMenu(){ return moduleEdit('menu') || isCaregiver(); }
function canProposeSupplies(){ return moduleEdit('supplies') || isCaregiver(); }
function canProposeCalendar(){ return moduleEdit('calendar') || isCaregiver(); }
// Guards direct navigation (not just what the nav sidebar shows) into a module a staff member's
// permissions don't allow — render() bounces back to the dashboard rather than rendering a screen
// someone tapped their way into before a permission changed, or via a stray deep link.
function canAccessView(view){
  if(view==="approvals") return true; // Batch 9: every role can open Pending Approvals now
  if(view==="staff") return isSystemAdmin();
  if(view==="houses") return isSystemAdmin();
  if(view==="manageresidents") return moduleEdit("residents");
  if(view==="resident") return moduleView("residents");
  if(view==="dailycaredetail") return moduleView("dailycare");
  if(view==="incidentdetail") return moduleView("incidents");
  if(MODULES.some(m=>m.key===view)) return moduleView(view);
  return true;
}

/* ---------------- Pending Approvals (Batch 9) ----------------
   Visible to every role now (item 49) — a Caregiver or PRN sees the same list, read-only, so they can
   see what's waiting on a house manager without being able to act on it. Leadership sees something
   different entirely: a full house-by-house, requester-by-requester history with a real three-way
   status (Approved / Waiting for Approval / Denied) rather than a flat pending-only list (item 50) — see
   renderApprovalsHistoryForLeadership(). Everyone else gets the queue view below. */
function approvalCard(title, detail, addedBy, canAct, approveOnclick, denyOnclick){
  return `<div class="card" style="padding:14px 18px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:flex-start;">
    <div>

      <span class="hint" style="margin:0;">Added by ${esc(addedBy)}</span>
    </div>
    ${canAct ? `<div class="routine-quicklog-actions" style="margin-top:0;">
      <button class="btn primary small" onclick="${approveOnclick}">Approve</button>
      <button class="btn small" onclick="${denyOnclick}">Deny</button>
    </div>` : `<span class="hint" style="margin:0;">Waiting for Approval</span>`}
  </div>`;
}

      ${pendingCal.map(e=>approvalCard(`Calendar event — ${esc(e.t)}`, `${fmtIsoLabel(e.day)}${e.time?" · "+fmtEventTime(e.time):""}`, e.createdBy, canActCalendar, `approveCalendarEvent('${e.day}',${e.id})`, `denyCalendarEvent('${e.day}',${e.id})`)).join("")}
      ${pendingIR.map(({residentId, rep})=>{
        const r = residents.find(x=>x.id===residentId);
        return approvalCard(`Incident Report — ${r ? r.name : residentId}`, `${rep.types.length ? rep.types.join(", ") : "Type not specified"}${rep.info.incidentDate ? ` · ${rep.info.incidentDate}` : ""}`, rep.statements.managerReview.submittedBy, canActIncidents, `approveIncidentManagerReview('${residentId}',${rep.id})`, `denyIncidentManagerReview('${residentId}',${rep.id})`);
      }).join("")}
    </div>`}
  </div>`;
}
// Everything that has ever gone through an approval flow, across every house — company-wide items
// (medication names, diagnoses) grouped under "Company-wide" since they were never scoped to one house.
// Only items that actually needed a decision carry a status at all — a manager/leadership addition never
// gets tagged, so ordinary day-to-day entries don't clutter this history (see the *Pending()/save*
// functions above for exactly which additions get a status and which don't).
function allApprovalItemsFlat(){
  const items = [];
  pendingDiagnoses.forEach(d=> items.push({ kind:"Diagnosis option", house:null, label:d.name, addedBy:d.addedBy, addedAt:d.addedAt, status:d.status, decidedBy:d.decidedBy, decidedAt:d.decidedAt }));
  commonMedications.forEach(m=> items.push({ kind:"Medication name", house:null, label:m.name, addedBy:m.addedBy, addedAt:m.addedAt, status:m.status, decidedBy:m.decidedBy, decidedAt:m.decidedAt }));
  Object.keys(residentMealNotes).forEach(residentId=>{
    const r = residents.find(x=>x.id===residentId);
    (residentMealNotes[residentId]||[]).forEach(n=> items.push({ kind:"Food Menu instruction", house: r?r.house:null, label:(r?r.name:residentId)+": "+n.text, addedBy:n.addedBy, addedAt:n.addedAt||"", status:n.status, decidedBy:n.decidedBy||n.approvedBy, decidedAt:n.decidedAt }));
  });
  Object.keys(residentBreakfastPlans).forEach(residentId=>{
    const r = residents.find(x=>x.id===residentId);
    (residentBreakfastPlans[residentId]||[]).forEach(p=>{
      if(!p.status) return;
      items.push({ kind:"Breakfast plan", house:r?r.house:null, label:(r?r.name:residentId)+": "+p.label, addedBy:p.addedBy||"", addedAt:p.addedAt||"", status:p.status, decidedBy:p.decidedBy, decidedAt:p.decidedAt });
    });
  });
  suppliesReceived.forEach(s=>{
    if(!s.status) return;
    const r = residents.find(x=>x.id===s.residentId);
    items.push({ kind:"Supplies Received", house:r?r.house:null, label:(r?r.name:s.residentId)+": "+s.item, addedBy:s.addedBy, addedAt:s.addedAt, status:s.status, decidedBy:s.decidedBy, decidedAt:s.decidedAt });
  });
  // Master menu cells default to status "approved" with no decision on file (never touched by a House
  // Manager) — only list one here once it's actually gone through a propose/decide cycle, same
  // "only items that needed a decision" rule as everywhere else in this history. Company-wide, so
  // house is always null (matches diagnosis/medication names above).
  ["A","B"].forEach(week=>{
    ["Breakfast","Lunch","Dinner"].forEach(meal=>{
      menuDays.forEach(day=>{
        const cell = masterMenu[week][meal][day];
        if(cell.status!=="pending" && !cell.decidedAt) return;
        items.push({ kind:"Master menu", house:null, label:`${meal} · ${day} (Week ${week}): ${cell.item||"(blank)"}`, addedBy:cell.proposedBy||cell.decidedBy||"", addedAt:cell.proposedAt||"", status:cell.status, decidedBy:cell.decidedBy, decidedAt:cell.decidedAt });
      });
    });
  });
  Object.keys(calendarEvents).forEach(day=>{
    (calendarEvents[day]||[]).forEach(e=>{
      if(!e.status) return;
      items.push({ kind:"Calendar event", house:e.house, label:e.t+" — "+fmtIsoLabel(day), addedBy:e.createdBy, addedAt:e.createdAt, status:e.status, decidedBy:e.decidedBy, decidedAt:e.decidedAt });
    });
  });
  residents.forEach(r=>{
    (visitors[r.id]||[]).forEach(v=>{
      if(!v.status) return;
      items.push({ kind:"Approved Visitor", house:r.house, label:r.name+": "+v.name, addedBy:v.addedBy, addedAt:v.addedAt||"", status:v.status, decidedBy:v.decidedBy, decidedAt:v.decidedAt });
    });
  });
  Object.keys(residentSectionApprovals).forEach(residentId=>{
    const r = residents.find(x=>x.id===residentId);
    Object.keys(residentSectionApprovals[residentId]).forEach(sectionKey=>{
      const a = residentSectionApprovals[residentId][sectionKey];
      items.push({ kind:"Resident profile — "+(RESIDENT_SECTION_LABELS[sectionKey]||sectionKey), house:r?r.house:null, label:r?r.name:residentId, addedBy:a.addedBy, addedAt:a.addedAt, status:a.status, decidedBy:a.decidedBy, decidedAt:a.decidedAt });
    });
  });
  allIncidentReports().forEach(({resident:r, rep})=>{
    const mr = rep.statements.managerReview;
    if(!mr || !mr.status) return;
    items.push({ kind:"Incident Report — house manager sign-off", house:r?r.house:null, label:r?r.name:rep.residentId, addedBy:mr.submittedBy, addedAt:mr.submittedAt, status:mr.status, decidedBy:mr.decidedBy, decidedAt:mr.decidedAt });
  });
  return items;
}
function renderApprovalsHistoryForLeadership(){
  const items = allApprovalItemsFlat();
  const byHouse = {};
  items.forEach(it=>{
    const houseKey = it.house || "__company__";
    if(!byHouse[houseKey]) byHouse[houseKey] = {};
    const req = it.addedBy || "Unknown";
    if(!byHouse[houseKey][req]) byHouse[houseKey][req] = [];
    byHouse[houseKey][req].push(it);
  });
  const houseKeys = Object.keys(byHouse).sort((a,b)=>{
    if(a==="__company__") return 1; if(b==="__company__") return -1;
    const ha=(houses.find(h=>h.id===a)||{}).name||a, hb=(houses.find(h=>h.id===b)||{}).name||b;
    return ha.localeCompare(hb);
  });
  const statusBadge = s => s==="approved" ? badge("good","Approved") : s==="denied" ? badge("fall","Denied") : badge("away","Waiting for Approval");
  const body = houseKeys.length ? houseKeys.map(hk=>{
    const houseName = hk==="__company__" ? "Company-wide" : ((houses.find(h=>h.id===hk)||{}).name || hk);
    const reqKeys = Object.keys(byHouse[hk]).sort();
    return `<div class="card" style="padding:16px 20px; margin-bottom:14px;">
      <div style="font-weight:700; font-size:15px; margin-bottom:10px;">${esc(houseName)}</div>
      ${reqKeys.map(req=>`
        <div style="margin-bottom:12px;">
          <div class="dc-label" style="margin-bottom:6px;">${esc(req)}</div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${byHouse[hk][req].map(it=>`
              <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; padding:8px 10px; border:1px solid var(--border); border-radius:8px;">
                <div>
                  <div style="font-size:13.5px; font-weight:600;">${esc(it.kind)}</div>
                  <div class="hint" style="margin:2px 0 0;">${esc(it.label)}${it.addedAt?` · ${esc(it.addedAt)}`:""}${it.decidedBy?` · Reviewed by ${esc(it.decidedBy)}`:""}</div>
                </div>
                ${statusBadge(it.status)}
              </div>`).join("")}
          </div>
        </div>`).join("")}
    </div>`;
  }).join("") : `<div class="card" style="padding:18px 20px;"><div class="cp-hint" style="font-style:italic;">No approval history yet.</div></div>`;
  document.getElementById("content").innerHTML = `
  <div class="section">
    <div class="section-head">
      <h2>Pending Approvals</h2>
      <span class="hint">Every item that's ever needed a house manager's review, across every house — grouped by house (company-wide items on their own), then by who submitted it, with its current status.</span>
    </div>
    ${body}
  </div>`;
}

/* ---------------- Manage Staff (leadership/admin only) ---------------- */
const ROLE_LABELS = { manager:"House Manager", caregiver:"Caregiver", leadership:"Leadership", prn:"PRN" };
const ROLE_RAILS = { manager:"var(--accent)", caregiver:"var(--away-dot)", leadership:"var(--hospice-dot)", prn:"var(--good-dot)" };
function computeInitials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function slugifyStaffId(name){
  const base = (name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "staff";
  let id = base, n = 2;
  while(STAFF.some(s=>s.id===id)){ id = base+"-"+n; n++; }
  return id;
}
function isLastLeadership(staff){ return staff.role==="leadership" && STAFF.filter(s=>s.role==="leadership").length<=1; }

// Batch G: distinguishes a real Supabase-backed staff record (id is that person's actual auth.users
// uuid, set by upsertLocalStaffRecord/addStaffMember's live path) from a local-only one (id is a slug
// minted by slugifyStaffId, e.g. "priya-manager") — only the former has any real row to write to.
function isRealStaffId(id){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||""); }
function shiftKindForSupabase(shift){ return shift==="Night" ? "night" : shift==="Day" ? "day" : "n_a"; }

// Toggles one house's membership in the in-progress add-staff draft — at least one house always has to

// Batch G: when signed in with a real Supabase session (any Leadership session — the PIN pad on a
// live house device, or remote sign-in from anywhere — Manage Staff itself is cross-house/global, so
// this isn't gated by isDeviceSupabaseLive() the way per-house resident data is; see the file's Batch
// G comment block), this creates a REAL login/profile/house-assignment set via the pin-login Edge
// Function's create_staff action (already built — see auth_design.md/the file-top Batch G note) rather
// than just pushing into the local STAFF array. Non-live sessions keep working exactly as before.
async function addStaffMember(){
  if(!isSystemAdmin() || !state.staffDraft) return;
  syncStaffDraftFormToState();
  const pin = (state.staffDraft.pin||"").trim();
  const name = (state.staffDraft.name||"").trim();
  const email = (state.staffDraft.email||"").trim().toLowerCase();
  if(!name){ state.staffAddError = "Enter a name."; scheduleRender(); return; }
  if(!/^\d{4}$/.test(pin)){ state.staffAddError = "PIN must be exactly 4 digits."; scheduleRender(); return; }
  const staffHouses = (state.staffDraft.houses||[]).filter(id=>houses.some(h=>h.id===id));
  if(!staffHouses.length){ state.staffAddError = "Choose at least one house."; scheduleRender(); return; }
  const role = state.staffDraft.role;

  if(supabaseSession){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.staffAddError = "Enter a valid email — it's what this person signs in with."; scheduleRender(); return; }
    state.staffAddBusy = true; state.staffAddError = null; scheduleRender();
    try{
      const resp = await fetch(PIN_LOGIN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + supabaseSession.access_token,
          "apikey": SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ action:"create_staff", full_name:name, email, role, house_ids: staffHouses, is_menu_admin:false, pin })
      });
      const result = await resp.json();
      if(!resp.ok) throw new Error(result.error || "Could not add that staff member.");
      STAFF.push({
        id: result.id, pin: null, pinPlain: result.pin_warning ? null : pin, name, role, email,
        label: ROLE_LABELS[role], rail: ROLE_RAILS[role],
        shift: role==="leadership" ? "n/a" : state.staffDraft.shift,
        houses: staffHouses, initials: computeInitials(name)
      });
      state.staffAddOpen = false;
      state.staffDraft = null;
      // Not fatal — the account/profile/house assignments are all good even if the starting PIN
      // didn't take (e.g. it collided with someone else's); surface it so Leadership knows to set one.
      state.staffListNotice = result.pin_warning ? `${name} was added, but the starting PIN wasn't set: ${result.pin_warning} Set one from their row below.` : `${name} was added.`;
    } catch(err){
      console.error("create_staff failed:", err);
      state.staffAddError = (err && err.message) ? err.message : "Could not add that staff member.";
    } finally {
      state.staffAddBusy = false;
      scheduleRender();
    }
    return;
  }

  if(STAFF.some(s=>s.pin===pin)){ state.staffAddError = "That PIN is already in use — choose a different one."; scheduleRender(); return; }
  STAFF.push({
    id: slugifyStaffId(name), pin, name, role, email,
    label: ROLE_LABELS[role], rail: ROLE_RAILS[role],
    shift: role==="leadership" ? "n/a" : state.staffDraft.shift,
    houses: staffHouses,
    initials: computeInitials(name)
  });
  state.staffAddOpen = false;
  state.staffAddError = null;
  state.staffDraft = null;
  scheduleRender();
}
